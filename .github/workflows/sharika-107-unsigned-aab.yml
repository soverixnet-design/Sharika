name: Sharika 1.0.7 unsigned AAB native diagnostics

on:
  push:
    branches:
      - feature/sharika-107-datastore-symbol-experiment-20261109
    paths:
      - '.github/workflows/sharika-107-unsigned-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-aab:
    name: Build unsigned 1.0.7 AAB and inspect upstream native code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Sharika candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify isolated 1.0.7 code and backend
        run: |
          set -euo pipefail
          grep -F 'versionCode 107' android-staging/app/build.gradle
          grep -F "versionName = productionApiOrigin ? '1.0.7'" android-staging/app/build.gradle
          grep -F "implementation 'androidx.datastore:datastore-preferences:1.3.0'" android-staging/app/build.gradle
          node --test cloudflare/test/android-production-routing.test.mjs
          node --test android-staging/play-virtual-ui.test.mjs

      - name: Checkout pinned user-owned original art
        uses: actions/checkout@v4
        with:
          repository: soverixnet-design/sovera-voice-app
          ref: 0e30b48962272b8a687509aef4dee9bc4a047767
          path: _sovera_cosmetics
          persist-credentials: false

      - name: Pack original room effects without changing uploaded files
        run: |
          set -euo pipefail
          mkdir -p android-staging/app/src/main/assets/sovera-effects android-staging/app/src/main/assets/sovera-medals android-staging/app/src/main/assets/sovera-sounds
          cp -a _sovera_cosmetics/assets/effects/. android-staging/app/src/main/assets/sovera-effects/
          cp -a _sovera_cosmetics/assets/medals/. android-staging/app/src/main/assets/sovera-medals/
          cp -a _sovera_cosmetics/assets/sounds/. android-staging/app/src/main/assets/sovera-sounds/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android platform 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Resolve DataStore and build unsigned AAB
        working-directory: android-staging
        env:
          SHARIKA_PLAY_API_ORIGIN: https://sharika-api-play-virtual.soverixnet.workers.dev
          SHARIKA_PLAY_STAGING_CANDIDATE: 'false'
        run: |
          set -euo pipefail
          gradle :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency datastore-core-android --no-daemon
          gradle :app:bundleRelease --no-daemon --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -tqq app/build/outputs/bundle/release/app-release.aab

      - name: Inspect native DataStore and AAB metadata
        run: |
          set -euo pipefail
          bundle=android-staging/app/build/outputs/bundle/release/app-release.aab
          echo 'SHARIKA_107_UNSIGNED_AAB_DIAGNOSTIC_ONLY_NOT_FOR_PLAY'
          unzip -p "$bundle" BUNDLE-METADATA/com.android.tools.build.libraries/dependencies.pb | strings | grep -E 'androidx.datastore|1.3.0|1.1.7' | head -n 60 || true
          if unzip -Z1 "$bundle" | grep -q 'base/lib/.*/libdatastore_shared_counter.so'; then
            echo 'SHARIKA_NATIVE_DATASTORE_PRESENT'
            unzip -p "$bundle" base/lib/arm64-v8a/libdatastore_shared_counter.so > "$RUNNER_TEMP/datastore-counter.so"
            readelf -SW "$RUNNER_TEMP/datastore-counter.so" | grep -E 'symtab|debug_|dynsym' || true
          else
            echo 'SHARIKA_NATIVE_DATASTORE_ABSENT'
          fi
          if unzip -Z1 "$bundle" | grep -q 'BUNDLE-METADATA/com.android.tools.build.debugsymbols'; then
            echo 'SHARIKA_NATIVE_DEBUG_SYMBOL_METADATA_PRESENT'
          else
            echo 'SHARIKA_NATIVE_DEBUG_SYMBOL_METADATA_ABSENT'
          fi

      - name: Save unsigned diagnostic bundle only
        uses: actions/upload-artifact@v4
        with:
          name: Sharika-107-UNSIGNED-DIAGNOSTIC-NOT-FOR-PLAY
          path: android-staging/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
