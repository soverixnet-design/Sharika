name: Sharika active admin modules (staging Workers only)
on:
  push:
    branches:
      - feature/sharika-admin-activate-20261101
    paths:
      - '.github/workflows/sharika-admin-activate-staging.yml'

permissions:
  contents: read

concurrency:
  group: sharika-isolated-staging-worker-publish
  cancel-in-progress: false

jobs:
  publish-admin:
    name: Verify and publish existing staging API + admin
    runs-on: ubuntu-latest
    environment: sharika-staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact branch and existing isolated staging services
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const api=JSON.parse(readFileSync('cloudflare/wrangler.jsonc','utf8'));
          const admin=JSON.parse(readFileSync('cloudflare/wrangler.admin.jsonc','utf8'));
          if(process.env.GITHUB_REF!=='refs/heads/feature/sharika-admin-activate-20261101' ||
             !process.env.CLOUDFLARE_API_TOKEN ||
             api.name!=='sharika-api-staging' ||
             api.account_id!=='d81cf7c48fb9b36d468cb0a08720cd74' ||
             api.vars?.SHARIKA_ENV!=='staging' ||
             api.vars?.SHARIKA_LUCKY_GIFTS_ENABLED!=='false' ||
             api.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=='false' ||
             api.keep_vars!==true ||
             api.d1_databases?.length!==1 ||
             api.d1_databases[0].binding!=='DB' ||
             api.d1_databases[0].database_name!=='sharika-staging' ||
             api.d1_databases[0].database_id!=='b2c62252-12a5-4740-90c7-01a536d9a39a' ||
             api.durable_objects?.bindings?.[0]?.name!=='VOICE_ROOMS' ||
             admin.name!=='sharika-admin-staging' ||
             admin.account_id!==api.account_id ||
             admin.services?.length!==1 ||
             admin.services[0].binding!=='SHARIKA_API' ||
             admin.services[0].service!=='sharika-api-staging')
            throw Error('Unsafe environment or missing bindings; refusing publish');
          console.log('Exact isolated staging resources verified');
          NODE
      - name: Verify all Worker and admin tests
        run: npm --prefix cloudflare run check
      - name: Confirm Special ID migration 0032 exists; never apply migrations here
        run: |
          node --input-type=module - <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/b2c62252-12a5-4740-90c7-01a536d9a39a/query';
          const sql="SELECT (SELECT COUNT(*) FROM d1_migrations) AS migrations,"+
            "(SELECT COUNT(*) FROM d1_migrations WHERE name='0032_special_ids.sql') AS special,"+
            "(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='sharika_special_ids') AS special_table";
          const r=await fetch(base,{method:'POST',headers:{
            Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type':'application/json'},body:JSON.stringify({sql})});
          const json=await r.json(),row=json.result?.[0]?.results?.[0];
          if(!r.ok||!json.success||row?.migrations!==32||row?.special!==1||row?.special_table!==1)
            throw Error('Remote D1 schema diverged; refusing both Worker deployments');
          console.log('Existing D1 schema verified; no migration performed');
          NODE
      - name: Inspect current API bundle
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir /tmp/sharika-admin-active-api
      - name: Deploy staging API only
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.jsonc
      - name: Bundle connected admin interface
        run: |
          cp admin/index.html cloudflare/src/admin-index.html
          cp admin/connection.js cloudflare/src/admin-connection.txt
          node --check admin/connection.js
          npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.admin.jsonc --outdir /tmp/sharika-admin-active-ui
      - name: Deploy staging admin only
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.admin.jsonc
      - name: Verify live staging health and connected menu
        run: |
          curl --fail --silent --show-error --max-time 20 https://sharika-api-staging.soverixnet.workers.dev/health
          curl --fail --silent --show-error --max-time 20 https://sharika-admin-staging.soverixnet.workers.dev/health
          curl --fail --silent --show-error --max-time 20 https://sharika-admin-staging.soverixnet.workers.dev/admin/connection.js | grep -F 'Verified game activity' > /dev/null
          echo 'SHARIKA_VERIFIED_ADMIN_MODULES_STAGING_OK'
