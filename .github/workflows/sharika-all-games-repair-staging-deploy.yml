name: Publish Sharika Game Repairs to isolated public/private staging only
on:
  push:
    branches: [fix/sharika-all-games-catalog-rapid-taps-20261120]
    paths: ['.github/workflows/sharika-all-games-repair-staging-deploy.yml']
permissions:
  contents: read
concurrency:
  group: sharika-all-games-repair-staging-rollout
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: sharika-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fail closed on branch, Cloudflare targets, and missing credentials
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/sharika-all-games-catalog-rapid-taps-20261120"
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const publicWorker=read('hosted-game-center/wrangler.jsonc');
          const privateWorker=read('hosted-game-center/wrangler.private.jsonc');
          const account='d81cf7c48fb9b36d468cb0a08720cd74';
          const db='b2c62252-12a5-4740-90c7-01a536d9a39a';
          if(publicWorker.name!=='sharika-games-web-staging'||
             privateWorker.name!=='sharika-private-center-staging'||
             publicWorker.account_id!==account||privateWorker.account_id!==account||
             !publicWorker.workers_dev||!privateWorker.workers_dev||
             !publicWorker.assets?.run_worker_first||!privateWorker.assets?.run_worker_first||
             !publicWorker.assets?.directory||!privateWorker.assets?.directory||
             publicWorker.d1_databases||publicWorker.r2_buckets||
             privateWorker.d1_databases?.length!==1||
             privateWorker.d1_databases[0].database_id!==db)
            throw Error('Staging isolation not verified; REFUSING DEPLOYMENT');
          NODE
      - name: Verify exact read-only game catalog, staged D1 and required tables
        run: |
          node --input-type=module <<'NODE'
          const uri='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/b2c62252-12a5-4740-90c7-01a536d9a39a/query';
          const query=async sql=>{
            const response=await fetch(uri,{method:'POST',headers:{
              Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
              'content-type':'application/json'},body:JSON.stringify({sql})});
            const data=await response.json();
            if(!response.ok||!data.success)throw Error('Staging D1 read-only verification failed');
            return data.result?.[0]?.results||[];
          };
          const games=await query("SELECT id,enabled FROM sharika_game_catalog");
          const objects=await query("SELECT name FROM sqlite_master WHERE type='table' AND name IN ("+
            "'sharika_center_browser_sessions','sharika_center_launch_tickets','sharika_center_publishing')");
          if(games.length<11||objects.length!==3)
            throw Error('Game catalog or private sessions missing; no deploy');
          console.log('Verified existing game catalog and isolated private session schema. NO DATABASE CHANGES.');
          NODE
      - name: Re-run game bridge, static and wallet regression QA
        run: |
          set -euo pipefail
          node hosted-game-center/scripts/build.mjs
          node --check hosted-game-center/src/index.mjs
          node --check hosted-game-center/src/private-index.mjs
          node --check hosted-game-center/web/app.js
          node --test hosted-game-center/test/site.test.mjs hosted-game-center/test/game-availability-smoke.test.mjs
          node --test cloudflare/test/rapid-tap-recovery.test.mjs cloudflare/test/rapid-round-taps.test.mjs
      - name: Dry-run both Workers with unchanged staging-only D1 and public assets
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run --config hosted-game-center/wrangler.jsonc --outdir /tmp/sharika-games-static-dryrun
          npx --yes wrangler@4 deploy --dry-run --config hosted-game-center/wrangler.private.jsonc --outdir /tmp/sharika-games-private-dryrun
      - name: Deploy public READ-ONLY game static assets to existing staging origin
        run: npx --yes wrangler@4 deploy --config hosted-game-center/wrangler.jsonc
      - name: Confirm static iframe is embeddable only from two Sharika hosts
        run: |
          set -euo pipefail
          origin=https://sharika-games-web-staging.soverixnet.workers.dev
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$origin/health" | grep -q sharika-hosted-game-center
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$origin/api/catalog" | grep -q requires_sharika_app
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$origin/games/original-games/greedy-classic-live.js" -o /tmp/sharika-live.js
          test -s /tmp/sharika-live.js
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 -D /tmp/headers -o /dev/null "$origin/games/original-games/greedy-classic.html"
          grep -qi 'frame-ancestors' /tmp/headers
          grep -qi 'sharika-private-center-staging.soverixnet.workers.dev' /tmp/headers
          if grep -qi '^x-frame-options:' /tmp/headers; then echo 'GAME_FRAME_BLOCKED_BY_XFO'; exit 1; fi
      - name: Deploy private authenticated member Game Center to existing STAGING Worker
        run: npx --yes wrangler@4 deploy --config hosted-game-center/wrangler.private.jsonc
      - name: Verify private site retains login barrier; no accidental public wallet
        run: |
          set -euo pipefail
          origin=https://sharika-private-center-staging.soverixnet.workers.dev
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$origin/health" | grep -q private_center
          code="$(curl --silent --show-error --output /tmp/private-anonymous.json --write-out '%{http_code}' --max-time 20 "$origin/api/catalog")"
          test "$code" = "401"
          code="$(curl --silent --show-error --output /tmp/private-wallet.json --write-out '%{http_code}' --max-time 20 "$origin/api/center/wallet")"
          test "$code" = "401"
          echo SHARIKA_GAMES_STATIC_AND_PRIVATE_CENTER_STAGING_SAFE
