name: Sharika isolated Android staging APK

on:
  push:
    branches:
      - feature/sharika-android-staging-20261030
    paths:
      - 'android-staging/**'
      - '.github/workflows/sharika-android-staging-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharika-android-staging-only
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build a staging-only Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-staging
    steps:
      - name: Checkout code (no live app changes)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check that this APK cannot use the wrong Firebase project
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('app/google-services.json', 'utf8'));
          const gradle = fs.readFileSync('app/build.gradle', 'utf8');
          const pkg = c.client?.[0]?.client_info?.android_client_info?.package_name;
          if (c.project_info?.project_id !== 'sharika-voice-chat-app' ||
              pkg !== 'com.soverixnet.sharika' ||
              !gradle.includes("applicationId 'com.soverixnet.sharika'")) {
            throw new Error('Refusing to build unexpected Android Firebase identity');
          }
          console.log('SHARIKA_ANDROID_FIREBASE_IDENTITY_OK');
          NODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile staging APK only
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Save private-test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          path: android-staging/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
