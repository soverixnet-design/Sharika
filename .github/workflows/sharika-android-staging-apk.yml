          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          const d=c.d1_databases?.[0];
          const a=JSON.parse(readFileSync('wrangler.admin.jsonc','utf8'));
          if(c.name!=='sharika-api-staging'||
             c.account_id!=='d81cf7c48fb9b36d468cb0a08720cd74'||
             c.vars?.SHARIKA_ENV!=='staging'||c.workers_dev!==true||
             c.keep_vars!==true||c.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=='false'||
             c.vars?.SHARIKA_LUCKY_GIFTS_ENABLED!=='false'||
             c.d1_databases?.length!==1||d?.binding!=='DB'||
             d.database_name!=='sharika-staging'||
             d.database_id!=='b2c62252-12a5-4740-90c7-01a536d9a39a'||
             c.durable_objects?.bindings?.length!==1||
             c.durable_objects.bindings[0].name!=='VOICE_ROOMS'||
             c.durable_objects.bindings[0].class_name!=='SharikaVoiceRoom'||
             !c.secrets?.required?.includes('REALTIME_SFU_APP_ID')||
             !c.secrets?.required?.includes('REALTIME_SFU_APP_SECRET')||
             a.name!=='sharika-admin-staging'||
             a.account_id!==c.account_id||
             a.vars?.SHARIKA_ENV!=='staging'||
             a.services?.length!==1||a.services[0].binding!=='SHARIKA_API'||
             a.services[0].service!=='sharika-api-staging')
            throw Error('Refusing to deploy unexpected Agency Worker target');
          console.log('AGENCY_BD_HOST_ISOLATED_STAGING_GUARD_OK');
          NODE
      - name: Verify all server tests and policy ledger contracts
        run: npm run check
      - name: Verify previously approved Agency D1 tables without modifying balances
