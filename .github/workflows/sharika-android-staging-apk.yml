name: Sharika isolated Android staging APK

on:
  push:
    branches:
      - feature/sharika-android-staging-20261030
      - feature/sharika-original-games-cards-20261030
      - feature/sharika-lucky-gifts-20261030
      - feature/sharika-staff-seller-entry-20261031
      - fix/sharika-original-games-20261031
      - fix/sharika-admin-exchange-rate-20261031
      - fix/sharika-seller-wallet-split-20261031
      - fix/sharika-seller-self-recharge-wallet-ui-20261031
      - fix/sharika-profile-save-recovery-20261031
      - fix/sharika-shared-room-themes-20261031
      - fix/sharika-two-way-mic-direct-seat-20261031
      - feature/sharika-greedy-wheel-20261031
      - feature/sharika-greedy-wheel-current-20261031
      - feature/sharika-greedy-integrated-staging-20261031
      - feature/sharika-royal-premium-ui-20261031
      - feature/sharika-option1-reference-polish-20261031
      - fix/sharika-remote-audio-unlock-staging-20261101
      - fix/sharika-chat-thread-stability-staging-20261101
      - feature/sharika-premium-tiers-20261031
      - feature/sharika-royal-ranking-20261031
      - feature/sharika-cp-friendship-20261031
      - feature/sharika-royal-premium-bonds-integration-20261101
      - feature/sharika-hd-room-themes-staging-20261101
      - feature/sharika-weekly-opening-single-user-20261101
      - feature/sharika-royal-shop-backpack-20261101
      - feature/sharika-neon-special-id-20261101
      - feature/sharika-notifications-20261101
      - feature/sharika-golden-home-20261101
      - feature/sharika-svip-video-frames-20261101
      - feature/sharika-cp-weekly-rewards-20261101
      - feature/sharika-royal-frame-admin-grants-20261101
      - feature/sharika-master-integration-20261101
      - feature/sharika-royal-profile-20261101
      - fix/sharika-google-login-hd-room-themes-20261101
      - fix/sharika-games-bet-integrity-20261101
    paths:
      - 'android-staging/**'
      - '.github/workflows/sharika-android-staging-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharika-android-staging-only
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build a staging-only Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-staging
    steps:
      - name: Checkout code (no live app changes)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout owner-owned Sovera source cosmetics at a pinned commit
        uses: actions/checkout@v4
        with:
          repository: soverixnet-design/sovera-voice-app
          ref: 0e30b48962272b8a687509aef4dee9bc4a047767
          path: _sovera_cosmetics
          persist-credentials: false

      - name: Bundle original Sovera frames, entrances, medals and sound in staging APK
        run: |
          mkdir -p app/src/main/assets/sovera-effects
          mkdir -p app/src/main/assets/sovera-medals
          mkdir -p app/src/main/assets/sovera-sounds
          cp -a ../_sovera_cosmetics/assets/effects/. app/src/main/assets/sovera-effects/
          cp -a ../_sovera_cosmetics/assets/medals/. app/src/main/assets/sovera-medals/
          cp -a ../_sovera_cosmetics/assets/sounds/. app/src/main/assets/sovera-sounds/
          test "$(find app/src/main/assets/sovera-effects -type f | wc -l)" -ge 30
          for effect in royal-gold.webp violet-love.webp ice-admin.webp vip7.webp phoenix-queen-entry.webp lion-queen-entry.webp; do
            test -s "app/src/main/assets/sovera-effects/$effect"
          done
          echo 'SOVERA_ORIGINAL_COSMETICS_BUNDLED_OFFLINE'

      - name: Check that this APK cannot use the wrong Firebase project
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('app/google-services.json', 'utf8'));
          const gradle = fs.readFileSync('app/build.gradle', 'utf8');
          const pkg = c.client?.[0]?.client_info?.android_client_info?.package_name;
          if (c.project_info?.project_id !== 'sharika-voice-chat-app' ||
              pkg !== 'com.soverixnet.sharika' ||
              !gradle.includes("applicationId 'com.soverixnet.sharika'")) {
            throw new Error('Refusing to build unexpected Android Firebase identity');
          }
          const oauth = c.client?.[0]?.oauth_client || [];
          const androidClient = oauth.find(v => v.client_type === 1);
          const webClient = oauth.find(v => v.client_type === 3);
          const stagingSignerSha1 = 'ab491a1a905a42bf42417d7b62c658b379f32bb0';
          if (!androidClient?.android_info?.certificate_hash || !webClient?.client_id) {
            throw new Error('Google OAuth client IDs missing from google-services.json');
          }
          if (!oauth.some(v => v.client_type === 1 &&
              v.android_info?.package_name === pkg &&
              v.android_info?.certificate_hash?.toLowerCase() === stagingSignerSha1)) {
            throw new Error('Staging APK signing SHA-1 missing from Google OAuth clients');
          }
          console.log('SHARIKA_ANDROID_FIREBASE_IDENTITY_AND_GOOGLE_OAUTH_OK');
          NODE

      - name: Check exact original Sharika UI and isolated Android adapter
        run: |
          node --check staging-connection.js
          node --check app/src/main/assets/greedy-wheel/sharika-bridge.js
          node --check app/src/main/assets/greedy-wheel/game.js
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('../app/index.html', 'utf8');
          const bridge = fs.readFileSync('staging-connection.js', 'utf8');
          if (!html.includes('<title>Sharika Voice Chat App</title>') ||
              !html.includes('<script src="./connection.js">') ||
              !bridge.includes("window.API.login") ||
              !bridge.includes("SharikaNative") ||
              !bridge.includes("fitAndroidViewport(document, false)") ||
              !bridge.includes("fitAndroidViewport(frame.document, true)") ||
              /rfrmcmeyamndghtiheci\.supabase\.co|sb_publishable_/.test(bridge)) {
            throw new Error('Original design or staging-only connection contract failed');
          }
          // These three independent screens MUST ship inside the APK. The
          // original demo wallet/result scripts must not ship as gameplay.
          const vm = require('vm');
          const games=['sovera-food-wheel','night-food-wheel','jackpot-fruit'];
          for (const game of games) {
            const file='app/src/main/assets/original-games/'+game+'.html';
            const body=fs.readFileSync(file,'utf8');
            if(!body.includes('data-original-game=')||
               !body.includes('GameBridge.bet(')||
               /localStorage\.getItem\(['"](?:sv_food|jf_b|g_night)/.test(body))
              throw Error(game+': not server-connected');
            const scripts=[...body.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)];
            for (const script of scripts) new vm.Script(script[1],{filename:file});
          }
          if (!bridge.includes('sharika:original-request')||
              !bridge.includes('event.source!==current.element.contentWindow')||
              !bridge.includes("id:'jackpot-fruit'"))
            throw Error('Original game card/iframe source checking missing');
          const greedy='app/src/main/assets/greedy-wheel/';
          const greedyHtml=fs.readFileSync(greedy+'index.html','utf8');
          const greedyBridge=fs.readFileSync(greedy+'sharika-bridge.js','utf8');
          if(!bridge.includes("id:'greedy-wheel'")||
             !greedyHtml.includes('sharika-bridge.js')||
             greedyHtml.includes('__PORT_8080__')||
             !greedyBridge.includes('sharika:greedy-request')||
             !greedyBridge.includes('window.WebSocket=BridgeSocket'))
            throw Error('Greedy Wheel is not protected by authenticated bridge');
          console.log('SHARIKA_THREE_ORIGINAL_GAMES_SERVER_BRIDGE_VERIFIED');
          console.log('SHARIKA_ORIGINAL_UI_AND_ISOLATED_BRIDGE_VERIFIED');
          NODE

      - name: Validate Royal Shop and Backpack packaging
        run: |
          test -s royal-shop-bg.png
          test -s royal-backpack-bg.png
          test -s royal-market.css
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('staging-connection.js','utf8');
          const gradle=fs.readFileSync('app/build.gradle','utf8');
          for(const asset of ['royal-shop-bg.png','royal-backpack-bg.png','royal-market.css'])
            if(!gradle.includes(asset))throw Error('Missing market asset: '+asset);
          if(!js.includes("api('POST','/cosmetics/purchase'") ||
             !js.includes("api('POST','/cosmetics/equip'") ||
             !js.includes('sharikaOpenRoyalMarket') ||
             !js.includes('sharikaCloseRoyalMarket'))
            throw Error('Verified marketplace operations not packaged');
          console.log('SHARIKA_ROYAL_MARKET_ASSETS_AND_API_OK');
          NODE

      - name: Validate Royal Premium visual-only layer
        run: |
          node --check royal-premium.js
          test -s royal-premium.css
          test -s royal-palace.png
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('royal-premium.js', 'utf8');
          const css = fs.readFileSync('royal-premium.css', 'utf8');
          const gradle = fs.readFileSync('app/build.gradle', 'utf8');
          const java = fs.readFileSync('app/src/main/java/com/soverixnet/sharika/SharikaActivity.java', 'utf8');
          if (!js.includes('iframe.addEventListener(\'load\', styleRoom') ||
              !js.includes("settings.theme === 'mid' && !settings.bg") ||
              !css.includes('html.royal-root') ||
              !css.includes('html.royal-room') ||
              !css.includes('prefers-reduced-motion:reduce') ||
              !['royal-premium.js', 'royal-premium.css', 'royal-palace.png'].every(s => gradle.includes(s)) ||
              !java.includes("s.src='./royal-premium.js'") ||
              !java.includes("s.src='./back-navigation.js'")) {
            throw new Error('Royal Premium packaging/theme safety check failed');
          }
          console.log('SHARIKA_ROYAL_VISUAL_LAYER_STATIC_CHECKS_OK');
          NODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android packages using hosted runner SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Restore required stable staging signer from encrypted GitHub secrets
        env:
          KEY_B64: ${{ secrets.SHARIKA_STAGING_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.SHARIKA_STAGING_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_B64" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Both encrypted signing secrets are required; refusing an unstable debug-signed APK."
            exit 1
          else
            # Mobile paste can insert line breaks or spaces; base64 has no whitespace.
            printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/sharika-staging-signing.p12"
            # Verify the exact expected private staging key, not any replacement.
            printf '%s  %s\n' '0373e29ebef4eaf193af678a108aefd164b12babd811d2b3e87b46b3a3026d0e' "$RUNNER_TEMP/sharika-staging-signing.p12" | sha256sum --check --status
            chmod 600 "$RUNNER_TEMP/sharika-staging-signing.p12"
            echo "SHARIKA_STAGING_KEYSTORE_PATH=$RUNNER_TEMP/sharika-staging-signing.p12" >> "$GITHUB_ENV"
            echo "SHARIKA_STAGING_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Restored private staging signing key (not committed to repository)."
          fi

      - name: Compile staging APK only
        env:
          SHARIKA_STAGING_KEYSTORE_PASSWORD: ${{ secrets.SHARIKA_STAGING_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Android 16 target SDK in compiled APK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "targetSdkVersion:'36'"
          echo 'SHARIKA_ANDROID_TARGET_API_36_VERIFIED'

      - name: Verify original Sovera cosmetics are inside the offline APK
        run: |
          for effect in royal-gold.webp violet-love.webp ice-admin.webp vip7.webp phoenix-queen-entry.webp lion-queen-entry.webp; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/sovera-effects/$effect"
          done
          echo 'SOVERA_FRAMES_ENTRIES_IN_APK_VERIFIED'

      - name: Verify individual transparent SVIP animations are in the APK
        run: |
          test -s app/src/main/assets/sharika-premium/manifest.json
          for asset in vip5-animated svip-frame-01 svip-frame-08 svip-medal-01 svip-tag-17 noble-gold-microphone role-frame-64; do
            test -s "app/src/main/assets/sharika-premium/$asset.webp"
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/sharika-premium/$asset.webp"
          done
          echo 'SHARIKA_SVIP_ROLE_ANIMATED_ASSETS_VERIFIED'

      - name: Check original game cards and HTML are packaged in the staging APK
        run: |
          for card in food-wheel-original-card.png jackpot-fruit-original-card.png; do
            test -s "app/src/main/assets/$card"
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/$card"
          done
          for game in sovera-food-wheel night-food-wheel jackpot-fruit; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/original-games/$game.html"
          done
          echo 'THREE_ORIGINAL_GAMES_PACKAGED'

      - name: Verify uploaded Greedy Wheel visuals and bridge ship in APK
        run: |
          for asset in index.html game.js style.css sharika-bridge.js img/shrimp.webp img/fish.webp img/chicken.webp img/steak.webp img/cabbage.webp img/carrot.webp img/corn.webp img/tomato.webp img/salad.webp img/pizza.webp; do
            test -s "app/src/main/assets/greedy-wheel/$asset"
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/greedy-wheel/$asset"
          done
          echo 'GREEDY_WHEEL_UI_PACKAGED'

      - name: Check Food Wheel card is packaged in the staging APK
        run: |
          test -s app/src/main/assets/food-wheel-card.jpg
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/food-wheel-card.jpg'
          echo 'FOOD_WHEEL_CARD_IN_APK_VERIFIED'

      - name: Confirm Royal Premium assets are bundled inside APK
        run: |
          for asset in royal-premium.js royal-premium.css royal-palace.png; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/$asset"
          done
          echo 'SHARIKA_ROYAL_PREMIUM_APK_ASSETS_VERIFIED'

      - name: Print signing fingerprint for this exact APK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CERTS="$("$SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          echo "$CERTS"
          if [[ "${SHARIKA_STAGING_SIGNING_CONFIGURED:-}" == "true" ]]; then
            printf '%s\n' "$CERTS" | grep -qi 'Signer #1 certificate SHA-1 digest: ab491a1a905a42bf42417d7b62c658b379f32bb0'
            echo 'SHARIKA_STABLE_STAGING_CERTIFICATE_VERIFIED'
          fi

      - name: Save private-test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          path: android-staging/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  royal-emulator-smoke:
    name: Royal UI emulator launch and Back smoke test
    # Only the isolated Option 1 candidate; no live app or staging data writes.
    if: github.ref == 'refs/heads/feature/sharika-option1-reference-polish-20261031' || github.ref == 'refs/heads/fix/sharika-remote-audio-unlock-staging-20261101' || github.ref == 'refs/heads/fix/sharika-chat-thread-stability-staging-20261101' || github.ref == 'refs/heads/feature/sharika-royal-premium-bonds-integration-20261101' || github.ref == 'refs/heads/feature/sharika-hd-room-themes-staging-20261101' || github.ref == 'refs/heads/feature/sharika-royal-shop-backpack-20261101' || github.ref == 'refs/heads/feature/sharika-cp-weekly-rewards-20261101' || github.ref == 'refs/heads/feature/sharika-royal-frame-admin-grants-20261101' || github.ref == 'refs/heads/feature/sharika-master-integration-20261101' || github.ref == 'refs/heads/fix/sharika-google-login-hd-room-themes-20261101' || github.ref == 'refs/heads/fix/sharika-games-bet-integrity-20261101'
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download the APK from the successful staging build
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          path: staging-apk

      - name: Permit emulator hardware acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Launch Sharika in Android emulator and check native Back
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p royal-qa
            adb install -r staging-apk/app-debug.apk
            adb shell am start -W -n com.soverixnet.sharika/.SharikaActivity
            sleep 12
            adb shell pidof com.soverixnet.sharika
            adb exec-out screencap -p > royal-qa/startup-12s.png
            sleep 18
            adb exec-out screencap -p > royal-qa/startup-30s.png
            adb shell uiautomator dump /sdcard/royal-startup.xml
            adb shell cat /sdcard/royal-startup.xml > royal-qa/startup-30s.xml
            adb logcat -d -v brief -s chromium:V AndroidRuntime:E > royal-qa/chromium-log.txt
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb exec-out screencap -p > royal-qa/back-pressed.png
            adb shell pidof com.soverixnet.sharika
            adb shell uiautomator dump /sdcard/royal-window.xml
            adb shell cat /sdcard/royal-window.xml > royal-qa/back-dialog.xml
            grep -Eo 'text="[^"]*"' royal-qa/back-dialog.xml | head -n 24
            grep -Fq 'Exit Sharika?' royal-qa/back-dialog.xml
            echo 'SHARIKA_ANDROID_EMULATOR_START_AND_BACK_CONFIRM_OK'

      - name: Save emulator evidence even if UI test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sharika-Royal-Emulator-Smoke
          path: royal-qa/
          if-no-files-found: warn
          retention-days: 7
