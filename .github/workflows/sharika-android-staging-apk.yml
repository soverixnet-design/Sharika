name: Sharika isolated Android staging APK

on:
  push:
    branches:
      - feature/sharika-android-staging-20261030
      - feature/sharika-original-games-cards-20261030
      - feature/sharika-lucky-gifts-20261030
      - feature/sharika-staff-seller-entry-20261031
      - fix/sharika-original-games-20261031
      - fix/sharika-admin-exchange-rate-20261031
      - fix/sharika-seller-wallet-split-20261031
      - fix/sharika-seller-self-recharge-wallet-ui-20261031
      - fix/sharika-profile-save-recovery-20261031
      - fix/sharika-shared-room-themes-20261031
      - fix/sharika-two-way-mic-direct-seat-20261031
      - feature/sharika-greedy-wheel-20261031
      - feature/sharika-greedy-wheel-current-20261031
      - feature/sharika-greedy-integrated-staging-20261031
      - feature/sharika-royal-premium-ui-20261031
      - feature/sharika-option1-reference-polish-20261031
      - fix/sharika-remote-audio-unlock-staging-20261101
      - fix/sharika-chat-thread-stability-staging-20261101
      - feature/sharika-premium-tiers-20261031
      - feature/sharika-royal-ranking-20261031
      - feature/sharika-cp-friendship-20261031
      - feature/sharika-royal-premium-bonds-integration-20261101
      - feature/sharika-hd-room-themes-staging-20261101
      - feature/sharika-weekly-opening-single-user-20261101
      - feature/sharika-royal-shop-backpack-20261101
      - feature/sharika-neon-special-id-20261101
      - feature/sharika-notifications-20261101
      - feature/sharika-golden-home-20261101
      - feature/sharika-svip-video-frames-20261101
      - feature/sharika-cp-weekly-rewards-20261101
      - feature/sharika-royal-frame-admin-grants-20261101
      - feature/sharika-master-integration-20261101
      - feature/sharika-winged-royal-unlimited-seller-20261102
      - feature/sharika-royal-profile-20261101
      - feature/sharika-royal-room-20261102
      - fix/sharika-google-login-hd-room-themes-20261101
      - fix/sharika-games-bet-integrity-20261101
      - fix/sharika-live-voice-reliability-20261102
      - fix/sharika-voice-games-owner-prepublish-20261103
      - feature/sharika-family-bd-crystal-ledger-20261103
      - feature/sharika-family-fruit-royale-sync-20261104
      - feature/sharika-room-free-lucky-box-20261104
      - feature/sharika-invite-auto-link-20261104
      - fix/sharika-family-royal-games-20261104
      - feature/sharika-sovera-gaddy-game-20261104
      - feature/sharika-bd-agency-host-20261104
    paths:
      - 'android-staging/**'
      - 'app/royal-room-ui.js'
      - 'app/royal-room-ui.css'
      - '.github/workflows/sharika-android-staging-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharika-android-staging-only
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build a staging-only Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-staging
    steps:
      - name: Checkout code (no live app changes)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout owner-owned Sovera source cosmetics at a pinned commit
        uses: actions/checkout@v4
        with:
          repository: soverixnet-design/sovera-voice-app
          ref: 0e30b48962272b8a687509aef4dee9bc4a047767
          path: _sovera_cosmetics
          persist-credentials: false

      - name: Bundle original Sovera frames, entrances, medals and sound in staging APK
        run: |
          mkdir -p app/src/main/assets/sovera-effects
          mkdir -p app/src/main/assets/sovera-medals
          mkdir -p app/src/main/assets/sovera-sounds
          cp -a ../_sovera_cosmetics/assets/effects/. app/src/main/assets/sovera-effects/
          cp -a ../_sovera_cosmetics/assets/medals/. app/src/main/assets/sovera-medals/
          cp -a ../_sovera_cosmetics/assets/sounds/. app/src/main/assets/sovera-sounds/
          test "$(find app/src/main/assets/sovera-effects -type f | wc -l)" -ge 30
          for effect in royal-gold.webp violet-love.webp ice-admin.webp vip7.webp phoenix-queen-entry.webp lion-queen-entry.webp; do
            test -s "app/src/main/assets/sovera-effects/$effect"
          done
          echo 'SOVERA_ORIGINAL_COSMETICS_BUNDLED_OFFLINE'

      - name: Check that this APK cannot use the wrong Firebase project
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('app/google-services.json', 'utf8'));
          const gradle = fs.readFileSync('app/build.gradle', 'utf8');
          const pkg = c.client?.[0]?.client_info?.android_client_info?.package_name;
          if (c.project_info?.project_id !== 'sharika-voice-chat-app' ||
              pkg !== 'com.soverixnet.sharika' ||
              !gradle.includes("applicationId 'com.soverixnet.sharika'")) {
            throw new Error('Refusing to build unexpected Android Firebase identity');
          }
          const oauth = c.client?.[0]?.oauth_client || [];
          const androidClient = oauth.find(v => v.client_type === 1);
          const webClient = oauth.find(v => v.client_type === 3);
          const stagingSignerSha1 = 'ab491a1a905a42bf42417d7b62c658b379f32bb0';
          if (!androidClient?.android_info?.certificate_hash || !webClient?.client_id) {
            throw new Error('Google OAuth client IDs missing from google-services.json');
          }
          if (!oauth.some(v => v.client_type === 1 &&
              v.android_info?.package_name === pkg &&
              v.android_info?.certificate_hash?.toLowerCase() === stagingSignerSha1)) {
            throw new Error('Staging APK signing SHA-1 missing from Google OAuth clients');
          }
          console.log('SHARIKA_ANDROID_FIREBASE_IDENTITY_AND_GOOGLE_OAUTH_OK');
          NODE

      - name: Check exact original Sharika UI and isolated Android adapter
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/feature/sharika-sovera-gaddy-game-20261104' ]]; then
            node scripts/generate-sovera-gaddy.mjs
            git diff --exit-code -- app/src/main/assets/original-games/sovera-gaddy-game.html
            node --check app/src/main/assets/original-games/sovera-gaddy-live.js
            test -s app/src/main/assets/original-games/sovera-gaddy-game.html
            grep -F 'Sovera Gaddy Game' app/src/main/assets/original-games/sovera-gaddy-game.html >/dev/null
            echo 'SOEVERA_GADDY_SANITIZED_GRAPHICS_BUNDLED'
          fi
          node --check staging-connection.js
          node --check app/src/main/assets/greedy-wheel/sharika-bridge.js
          node --check app/src/main/assets/greedy-wheel/game.js
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('../app/index.html', 'utf8');
          const bridge = fs.readFileSync('staging-connection.js', 'utf8');
          if (!html.includes('<title>Sharika Voice Chat App</title>') ||
              !html.includes('<script src="./connection.js">') ||
              !bridge.includes("window.API.login") ||
              !bridge.includes("SharikaNative") ||
              !bridge.includes("fitAndroidViewport(document, false)") ||
              !bridge.includes("fitAndroidViewport(frame.document, true)") ||
              /rfrmcmeyamndghtiheci\.supabase\.co|sb_publishable_/.test(bridge)) {
            throw new Error('Original design or staging-only connection contract failed');
          }
          // These three independent screens MUST ship inside the APK. The
          // original demo wallet/result scripts must not ship as gameplay.
          const vm = require('vm');
          const games=['sovera-food-wheel','night-food-wheel','jackpot-fruit'];
          for (const game of games) {
            const file='app/src/main/assets/original-games/'+game+'.html';
            const body=fs.readFileSync(file,'utf8');
            if(!body.includes('data-original-game=')||
               !body.includes('GameBridge.bet(')||
               /localStorage\.getItem\(['"](?:sv_food|jf_b|g_night)/.test(body))
              throw Error(game+': not server-connected');
            const scripts=[...body.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)];
            for (const script of scripts) new vm.Script(script[1],{filename:file});
          }
          if (!bridge.includes('sharika:original-request')||
              !bridge.includes('event.source!==current.element.contentWindow')||
              !bridge.includes("id:'fruit-royale'") || bridge.includes("id:'jackpot-fruit'"))
            throw Error('Original game card/iframe source checking missing');
          const greedy='app/src/main/assets/greedy-wheel/';
          const greedyHtml=fs.readFileSync(greedy+'index.html','utf8');
          const greedyBridge=fs.readFileSync(greedy+'sharika-bridge.js','utf8');
          if(!bridge.includes("id:'greedy-wheel'")||
             !greedyHtml.includes('sharika-bridge.js')||
             greedyHtml.includes('__PORT_8080__')||
             !greedyBridge.includes('sharika:greedy-request')||
             !greedyBridge.includes('window.WebSocket=BridgeSocket'))
            throw Error('Greedy Wheel is not protected by authenticated bridge');
          const royal='app/src/main/assets/fruit-royale/';
          for(const asset of ['index.html','game.js','styles.css','config.js','adapter.live.js'])
            if(!fs.statSync(royal+asset).size)throw Error('Missing Fruit Royale: '+asset);
          if(!fs.readFileSync(royal+'config.js','utf8').includes("mode:'live'"))
            throw Error('Fruit Royale must use real Cloudflare Worker');
          console.log('SHARIKA_FRUIT_ROYALE_LIVE_SERVER_BRIDGE_VERIFIED');
          console.log('SHARIKA_ORIGINAL_UI_AND_ISOLATED_BRIDGE_VERIFIED');
          NODE

      - name: Verify premium room design and verified ranking contract
        run: |
          node --check ../app/royal-room-ui.js
          test -s ../app/royal-room-ui.css
          node - <<'NODE'
          const fs=require('fs');
          const ui=fs.readFileSync('../app/royal-room-ui.js','utf8');
          const css=fs.readFileSync('../app/royal-room-ui.css','utf8');
          const adapter=fs.readFileSync('staging-connection.js','utf8');
          const backend=fs.readFileSync('../cloudflare/src/index.mjs','utf8');
          for(const value of [
            'window.SharikaRoomPremium={',
            'renderPremiumHeader()',
            'showMembers,showRewards,showRankings',
            'sh-room-masthead',
            'sh-room-face-count'
          ])if(!ui.includes(value))throw Error('Room UI missing: '+value);
          if(!css.includes('.sh-room-masthead')||
             !css.includes('.sh-rank-row .sh-vip-avatar')||
             !adapter.includes('frame.SharikaRoomPremium.sync({')||
             !adapter.includes('/contributors?period=')||
             !backend.includes("action==='contributors'"))
            throw Error('Verified room member and ranking wiring missing');
          console.log('SHARIKA_PREMIUM_ROOM_VERIFIED_SOURCE_CONTRACT_OK');
          NODE

      - name: Validate Royal Shop and Backpack packaging
        run: |
          test -s royal-shop-bg.png
          test -s royal-backpack-bg.png
          test -s royal-market.css
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('staging-connection.js','utf8');
          const gradle=fs.readFileSync('app/build.gradle','utf8');
          for(const asset of ['royal-shop-bg.png','royal-backpack-bg.png','royal-market.css'])
            if(!gradle.includes(asset))throw Error('Missing market asset: '+asset);
          if(!js.includes("api('POST','/cosmetics/purchase'") ||
             !js.includes("api('POST','/cosmetics/equip'") ||
             !js.includes('sharikaOpenRoyalMarket') ||
             !js.includes('sharikaCloseRoyalMarket'))
            throw Error('Verified marketplace operations not packaged');
          console.log('SHARIKA_ROYAL_MARKET_ASSETS_AND_API_OK');
          NODE

      - name: Validate Royal Premium visual-only layer
        run: |
          node --check royal-premium.js
          test -s royal-premium.css
          test -s royal-palace.png
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('royal-premium.js', 'utf8');
          const css = fs.readFileSync('royal-premium.css', 'utf8');
          const gradle = fs.readFileSync('app/build.gradle', 'utf8');
          const java = fs.readFileSync('app/src/main/java/com/soverixnet/sharika/SharikaActivity.java', 'utf8');
          if (!js.includes('iframe.addEventListener(\'load\', styleRoom') ||
              !js.includes("settings.theme === 'mid' && !settings.bg") ||
              !css.includes('html.royal-root') ||
              !css.includes('html.royal-room') ||
              !css.includes('prefers-reduced-motion:reduce') ||
              !['royal-premium.js', 'royal-premium.css', 'royal-palace.png'].every(s => gradle.includes(s)) ||
              !java.includes("s.src='./royal-premium.js'") ||
              !java.includes("s.src='./back-navigation.js'")) {
            throw new Error('Royal Premium packaging/theme safety check failed');
          }
          console.log('SHARIKA_ROYAL_VISUAL_LAYER_STATIC_CHECKS_OK');
          NODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android packages using hosted runner SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Restore required stable staging signer from encrypted GitHub secrets
        env:
          KEY_B64: ${{ secrets.SHARIKA_STAGING_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.SHARIKA_STAGING_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_B64" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Both encrypted signing secrets are required; refusing an unstable debug-signed APK."
            exit 1
          else
            # Mobile paste can insert line breaks or spaces; base64 has no whitespace.
            printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/sharika-staging-signing.p12"
            # Verify the exact expected private staging key, not any replacement.
            printf '%s  %s\n' '0373e29ebef4eaf193af678a108aefd164b12babd811d2b3e87b46b3a3026d0e' "$RUNNER_TEMP/sharika-staging-signing.p12" | sha256sum --check --status
            chmod 600 "$RUNNER_TEMP/sharika-staging-signing.p12"
            echo "SHARIKA_STAGING_KEYSTORE_PATH=$RUNNER_TEMP/sharika-staging-signing.p12" >> "$GITHUB_ENV"
            echo "SHARIKA_STAGING_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Restored private staging signing key (not committed to repository)."
          fi

      - name: Compile staging APK only
        env:
          SHARIKA_STAGING_KEYSTORE_PASSWORD: ${{ secrets.SHARIKA_STAGING_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Android 16 target SDK in compiled APK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "targetSdkVersion:'36'"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "versionCode='13'"
          echo 'SHARIKA_ANDROID_TARGET_API_36_VERIFIED'

      - name: Verify original Sovera cosmetics are inside the offline APK
        run: |
          for effect in royal-gold.webp violet-love.webp ice-admin.webp vip7.webp phoenix-queen-entry.webp lion-queen-entry.webp; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/sovera-effects/$effect"
          done
          echo 'SOVERA_FRAMES_ENTRIES_IN_APK_VERIFIED'

      - name: Verify individual transparent SVIP animations are in the APK
        run: |
          test -s app/src/main/assets/sharika-premium/manifest.json
          for asset in vip5-animated svip-frame-01 svip-frame-08 svip-medal-01 svip-tag-17 noble-gold-microphone role-frame-64; do
            test -s "app/src/main/assets/sharika-premium/$asset.webp"
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/sharika-premium/$asset.webp"
          done
          echo 'SHARIKA_SVIP_ROLE_ANIMATED_ASSETS_VERIFIED'

      - name: Check original game cards and HTML are packaged in the staging APK
        run: |
          for card in food-wheel-original-card.png jackpot-fruit-original-card.png; do
            test -s "app/src/main/assets/$card"
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/$card"
          done
          for game in sovera-food-wheel night-food-wheel jackpot-fruit; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/original-games/$game.html"
          done
          for asset in index.html game.js styles.css config.js adapter.live.js; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/fruit-royale/$asset"
          done
          echo 'FRUIT_ROYALE_PACKAGED'

      - name: Verify uploaded Greedy Wheel visuals and bridge ship in APK
        run: |
          for asset in index.html game.js style.css sharika-bridge.js img/shrimp.webp img/fish.webp img/chicken.webp img/steak.webp img/cabbage.webp img/carrot.webp img/corn.webp img/tomato.webp img/salad.webp img/pizza.webp; do
            test -s "app/src/main/assets/greedy-wheel/$asset"
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/greedy-wheel/$asset"
          done
          echo 'GREEDY_WHEEL_UI_PACKAGED'

      - name: Check Food Wheel card is packaged in the staging APK
        run: |
          test -s app/src/main/assets/food-wheel-card.jpg
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/food-wheel-card.jpg'
          echo 'FOOD_WHEEL_CARD_IN_APK_VERIFIED'

      - name: Confirm Royal Premium assets are bundled inside APK
        run: |
          for asset in royal-premium.js royal-premium.css royal-palace.png; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/$asset"
          done
          echo 'SHARIKA_ROYAL_PREMIUM_APK_ASSETS_VERIFIED'

      - name: Confirm Champagne Gold Home and room discovery assets are bundled
        run: |
          for asset in champagne-home-background.webp champagne-home-icons.webp golden-home.css room-discovery.js; do
            test -s "../app/$asset"
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/$asset"
          done
          node --check ../app/room-discovery.js
          echo 'SHARIKA_CHAMPAGNE_HOME_APK_ASSETS_VERIFIED'

      - name: Verify the uploaded Royal Phoenix room assets are packaged
        run: |
          for asset in royal-room-background.jpg royal-room-icons.png royal-room-ui.css royal-room-ui.js; do
            test -s "../app/$asset"
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/$asset"
          done
          node --check ../app/royal-room-ui.js
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/royal-premium.css | grep -F "content:'QA13'"
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/royal-room-ui.js | grep -F 'SharikaRoyalKeyboard'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/royal-room-ui.js | grep -F 'nativeImeInset'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/connection.js | grep -F 'sh-room-joining-card'
          node - <<'NODE'
          const fs=require('fs');
          const bridge=fs.readFileSync('staging-connection.js','utf8');
          const gradle=fs.readFileSync('app/build.gradle','utf8');
          for(const asset of ['royal-room-background.jpg','royal-room-icons.png','royal-room-ui.css','royal-room-ui.js'])
            if(!gradle.includes(asset))throw Error('Missing Royal Room asset: '+asset);
          if(!bridge.includes('owner_throne:true')||!bridge.includes('playStandardRoomEntry'))
            throw Error('Room identity and ordinary entry adapters missing');
          console.log('SHARIKA_ROYAL_ROOM_ASSETS_AND_ENTRY_VERIFIED');
          NODE

      - name: Print signing fingerprint for this exact APK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CERTS="$("$SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          echo "$CERTS"
          if [[ "${SHARIKA_STAGING_SIGNING_CONFIGURED:-}" == "true" ]]; then
            printf '%s\n' "$CERTS" | grep -qi 'Signer #1 certificate SHA-1 digest: ab491a1a905a42bf42417d7b62c658b379f32bb0'
            echo 'SHARIKA_STABLE_STAGING_CERTIFICATE_VERIFIED'
          fi

      - name: Verify Agency 3D icons and active BD dashboard in compiled profile
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/connection.js > "$RUNNER_TEMP/sharika-family-connection.js"
          node - <<'NODE'
          const fs=require('node:fs');
          const js=fs.readFileSync(process.env.RUNNER_TEMP+'/sharika-family-connection.js','utf8');
          for(const expected of [
            "root.querySelector('.profile-royal-page .profile-account')",
            "family.onclick=openRoyalFamily",
            "tile.hidden=!data.bd?.active",
            "window.sharikaOpenRoyalFamily=openRoyalFamily",
            "/family/bd/overview",
            "/family/agency/hosts",
            "/family/host/statement",
            "sharika-agency-icons/"
          ]) if(!js.includes(expected))throw Error('Family main profile packaging missing: '+expected);
          console.log('SHARIKA_FAMILY_MAIN_PROFILE_ICON_PACKAGED');
          NODE

      - name: Save private-test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          path: android-staging/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build separate no-network real-WebView keyboard QA harness
        run: |
          node --check room-qa/src/main/qa-assets/room-qa.js
          gradle -PincludeRoomQa=1 :room-qa:assembleDebug --no-daemon
          test -s room-qa/build/outputs/apk/debug/room-qa-debug.apk
          echo 'SHARIKA_ROOM_WEBVIEW_KEYBOARD_HARNESS_BUILT'

      - name: Save keyboard QA harness (never release with Sharika)
        uses: actions/upload-artifact@v4
        with:
          name: Sharika-Room-Keyboard-QA-Only
          path: android-staging/room-qa/build/outputs/apk/debug/room-qa-debug.apk
          if-no-files-found: error
          retention-days: 7

  royal-emulator-smoke:
    name: Royal UI launch, Back and keyboard/seat stability emulator test
    # Only the isolated Option 1 candidate; no live app or staging data writes.
    if: github.ref == 'refs/heads/feature/sharika-option1-reference-polish-20261031' || github.ref == 'refs/heads/fix/sharika-remote-audio-unlock-staging-20261101' || github.ref == 'refs/heads/fix/sharika-chat-thread-stability-staging-20261101' || github.ref == 'refs/heads/feature/sharika-royal-premium-bonds-integration-20261101' || github.ref == 'refs/heads/feature/sharika-hd-room-themes-staging-20261101' || github.ref == 'refs/heads/feature/sharika-royal-shop-backpack-20261101' || github.ref == 'refs/heads/feature/sharika-cp-weekly-rewards-20261101' || github.ref == 'refs/heads/feature/sharika-royal-frame-admin-grants-20261101' || github.ref == 'refs/heads/feature/sharika-master-integration-20261101' || github.ref == 'refs/heads/fix/sharika-google-login-hd-room-themes-20261101' || github.ref == 'refs/heads/fix/sharika-games-bet-integrity-20261101' || github.ref == 'refs/heads/feature/sharika-winged-royal-unlimited-seller-20261102' || github.ref == 'refs/heads/fix/sharika-live-voice-reliability-20261102' || github.ref == 'refs/heads/fix/sharika-voice-games-owner-prepublish-20261103' || github.ref == 'refs/heads/feature/sharika-family-bd-crystal-ledger-20261103' || github.ref == 'refs/heads/feature/sharika-family-fruit-royale-sync-20261104' || github.ref == 'refs/heads/feature/sharika-room-free-lucky-box-20261104' || github.ref == 'refs/heads/fix/sharika-family-royal-games-20261104' || github.ref == 'refs/heads/feature/sharika-bd-agency-host-20261104'
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download the APK from the successful staging build
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          path: staging-apk

      - name: Download isolated WebView keyboard test APK
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Room-Keyboard-QA-Only
          path: keyboard-qa-apk

      - name: Permit emulator hardware acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Launch Sharika and smoke-test native Back without UIAutomator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p royal-qa
            adb install -r staging-apk/app-debug.apk
            adb shell am start -W -n com.soverixnet.sharika/.SharikaActivity
            sleep 12
            adb shell pidof com.soverixnet.sharika
            adb exec-out screencap -p > royal-qa/startup-12s.png
            sleep 18
            adb exec-out screencap -p > royal-qa/startup-30s.png
            # UIAutomator was OOM-killed (137) on the prior hosted runner.
            # Preserve screenshots, process checks and system logs without it.
            adb logcat -d -v brief -s chromium:V AndroidRuntime:E > royal-qa/chromium-log.txt
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb exec-out screencap -p > royal-qa/back-pressed.png
            adb shell pidof com.soverixnet.sharika
            adb shell dumpsys window windows > royal-qa/back-window.txt
            adb logcat -d -v brief -s chromium:V AndroidRuntime:E > royal-qa/chromium-log.txt
            command -v tesseract >/dev/null 2>&1 && tesseract royal-qa/back-pressed.png stdout > royal-qa/back-ocr.txt 2>/dev/null || true
            echo 'SHARIKA_ANDROID_EMULATOR_LAUNCH_AND_BACK_NO_CRASH_OK'

            # This separate, no-network APK renders the *same packaged room*
            # on the same Android WebView. Tap the real input via ADB so Gboard
            # is exercised instead of just checking CSS strings.
            adb install -r keyboard-qa-apk/room-qa-debug.apk
            adb logcat -c
            adb shell am start -W -n com.soverixnet.sharika.roomqa/.RoomQaActivity
            sleep 13
            adb logcat -d -v raw -s SharikaRoomQa:I > royal-qa/room-before.jsonl
            jq -ce 'select(.phase=="before" and .ready and (.fingerprint|contains("QA13")))' royal-qa/room-before.jsonl | tail -n 1 > royal-qa/room-baseline.json
            test -s royal-qa/room-baseline.json
            adb exec-out screencap -p > royal-qa/room-keyboard-before.png
            INPUT_X="$(jq -r '.tapX' royal-qa/room-baseline.json)"
            INPUT_Y="$(jq -r '.tapY' royal-qa/room-baseline.json)"
            test "$INPUT_X" -gt 0
            test "$INPUT_Y" -gt 0
            adb shell input tap "$INPUT_X" "$INPUT_Y"
            sleep 6
            adb exec-out screencap -p > royal-qa/room-keyboard-after.png
            adb logcat -d -v raw -s SharikaRoomQa:I > royal-qa/room-after.jsonl
            jq -ce 'select(.phase=="ime" and .ready and .keyboardClass and (.imeInset|sub("px$";"")|tonumber)>100)' royal-qa/room-after.jsonl | tail -n 1 > royal-qa/room-ime.json
            test -s royal-qa/room-ime.json
            jq -n --argfile before royal-qa/room-baseline.json --argfile after royal-qa/room-ime.json '
              def abs: if . < 0 then -. else . end;
              {headerDelta:(($after.header.top-$before.header.top)|abs),
               ownerDelta:(($after.owner.top-$before.owner.top)|abs),
               firstSeatDelta:(($after.firstSeat.top-$before.firstSeat.top)|abs),
               imeInset:$after.imeInset} |
              if .headerDelta > 9 or .ownerDelta > 9 or .firstSeatDelta > 9
                then error("Room seats or header shifted on real IME: " + tostring)
                else . end' > royal-qa/keyboard-stability-result.json
            adb shell dumpsys input_method > royal-qa/ime-state.txt
            echo 'SHARIKA_REAL_ANDROID_IME_ROOM_HEADER_AND_SEATS_STABLE_OK'

      - name: Save emulator evidence even if UI test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sharika-Royal-Emulator-Smoke
          path: royal-qa/
          if-no-files-found: warn
          retention-days: 7

  royal-family-api-staging:
    name: Verify and deploy only the updated Family read endpoint to staging
    if: github.ref == 'refs/heads/fix/sharika-family-royal-games-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sharika-staging
    concurrency:
      group: sharika-isolated-staging-worker-publish
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse any non-staging target, missing secret or unexpected source
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          const d=c.d1_databases?.[0];
          const source=readFileSync('src/family.mjs','utf8');
          if(process.env.GITHUB_REF!=='refs/heads/fix/sharika-family-royal-games-20261104'||
             !process.env.CLOUDFLARE_API_TOKEN||c.name!=='sharika-api-staging'||
             c.account_id!==process.env.CLOUDFLARE_ACCOUNT_ID||
             c.vars?.SHARIKA_ENV!=='staging'||c.workers_dev!==true||
             c.keep_vars!==true||c.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=='false'||
             c.vars?.SHARIKA_LUCKY_GIFTS_ENABLED!=='false'||
             c.d1_databases?.length!==1||d?.binding!=='DB'||
             d?.database_name!=='sharika-staging'||
             d?.database_id!=='b2c62252-12a5-4740-90c7-01a536d9a39a'||
             !source.includes("family_member_detail_permission_denied"))
            throw Error('Refusing unsafe Family Worker publish');
          console.log('SHARIKA_STAGING_FAMILY_READ_ENDPOINT_ONLY_TARGET_VERIFIED');
          NODE
      - name: Run all Worker, game-wallet and Family permission checks
        run: npm run check
      - name: Read-only remote D1 prerequisite check
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('sharika_game_catalog','sharika_family_members','sharika_families','sharika_gift_events','sharika_family_crystal_ledger') ORDER BY name"
      - name: Dry-run Worker bundle without touching D1
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Publish only sharika-api-staging, no migration or balance writes
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Check Worker health after staging publish
        run: curl --fail --silent --show-error --max-time 20 https://sharika-api-staging.soverixnet.workers.dev/health

  royal-family-games-direct-apk:
    name: Release tested Royal Family and Games staging APK directly
    if: github.ref == 'refs/heads/fix/sharika-family-royal-games-20261104'
    needs: [debug-apk, royal-emulator-smoke, royal-family-api-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the exactly tested, stable-signed APK
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          path: verified-apk
      - name: Verify Family dashboard, game selection and Native API inside APK
        run: |
          test -s verified-apk/app-debug.apk
          unzip -tqq verified-apk/app-debug.apk
          unzip -p verified-apk/app-debug.apk assets/connection.js > "$RUNNER_TEMP/royal-family-games.js"
          node - <<'NODE'
          const js=require('node:fs').readFileSync(process.env.RUNNER_TEMP+'/royal-family-games.js','utf8');
          for(const expected of [
            'data-fam-member-detail','sh-fam-kpis','showMemberActivity(',
            'Crystal & Coin Transfer History',
            'visibleGameCards=originalGameCards.filter(game=>enabled.has(game.id))',
            'Sharika Royal Games','Retry loading games'
          ])if(!js.includes(expected))throw Error('APK missing expected Family/Game behavior: '+expected);
          if(js.includes("game.id==='fruit-royale'&&enabled.has(game.id)"))
            throw Error('APK still hides active games');
          console.log('FAMILY_GAMES_NATIVE_ASSETS_VERIFIED');
          NODE
          unzip -Z1 verified-apk/app-debug.apk | grep -Fx 'assets/fruit-royale/index.html'
          unzip -Z1 verified-apk/app-debug.apk | grep -Fx 'assets/greedy-wheel/index.html'
          cp verified-apk/app-debug.apk verified-apk/Sharika-Royal-Family-Games-Staging.apk
          sha256sum verified-apk/Sharika-Royal-Family-Games-Staging.apk
      - name: Publish a direct APK download as staging-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sharika-royal-family-games-staging-${GITHUB_SHA:0:8}"
          if gh release view "$TAG" --repo soverixnet-design/Sharika >/dev/null 2>&1; then
            echo 'Existing release tag; refusing to overwrite downloaded APK'
            exit 1
          fi
          gh release create "$TAG" verified-apk/Sharika-Royal-Family-Games-Staging.apk \
            --repo soverixnet-design/Sharika --target "$GITHUB_SHA" \
            --title 'Sharika Royal Family Dashboard + Active Games — Staging APK' \
            --notes 'Staging test APK: 3D Royal Family summary, member daily verified gift statements, Crystal/coin ledger, and all Admin-enabled bundled games. Fruit Royale stays hidden while disabled in staging Admin; no historical wallet, member or game records reset. Staging API permission checks and Android emulator passed. Not a Play Store production release.' \
            --prerelease

