name: Install three approved Sharika game icons (staging only)
on:
  push:
    branches:
      - feature/sharika-cleopatra-slot-staging-20261117
    paths:
      - .github/workflows/sharika-approved-game-icon-install.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified optimized originals
        env:
          FRUIT_URL: 'https://eu-central.storage.cloudconvert.com/tasks/f4e357e3-547a-4213-84e8-9cfe251b1f8b/glossy_fruit_machine_game_icon.webp?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20261117%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20261117T181427Z&X-Amz-Expires=86400&X-Amz-Signature=91ac6affa3bb21de34f8afd7dcbd574b417191a44bc73b177f05aa2bfc958053&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22glossy_fruit_machine_game_icon.webp%22&response-content-type=image%2Fwebp&x-amz-checksum-mode=ENABLED&x-id=GetObject'
          CLEOPATRA_URL: 'https://eu-central.storage.cloudconvert.com/tasks/2ada1eb3-3335-4615-b8e6-6fb2e7b7e69c/cleopatra_s_gold_deluxe_jackpot.webp?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20261117%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20261117T181445Z&X-Amz-Expires=86400&X-Amz-Signature=2265dbacb8bc10ed4f8e55fc35b0ce4801b65714dde41786bbefee3286776d60&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22cleopatra_s_gold_deluxe_jackpot.webp%22&response-content-type=image%2Fwebp&x-amz-checksum-mode=ENABLED&x-id=GetObject'
          GREEDY_URL: 'https://eu-central.storage.cloudconvert.com/tasks/348735e1-9c05-4a17-8261-bf359c96f5a6/glossy_hot_food_wheel_icon.webp?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20261117%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20261117T181459Z&X-Amz-Expires=86400&X-Amz-Signature=4d43c76079625755343613642ba98026ccdc28a22fb37cc70f79ad7e98fd383f&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22glossy_hot_food_wheel_icon.webp%22&response-content-type=image%2Fwebp&x-amz-checksum-mode=ENABLED&x-id=GetObject'
        run: |
          set -euo pipefail
          mkdir -p android-staging/game-icons
          curl -fLsS --retry 3 "$FRUIT_URL" -o android-staging/game-icons/fruit-machine.webp
          curl -fLsS --retry 3 "$CLEOPATRA_URL" -o android-staging/game-icons/cleopatra.webp
          curl -fLsS --retry 3 "$GREEDY_URL" -o android-staging/game-icons/greedy-game.webp
          python3 - <<'PY'
          from pathlib import Path
          for name in ('fruit-machine','cleopatra','greedy-game'):
              data=Path('android-staging/game-icons/'+name+'.webp').read_bytes()
              assert len(data)>20000 and data[:4]==b'RIFF' and data[8:12]==b'WEBP',name
          print('THREE_APPROVED_WEBP_FILES_VERIFIED')
          PY
      - name: Wire only the three new game cards into the verified Android bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          bridge=Path('android-staging/staging-connection.js')
          body=bridge.read_text()
          paths={'food-deluxe':'fruit-machine.webp','greedy-classic':'greedy-game.webp','cleopatra':'cleopatra.webp'}
          for gid,filename in paths.items():
              pattern=r"(\{id:'"+re.escape(gid)+r"',name:[^\n]+\n\s+image:)'[^']+'"
              body,n=re.subn(pattern,lambda m:m.group(1)+"'file:///android_asset/"+filename+"'",body)
              assert n==1,(gid,n)
          bridge.write_text(body)
          gradle=Path('android-staging/app/build.gradle')
          source=gradle.read_text()
          needle="    from(rootProject.file('staging-connection.js')) {"
          assert source.count(needle)>=1
          original=source
          lines="".join("    from(rootProject.file('game-icons/"+v+"'))\n" for v in paths.values())
          source=source.replace(needle,lines+needle,1)
          assert source!=original
          gradle.write_text(source)
          assert body.count("file:///android_asset/fruit-machine.webp")==1
          assert body.count("file:///android_asset/greedy-game.webp")==1
          assert body.count("file:///android_asset/cleopatra.webp")==1
          for name in ('food-deluxe','greedy-classic','cleopatra'):
              assert name in body
          print('GAME_CATALOG_ICONS_AND_ANDROID_ASSET_COPY_VERIFIED')
          PY
      - name: Commit approved icons, remove temporary URL workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-staging/game-icons/fruit-machine.webp android-staging/game-icons/cleopatra.webp android-staging/game-icons/greedy-game.webp android-staging/staging-connection.js android-staging/app/build.gradle
          git rm .github/workflows/sharika-approved-game-icon-install.yml
          git commit -m "fix(staging): show approved HD icons for three original games"
          git push origin "HEAD:${GITHUB_REF_NAME}"
