name: Sharika Cloudflare D1 staging checks
on:
  push:
    branches:
      - feature/sharika-cloudflare-d1-foundation-20261029
      - feature/sharika-android-staging-20261030
      - feature/sharika-notifications-20261101
      - feature/sharika-original-games-cards-20261030
      - feature/sharika-staff-seller-entry-20261031
      - fix/sharika-two-way-mic-direct-seat-20261031
    paths:
      - 'cloudflare/**'
      - '.github/workflows/sharika-cloudflare-check.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/sharika-cloudflare-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit checks
        run: npm --prefix cloudflare run check
      - name: Verify direct guest seat claim and unique occupancy in SQLite
        run: python3 cloudflare/test/seat-schema-check.py
      - name: Verify staff quotas and immutable direct coin grants in SQLite
        run: python3 cloudflare/test/staff-schema-check.py
      - name: Validate isolated SQLite schema in-memory
        run: |
          python3 - <<'PY'
          import pathlib
          import sqlite3
          db = sqlite3.connect(':memory:')
          for path in sorted(pathlib.Path('cloudflare/migrations').glob('*.sql')):
              db.executescript(path.read_text())
          assert db.execute("SELECT name FROM sqlite_master WHERE name='sharika_game_bets'").fetchone()
          tables = db.execute("SELECT name FROM sqlite_master WHERE type='table'").fetchall()
          assert db.execute("SELECT name FROM sqlite_master WHERE name='sharika_wallet_ledger'").fetchone()
          import time
          now = int(time.time()*1000) - 2000  # Round is safely open before SQLite checks it
          db.execute("INSERT INTO sharika_users(public_no,auth_uid,name,birthdate,minor,coins) VALUES (10000001,'tester','Tester','2000-01-01',0,200)")
          db.execute("INSERT INTO sharika_rooms(id,owner_id,name) VALUES ('10000001','tester','Room')")
          assert db.execute("SELECT seat_frame_style FROM sharika_rooms WHERE id='10000001'").fetchone()[0] == 'grad'
          db.execute("UPDATE sharika_rooms SET seat_frame_style='neon' WHERE id='10000001'")
          assert db.execute("SELECT seat_frame_style FROM sharika_rooms WHERE id='10000001'").fetchone()[0] == 'neon'
          try:
              db.execute("UPDATE sharika_rooms SET seat_frame_style='invalid' WHERE id='10000001'")
              raise AssertionError('Invalid decorative frame was accepted')
          except sqlite3.IntegrityError:
              pass
          db.execute("INSERT INTO sharika_game_rounds(id,game,round_no,starts_ms,bet_closes_ms,closes_ms,seed_hex,commit_sha256) VALUES ('food-wheel:1','food-wheel',1,?,?,?,?,?)",
                     (now,now+30000,now+40000,'a'*64,'b'*64))
          db.execute("INSERT INTO sharika_game_bets(game,round_no,round_id,user_uid,stake,pick_index,request_id) VALUES ('food-wheel',1,'food-wheel:1','tester',50,2,'test-game-request-12345')")
          assert db.execute("SELECT coins FROM sharika_users WHERE auth_uid='tester'").fetchone()[0] == 150
          db.execute("UPDATE sharika_game_bets SET status='settled',payout=450,result_json='{}',settled_at=datetime('now') WHERE id=1")
          assert db.execute("SELECT coins FROM sharika_users WHERE auth_uid='tester'").fetchone()[0] == 600
          db.execute("UPDATE sharika_game_bets SET status='settled' WHERE id=1")
          assert db.execute("SELECT COUNT(*) FROM sharika_wallet_ledger").fetchone()[0] == 2
          # The ninth Food Wheel sector must be accepted by SQLite too.
          # It used to be wrongly rejected by a 0..7 CHECK constraint.
          db.execute("INSERT INTO sharika_game_rounds(id,game,round_no,starts_ms,bet_closes_ms,closes_ms,seed_hex,commit_sha256) VALUES ('food-wheel:2','food-wheel',2,?,?,?,?,?)",
                     (now,now+30000,now+40000,'c'*64,'d'*64))
          db.execute("INSERT INTO sharika_game_bets(game,round_no,round_id,user_uid,stake,pick_index,request_id) VALUES ('food-wheel',2,'food-wheel:2','tester',10,8,'game-test-sector9-567890')")
          assert db.execute("SELECT coins FROM sharika_users WHERE auth_uid='tester'").fetchone()[0] == 590
          assert db.execute("SELECT COUNT(*) FROM sharika_wallet_ledger").fetchone()[0] == 3
          print('All 9 Food Wheel sectors allowed; existing ledger preserved')
          # Three uploaded original game cards use a separate backend and
          # never overwrite or erase the previous game-ledger history.
          db.execute("UPDATE sharika_users SET coins=5000 WHERE auth_uid='tester'")
          db.execute("INSERT INTO sharika_original_game_rounds(id,game,round_no,starts_ms,bet_closes_ms,closes_ms,seed_hex,commit_sha256) VALUES('sovera-food:88','sovera-food',88,?,?,?,?,?)",
                     (now,now+30000,now+40000,'e'*64,'f'*64))
          db.execute("INSERT INTO sharika_original_game_bets(game,round_no,round_id,user_uid,pick_index,amount,request_id) VALUES('sovera-food',88,'sovera-food:88','tester',7,100,'orig-test-bet-000001')")
          assert db.execute("SELECT coins FROM sharika_users WHERE auth_uid='tester'").fetchone()[0] == 4900
          try:
              db.execute("INSERT INTO sharika_original_game_bets(game,round_no,round_id,user_uid,pick_index,amount,request_id) VALUES('sovera-food',88,'sovera-food:88','tester',7,100,'orig-test-bet-000001')")
              raise AssertionError('Original bet replay allowed')
          except sqlite3.IntegrityError:
              pass
          db.execute("UPDATE sharika_original_game_bets SET status='settled',payout=500,result_json='{}',settled_at=datetime('now') WHERE request_id='orig-test-bet-000001'")
          assert db.execute("SELECT coins FROM sharika_users WHERE auth_uid='tester'").fetchone()[0] == 5400
          assert db.execute("SELECT COUNT(*) FROM sharika_wallet_ledger WHERE reason LIKE 'original_game_%'").fetchone()[0] == 2
          db.execute("INSERT INTO sharika_original_game_rounds(id,game,round_no,starts_ms,bet_closes_ms,closes_ms,seed_hex,commit_sha256) VALUES('night-food:89','night-food',89,?,?,?,?,?)",
                     (now,now+30000,now+40000,'a'*64,'b'*64))
          db.execute("INSERT INTO sharika_original_game_bets(game,round_no,round_id,user_uid,pick_index,amount,request_id) VALUES('night-food',89,'night-food:89','tester',9,25,'orig-night-group-0001')")
          assert db.execute("SELECT coins FROM sharika_users WHERE auth_uid='tester'").fetchone()[0] == 5375
          db.execute("INSERT INTO sharika_original_game_rounds(id,game,round_no,starts_ms,bet_closes_ms,closes_ms,seed_hex,commit_sha256) VALUES('jackpot-fruit:90','jackpot-fruit',90,?,?,?,?,?)",
                     (now,now+30000,now+40000,'c'*64,'d'*64))
          db.execute("INSERT INTO sharika_original_game_bets(game,round_no,round_id,user_uid,pick_index,amount,request_id) VALUES('jackpot-fruit',90,'jackpot-fruit:90','tester',7,1000,'orig-jackpot-test-0001')")
          assert db.execute("SELECT coins FROM sharika_original_game_pools WHERE game='jackpot-fruit'").fetchone()[0] == 50
          db.execute("INSERT INTO sharika_original_jackpot_budgets(round_id,budget,total_stake) VALUES('jackpot-fruit:90',25,1000)")
          assert db.execute("SELECT coins FROM sharika_original_game_pools WHERE game='jackpot-fruit'").fetchone()[0] == 25
          print('Original Food/Night/Jackpot atomic ledger, idempotency and pool verified')
          print('Game debit/payout ledger and replay protection verified')
          print('Sharika D1 schema valid:', len(tables), 'tables')
          PY

      - name: Validate Lucky Gift receiver diamonds and room rewards in isolated SQLite
        run: |
          python3 - <<'PY'
          import pathlib,sqlite3
          db=sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys=ON')
          for path in sorted(pathlib.Path('cloudflare/migrations').glob('*.sql')):
              db.executescript(path.read_text())
          db.execute("INSERT INTO sharika_users(public_no,auth_uid,name,birthdate,minor,coins) VALUES(10000001,'sender','Sender','2000-01-01',0,30000)")
          db.execute("INSERT INTO sharika_users(public_no,auth_uid,name,birthdate,minor) VALUES(10000002,'receiver','Receiver','2000-01-01',0)")
          db.execute("INSERT INTO sharika_rooms(id,owner_id,name) VALUES('10000001','sender','Room')")
          for uid in ['sender','receiver']:
              db.execute("INSERT INTO sharika_room_members(room_id,user_id) VALUES('10000001',?)",(uid,))
          db.execute("INSERT INTO sharika_gifts(id,name,tab,price_coins,active) VALUES(10,'Lucky',2,10000,1)")
          db.execute("INSERT INTO sharika_gifts(id,name,tab,price_coins,active) VALUES(11,'Small Lucky',2,5,1)")
          def settle(request_id,gift_id,price,points):
              db.execute("UPDATE sharika_users SET coins=coins-? WHERE auth_uid='sender'",(price,))
              db.execute("INSERT INTO sharika_gift_transactions(sender_uid,room_id,gift_id,quantity,recipient_ids_json,total_coins,request_id) VALUES('sender','10000001',?,1,'[\"10000002\"]',?,?)",(gift_id,price,request_id))
              tx=db.execute("SELECT id FROM sharika_gift_transactions WHERE request_id=?",(request_id,)).fetchone()[0]
              db.execute("INSERT INTO sharika_lucky_gift_outcomes(transaction_id,sender_uid,payout_coins,max_multiplier,rolls_json) VALUES(?,'sender',0,0,'{}')",(tx,))
              db.execute("INSERT INTO sharika_gift_events(transaction_id,room_id,sender_uid,recipient_uid,gift_id,quantity,price_coins) VALUES(?,'10000001','sender','receiver',?,1,?)",(tx,gift_id,price))
              db.execute("INSERT INTO sharika_lucky_recipient_rewards(transaction_id,recipient_uid,earned_hundredths) VALUES(?,'receiver',?)",(tx,points))
              db.execute("INSERT INTO sharika_lucky_room_rewards(transaction_id,room_id,reward_hundredths) VALUES(?,'10000001',?)",(tx,price))
              return tx
          tx=settle('lucky-share-large-0001',10,10000,50000)
          assert db.execute("SELECT diamonds FROM sharika_users WHERE auth_uid='receiver'").fetchone()[0]==500
          assert db.execute("SELECT coins FROM sharika_users WHERE auth_uid='sender'").fetchone()[0]==20000
          assert db.execute("SELECT SUM(reward_hundredths) FROM sharika_lucky_room_rewards").fetchone()[0]==10000
          try:
              db.execute("UPDATE sharika_lucky_room_rewards SET reward_hundredths=0 WHERE transaction_id=?",(tx,))
              raise AssertionError('Room reward was mutable')
          except sqlite3.IntegrityError: pass
          for i in range(4):
              settle('lucky-share-small-'+str(i).zfill(4),11,5,25)
          assert db.execute("SELECT diamonds FROM sharika_users WHERE auth_uid='receiver'").fetchone()[0]==501
          assert db.execute("SELECT earned_hundredths,credited_diamonds FROM sharika_lucky_diamond_accruals WHERE recipient_uid='receiver'").fetchone()==(50100,501)
          assert db.execute("SELECT SUM(reward_hundredths) FROM sharika_lucky_room_rewards").fetchone()[0]==10020
          assert db.execute("SELECT COUNT(*) FROM sharika_wallet_ledger WHERE reason='lucky_gift_received'").fetchone()[0]==2
          assert db.execute("SELECT coins FROM sharika_users WHERE auth_uid='sender'").fetchone()[0]==19980
          print('Lucky 5% receiver diamond ledger, fractional accumulation, 1% room reward, immutable records validated')
          PY

  invite-android-compile:
    name: Compile invite Android bridge (no release)
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/sharika-invites-cashout-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36 for compile
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile debug staging app without signing secrets
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify compile artifact exists without publishing
        run: test -s app/build/outputs/apk/debug/app-debug.apk
