name: Sharika staging backend (D1 and Worker)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose a safe staging operation (never changes the live app)'
        type: choice
        required: true
        default: verify-only
        options:
          - verify-only
          - create-tables
          - deploy-staging-worker

permissions:
  contents: read

concurrency:
  group: sharika-d1-staging-initialization
  cancel-in-progress: false

jobs:
  initialize:
    name: Check and optionally initialize isolated staging D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout reviewed staging candidate at a pinned commit
        uses: actions/checkout@v4
        with:
          ref: a1887cc59c62e343b68a70b143368a58452a1dc1
          persist-credentials: false

      - name: Refuse any target other than the approved isolated staging account and D1
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const c = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
            const db = c.d1_databases?.[0];
            if (c.name !== "sharika-api-staging" ||
                c.account_id !== "d81cf7c48fb9b36d468cb0a08720cd74" ||
                c.vars?.SHARIKA_ENV !== "staging" ||
                c.d1_databases?.length !== 1 ||
                db.binding !== "DB" ||
                db.database_name !== "sharika-staging" ||
                db.database_id !== "b2c62252-12a5-4740-90c7-01a536d9a39a" ||
                c.workers_dev !== true ||
                c.vars?.FIREBASE_PROJECT_ID !== "" ||
                c.vars?.ALLOWED_ORIGINS !== "") {
              throw new Error("Refusing unexpected Cloudflare configuration");
            }
            console.log("APPROVED_SHARIKA_STAGING_D1_ONLY");
          '

      - name: Test Worker source without any remote writes
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Worker tests
        run: npm run check

      - name: Validate SQL against an in-memory SQLite database
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sqlite3
          sql = Path('migrations/0001_initial.sql').read_text()
          conn = sqlite3.connect(':memory:')
          conn.executescript(sql)
          tables = {r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert 'sharika_users' in tables and 'sharika_wallet_ledger' in tables
          print(f"SHARIKA_D1_LOCAL_SCHEMA_OK: {len(tables)} tables")
          PY

      - name: Apply migrations to isolated remote D1 only (schema mode)
        if: ${{ inputs.operation == 'create-tables' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npx --yes wrangler@4 d1 migrations apply sharika-staging --remote --config wrangler.jsonc

      - name: Confirm existing staging D1 schema before Worker deployment
        if: ${{ inputs.operation == 'deploy-staging-worker' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS count FROM sharika_users"

      - name: Deploy only sharika-api-staging to workers.dev (protected APIs remain closed)
        if: ${{ inputs.operation == 'deploy-staging-worker' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d81cf7c48fb9b36d468cb0a08720cd74
          workingDirectory: cloudflare
          command: deploy --config wrangler.jsonc
