name: Publish direct APK download for approved staging test

on:
  push:
    branches:
      - fix/sharika-direct-apk-download-20261103
    paths:
      - '.github/workflows/sharika-direct-apk-download.yml'

permissions:
  actions: read
  contents: write

jobs:
  direct-download:
    name: Verify existing APK and upload GitHub pre-release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download exact tested APK from successful staging build 227
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41529090443
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: staging-apk

      - name: Verify bytes before distribution
        shell: bash
        run: |
          test -s staging-apk/app-debug.apk
          echo '5256d931ed28f2e13ef3ae094d67ed7b2939fad0308dceb87faa0053976cf55a  staging-apk/app-debug.apk' | sha256sum -c -
          cp staging-apk/app-debug.apk Sharika-Voice-Games-Owner-Staging-20261103.apk
          file Sharika-Voice-Games-Owner-Staging-20261103.apk

      - name: Create a publicly downloadable TEST pre-release, not a Play Store release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create sharika-staging-voice-games-owner-20261103 \
            'Sharika-Voice-Games-Owner-Staging-20261103.apk#Sharika Voice Games Owner Staging APK' \
            --repo soverixnet-design/Sharika \
            --target 5d2257d8782bdf25f17943e1c5969c753e3df8ee \
            --title 'Sharika Voice + Games + Seat Lock — Staging TEST APK' \
            --notes 'TEST APK only. Not a final Play Store release. Live two-phone voice, owner seat lock and real-game settlement must be checked before publishing.' \
            --prerelease \
            --latest=false
