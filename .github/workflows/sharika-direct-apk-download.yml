name: Publish direct APK download for approved staging test
# Source build and Android emulator smoke check are both completed successfully.

on:
  push:
    branches:
      - fix/sharika-direct-apk-download-20261103
    paths:
      - '.github/workflows/sharika-direct-apk-download.yml'

permissions:
  actions: read
  contents: write

jobs:
  direct-download:
    name: Verify tested APK and upload a separate staging pre-release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download APK from the successful Google sign-in recovery staging build
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41554340316
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: staging-apk

      - name: Verify exact build identity and Android package structure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41554340316 --jq .head_sha)" = 'd30ec5ac5fd5a86e1d09da2aad4def96a60995d2'
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41554340316 --jq .conclusion)" = 'success'
          test -s staging-apk/app-debug.apk
          unzip -t staging-apk/app-debug.apk > /dev/null
          unzip -Z1 staging-apk/app-debug.apk | grep -Fx AndroidManifest.xml
          unzip -Z1 staging-apk/app-debug.apk | grep -Eq '^classes([0-9]+)?[.]dex$'
          cp staging-apk/app-debug.apk Sharika-Google-Login-Fix-Staging-20261103.apk
          sha256sum Sharika-Google-Login-Fix-Staging-20261103.apk
          file Sharika-Google-Login-Fix-Staging-20261103.apk

      - name: Publish direct .apk link to a new staging-only GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create sharika-staging-google-login-fix-20261103 \
            'Sharika-Google-Login-Fix-Staging-20261103.apk#Sharika Google Login Fix Staging APK' \
            --repo soverixnet-design/Sharika \
            --target d30ec5ac5fd5a86e1d09da2aad4def96a60995d2 \
            --title 'Sharika Google Login Recovery — Staging TEST APK' \
            --notes 'Staging test APK, not a final Play Store release. Includes 45-second native Google Credential Manager recovery, safe retry messages, verified ordinary-gift diamond credits and 100-diamond Exchange presets. Live two-phone betting, voice, gift and owner-seat actions still require physical-device verification.' \
            --prerelease \
            --latest=false
