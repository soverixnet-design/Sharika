name: Publish direct APK download for approved staging test

on:
  push:
    branches:
      - fix/sharika-direct-apk-download-20261103
    paths:
      - '.github/workflows/sharika-direct-apk-download.yml'

permissions:
  actions: read
  contents: write

jobs:
  direct-download:
    name: Verify tested APK and upload a separate staging pre-release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download APK from the successful room chat and gift build
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41546818898
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: staging-apk

      - name: Verify exact build identity and Android package structure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41546818898 --jq .head_sha)" = 'e42f20c1dc330708163d63da74b0e24ddd36a4a4'
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41546818898 --jq .conclusion)" = 'success'
          test -s staging-apk/app-debug.apk
          unzip -t staging-apk/app-debug.apk > /dev/null
          unzip -Z1 staging-apk/app-debug.apk | grep -Fx AndroidManifest.xml
          unzip -Z1 staging-apk/app-debug.apk | grep -Eq '^classes([0-9]+)?[.]dex$'
          cp staging-apk/app-debug.apk Sharika-Room-Chat-Gift-Staging-20261103.apk
          sha256sum Sharika-Room-Chat-Gift-Staging-20261103.apk
          file Sharika-Room-Chat-Gift-Staging-20261103.apk

      - name: Publish direct .apk link to a new staging-only GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create sharika-staging-room-chat-gifts-20261103 \
            'Sharika-Room-Chat-Gift-Staging-20261103.apk#Sharika Room Chat Gift Staging APK' \
            --repo soverixnet-design/Sharika \
            --target e42f20c1dc330708163d63da74b0e24ddd36a4a4 \
            --title 'Sharika Room Chat + Gift Receipts — Staging TEST APK' \
            --notes 'Staging test APK, not a final Play Store release. Includes expanded scrollable room chat and verified gift sender-recipient receipts. Live two-phone room chat, gifts, voice and seat actions still require physical-device verification.' \
            --prerelease \
            --latest=false
