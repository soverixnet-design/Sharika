name: Publish direct APK download for approved staging test
# Source build and Android emulator smoke check are both completed successfully.

on:
  push:
    branches:
      - fix/sharika-direct-apk-download-20261103
    paths:
      - '.github/workflows/sharika-direct-apk-download.yml'

permissions:
  actions: read
  contents: write

jobs:
  direct-download:
    name: Verify tested APK and upload a separate staging pre-release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download APK from the successful gift-diamond and Exchange staging build
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41552826505
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: staging-apk

      - name: Verify exact build identity and Android package structure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41552826505 --jq .head_sha)" = 'ec5afd3ab09bd6c54392f32d22a1fed71a147162'
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41552826505 --jq .conclusion)" = 'success'
          test -s staging-apk/app-debug.apk
          unzip -t staging-apk/app-debug.apk > /dev/null
          unzip -Z1 staging-apk/app-debug.apk | grep -Fx AndroidManifest.xml
          unzip -Z1 staging-apk/app-debug.apk | grep -Eq '^classes([0-9]+)?[.]dex$'
          cp staging-apk/app-debug.apk Sharika-Diamond-Exchange-Staging-20261103.apk
          sha256sum Sharika-Diamond-Exchange-Staging-20261103.apk
          file Sharika-Diamond-Exchange-Staging-20261103.apk

      - name: Publish direct .apk link to a new staging-only GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create sharika-staging-diamond-exchange-20261103 \
            'Sharika-Diamond-Exchange-Staging-20261103.apk#Sharika Diamond Exchange Staging APK' \
            --repo soverixnet-design/Sharika \
            --target ec5afd3ab09bd6c54392f32d22a1fed71a147162 \
            --title 'Sharika Gift Diamonds & Exchange — Staging TEST APK' \
            --notes 'Staging test APK, not a final Play Store release. Includes verified ordinary-gift diamond credits, 100-diamond Exchange presets, and the existing compact room game sheets. Live two-phone betting, voice, gift and owner-seat actions still require physical-device verification.' \
            --prerelease \
            --latest=false
