name: Publish direct APK for Sharika Profile Designer staging
# Staging-only release, pinned to one tested Android build and commit.

on:
  push:
    branches:
      - fix/sharika-profile-layout-apk-release-20261103
    paths:
      - '.github/workflows/sharika-direct-apk-download.yml'

permissions:
  actions: read
  contents: write

jobs:
  direct-download:
    name: Verify tested APK and upload a separate staging pre-release asset
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download APK from tested Profile Designer staging build
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41563546100
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: staging-apk

      - name: Verify exact build identity and Android package structure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run watch 41563546100 --repo soverixnet-design/Sharika --exit-status --interval 10
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41563546100 --jq .head_sha)" = 'c5b766143215f8e05a97c850d1f1be5844b25e62'
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41563546100 --jq .conclusion)" = 'success'
          test -s staging-apk/app-debug.apk
          unzip -t staging-apk/app-debug.apk > /dev/null
          unzip -Z1 staging-apk/app-debug.apk | grep -Fx AndroidManifest.xml
          unzip -Z1 staging-apk/app-debug.apk | grep -Eq '^classes([0-9]+)?[.]dex$'
          cp staging-apk/app-debug.apk Sharika-Profile-Designer-Staging-20261103.apk
          sha256sum Sharika-Profile-Designer-Staging-20261103.apk
          file Sharika-Profile-Designer-Staging-20261103.apk

      - name: Publish direct .apk link to a new staging-only GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create sharika-staging-profile-designer-20261103 \
            'Sharika-Profile-Designer-Staging-20261103.apk#Sharika Profile Designer Staging APK' \
            --repo soverixnet-design/Sharika \
            --target c5b766143215f8e05a97c850d1f1be5844b25e62 \
            --title 'Sharika Profile Designer (Main and Public) — Staging TEST APK' \
            --notes 'Staging-only APK with Admin visual Main/Public Profile placement templates, preserved per-user purchased cosmetics, tag and medal anchors, frame scale, section order and safe draft/publish/restore. Previously staged games, gifts and room Events remain. This is not a Play Store production release; two real devices and live cosmetic positioning still require verification.' \
            --prerelease \
            --latest=false
