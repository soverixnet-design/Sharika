name: Publish direct APK download for approved staging test
# Source build and Android emulator smoke check are both completed successfully.

on:
  push:
    branches:
      - fix/sharika-direct-apk-download-20261103
    paths:
      - '.github/workflows/sharika-direct-apk-download.yml'

permissions:
  actions: read
  contents: write

jobs:
  direct-download:
    name: Verify tested APK and upload a separate staging pre-release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download APK from the successful post-login home recovery staging build
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41556499963
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: staging-apk

      - name: Verify exact build identity and Android package structure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41556499963 --jq .head_sha)" = '04e27159b4b486cac3b54441ff3368b05c654eac'
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41556499963 --jq .conclusion)" = 'success'
          test -s staging-apk/app-debug.apk
          unzip -t staging-apk/app-debug.apk > /dev/null
          unzip -Z1 staging-apk/app-debug.apk | grep -Fx AndroidManifest.xml
          unzip -Z1 staging-apk/app-debug.apk | grep -Eq '^classes([0-9]+)?[.]dex$'
          cp staging-apk/app-debug.apk Sharika-Login-Home-Recovery-Staging-20261103.apk
          sha256sum Sharika-Login-Home-Recovery-Staging-20261103.apk
          file Sharika-Login-Home-Recovery-Staging-20261103.apk

      - name: Publish direct .apk link to a new staging-only GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create sharika-staging-login-home-recovery-20261103 \
            'Sharika-Login-Home-Recovery-Staging-20261103.apk#Sharika Post-Login Home Recovery Staging APK' \
            --repo soverixnet-design/Sharika \
            --target 04e27159b4b486cac3b54441ff3368b05c654eac \
            --title 'Sharika Login + Home Recovery — Staging TEST APK' \
            --notes 'Staging test APK, not a final Play Store release. Includes Google Credential Manager timeout recovery, persistent verified Firebase session, fast home rendering, server Retry connection screen, and tested gift/exchange bridge. Live two-phone betting, voice, gift and owner-seat actions still require physical-device verification.' \
            --prerelease \
            --latest=false
