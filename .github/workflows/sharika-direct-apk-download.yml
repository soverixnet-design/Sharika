name: Publish direct APK for Admin Games and Events staging test
# Staging-only release, pinned to one tested Android build and commit.

on:
  push:
    branches:
      - fix/sharika-direct-apk-download-20261103
    paths:
      - '.github/workflows/sharika-direct-apk-download.yml'

permissions:
  actions: read
  contents: write

jobs:
  direct-download:
    name: Verify tested APK and upload a separate staging pre-release asset
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download APK from tested admin games and events staging build
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41561775555
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: staging-apk

      - name: Verify exact build identity and Android package structure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run watch 41561775555 --repo soverixnet-design/Sharika --exit-status --interval 10
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41561775555 --jq .head_sha)" = '0521f7c4706ec82767632e590b61c92dc7ab0697'
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41561775555 --jq .conclusion)" = 'success'
          test -s staging-apk/app-debug.apk
          unzip -t staging-apk/app-debug.apk > /dev/null
          unzip -Z1 staging-apk/app-debug.apk | grep -Fx AndroidManifest.xml
          unzip -Z1 staging-apk/app-debug.apk | grep -Eq '^classes([0-9]+)?[.]dex$'
          cp staging-apk/app-debug.apk Sharika-Admin-Games-Events-Staging-20261103.apk
          sha256sum Sharika-Admin-Games-Events-Staging-20261103.apk
          file Sharika-Admin-Games-Events-Staging-20261103.apk

      - name: Publish direct .apk link to a new staging-only GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create sharika-staging-admin-games-events-20261103 \
            'Sharika-Admin-Games-Events-Staging-20261103.apk#Sharika Admin Games and Events Staging APK' \
            --repo soverixnet-design/Sharika \
            --target 0521f7c4706ec82767632e590b61c92dc7ab0697 \
            --title 'Sharika Admin Games, Gift Editor and Room Events — Staging TEST APK' \
            --notes 'Staging-only APK with authenticated Admin game enable/disable, gift name/emoji/category/price/HTTPS media edits, and a golden Events shortcut above room mic. Server and Admin deploy are tracked in separate staging CI. Existing seat, login and notifications fixes are included. This is not a Play Store production release; two real devices, live voice, games, frames and gallery media upload still require verification.' \
            --prerelease \
            --latest=false
