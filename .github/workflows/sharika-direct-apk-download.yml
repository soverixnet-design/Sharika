name: Publish direct APK download for approved staging test
# Source build and Android emulator smoke check are both completed successfully.

on:
  push:
    branches:
      - fix/sharika-direct-apk-download-20261103
    paths:
      - '.github/workflows/sharika-direct-apk-download.yml'

permissions:
  actions: read
  contents: write

jobs:
  direct-download:
    name: Verify tested APK and upload a separate staging pre-release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download APK from the successful notification-safe login staging build
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41557995946
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: staging-apk

      - name: Verify exact build identity and Android package structure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41557995946 --jq .head_sha)" = '17f4db51d5a25895583664a1875b429f27cc9396'
          test "$(gh api repos/soverixnet-design/Sharika/actions/runs/41557995946 --jq .conclusion)" = 'success'
          test -s staging-apk/app-debug.apk
          unzip -t staging-apk/app-debug.apk > /dev/null
          unzip -Z1 staging-apk/app-debug.apk | grep -Fx AndroidManifest.xml
          unzip -Z1 staging-apk/app-debug.apk | grep -Eq '^classes([0-9]+)?[.]dex$'
          cp staging-apk/app-debug.apk Sharika-Notification-Login-Fix-Staging-20261103.apk
          sha256sum Sharika-Notification-Login-Fix-Staging-20261103.apk
          file Sharika-Notification-Login-Fix-Staging-20261103.apk

      - name: Publish direct .apk link to a new staging-only GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create sharika-staging-notification-login-fix-20261103 \
            'Sharika-Notification-Login-Fix-Staging-20261103.apk#Sharika Notification Opt-In Login Fix Staging APK' \
            --repo soverixnet-design/Sharika \
            --target 17f4db51d5a25895583664a1875b429f27cc9396 \
            --title 'Sharika Notification-Safe Login — Staging TEST APK' \
            --notes 'Staging test APK, not a final Play Store release. Includes previous Google and home recovery plus no automatic notification-permission prompt at login, explicit Notifications-page opt-in, and persistent Google error text. Live two-phone betting, voice, gift and owner-seat actions still require physical-device verification.' \
            --prerelease \
            --latest=false
