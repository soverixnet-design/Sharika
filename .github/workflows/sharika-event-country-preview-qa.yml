name: Sharika Royal Events - country scope and admin preview QA
on:
  push:
    branches: [feature/sharika-event-country-preview-20261120, feature/sharika-royal-events-rank-rewards-20261120]
    paths:
      - '.github/workflows/sharika-event-country-preview-qa.yml'
      - 'cloudflare/src/event-audience.mjs'
      - 'cloudflare/src/events.mjs'
      - 'cloudflare/src/private-center.mjs'
      - 'cloudflare/migrations/0104_event_country_visibility.sql'
      - 'cloudflare/test/event-audience.test.mjs'
      - 'cloudflare/test/event-country-leaderboards.test.mjs'
      - 'cloudflare/test/event-design.test.mjs'
      - 'cloudflare/test/private-center.test.mjs'
      - 'cloudflare/test/royal-liveops-admin-e2e.test.mjs'
      - 'hosted-game-center/src/private-index.mjs'
      - 'hosted-game-center/web/center.js'
      - 'hosted-game-center/web/center.css'
      - 'cloudflare/test/private-center.test.mjs'
      - 'hosted-game-center/test/private-event-access.test.mjs'
      - 'admin/connection.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-liveops-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax guards, web assets and Admin Panel
        run: |
          set -euo pipefail
          node --check cloudflare/src/events.mjs
          node --check cloudflare/src/event-audience.mjs
          node --check cloudflare/src/private-center.mjs
          node --check hosted-game-center/src/private-index.mjs
          node --check hosted-game-center/web/center.js
          node --check admin/connection.js
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const admin=readFileSync('admin/connection.js','utf8');
          const member=readFileSync('hosted-game-center/web/center.js','utf8');
          if(!admin.includes('sh-ev-country')||!admin.includes('ADMIN PREVIEW ONLY')||
             !admin.includes('private-center/visibility')||
             !member.includes('eventAudienceLabel'))throw Error('Event preview/country UI missing');
          NODE
          node hosted-game-center/scripts/build.mjs
      - name: Validate additive audience migration using memory-only SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          sql=Path('cloudflare/migrations/0104_event_country_visibility.sql').read_text()
          conn=sqlite3.connect(':memory:')
          conn.execute("CREATE TABLE sharika_events(id INTEGER PRIMARY KEY,status TEXT,ends_at TEXT,starts_at TEXT)")
          conn.execute("INSERT INTO sharika_events(id,status) VALUES(1,'draft')")
          conn.executescript(sql)
          assert conn.execute('SELECT country_code FROM sharika_events WHERE id=1').fetchone()[0]=='GLOBAL'
          conn.execute("INSERT INTO sharika_events(id,status,country_code) VALUES(2,'draft','BD')")
          try:
              conn.execute("INSERT INTO sharika_events(id,status,country_code) VALUES(3,'draft','bangladesh')")
              raise AssertionError('invalid scope accepted')
          except sqlite3.IntegrityError:
              pass
          conn.close()
          print('Event audience migration validated in isolated memory DB')
          PY
      - name: Isolated End-to-end Admin Event, member country and private URLs
        run: |
          node --test cloudflare/test/event-audience.test.mjs \
            cloudflare/test/event-country-leaderboards.test.mjs \
            cloudflare/test/royal-liveops-admin-e2e.test.mjs \
            cloudflare/test/private-center.test.mjs \
            cloudflare/test/event-design.test.mjs \
            hosted-game-center/test/private-event-access.test.mjs
      - name: Complete backend regression suite
        run: npm --prefix cloudflare run check

  publish-royal-events-staging:
    name: Publish QA-verified Royal Events to staging ONLY
    if: github.ref == 'refs/heads/feature/sharika-royal-events-rank-rewards-20261120'
    needs: isolated-liveops-qa
    runs-on: ubuntu-24.04
    environment: sharika-staging
    timeout-minutes: 25
    concurrency:
      group: sharika-royal-events-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Refuse Play, production, missing secrets, or unsafe D1 target
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const api=read('cloudflare/wrangler.jsonc');
          const admin=read('cloudflare/wrangler.admin.jsonc');
          const site=read('hosted-game-center/wrangler.private.jsonc');
          const db='b2c62252-12a5-4740-90c7-01a536d9a39a';
          const account='d81cf7c48fb9b36d468cb0a08720cd74';
          if(process.env.GITHUB_REF!=='refs/heads/feature/sharika-royal-events-rank-rewards-20261120'||
             !process.env.CLOUDFLARE_API_TOKEN||
             [api,admin,site].some(x=>x.account_id!==account)||
             api.name!=='sharika-api-staging'||
             admin.name!=='sharika-admin-staging'||
             site.name!=='sharika-private-center-staging'||
             api.d1_databases?.[0]?.database_id!==db||
             admin.d1_databases?.[0]?.database_id!==db||
             site.d1_databases?.[0]?.database_id!==db||
             api.vars?.SHARIKA_ENV!=='staging'||
             api.keep_vars!==true||
             admin.services?.[0]?.service!=='sharika-api-staging')
             throw Error('STAGING ONLY safety gate refused release');
          console.log('STAGING ONLY config verified');
          NODE
      - name: Confirm Event Country migration and publication tables already exist
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/b2c62252-12a5-4740-90c7-01a536d9a39a/query';
          const sql="SELECT (SELECT COUNT(*) FROM pragma_table_info('sharika_events') WHERE name IN ('country_code','template_id','scoring_mode')) AS event_cols,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('sharika_center_publishing','sharika_center_launch_tickets','sharika_center_browser_sessions')) AS tables";
          const res=await fetch(url,{method:'POST',headers:{
            Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type':'application/json'},body:JSON.stringify({sql})});
          const data=await res.json();
          const row=data.result?.[0]?.results?.[0];
          if(!res.ok||!data.success||Number(row?.event_cols)!==3||Number(row?.tables)!==3)
            throw Error('Required existing D1 schema missing; no deployment performed');
          console.log('Required D1 tables/columns present; no migrations run');
          NODE
      - name: Build Admin and private Center; run syntax guards
        run: |
          node hosted-game-center/scripts/build.mjs
          cp admin/index.html cloudflare/src/admin-index.html
          cp admin/connection.js cloudflare/src/admin-connection.txt
          node --check hosted-game-center/web/center.js
          node --check admin/connection.js
          node --check hosted-game-center/src/private-index.mjs
      - name: Dry-run all three staging Worker bundles
        run: |
          npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir /tmp/royal-events-api
          npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.admin.jsonc --outdir /tmp/royal-events-admin
          npx --yes wrangler@4 deploy --dry-run --config hosted-game-center/wrangler.private.jsonc --outdir /tmp/royal-events-center
      - name: Deploy private Event Center staging Worker only
        run: npx --yes wrangler@4 deploy --config hosted-game-center/wrangler.private.jsonc
      - name: Deploy staging API only
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.jsonc
      - name: Deploy existing staging Admin Panel only
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.admin.jsonc
      - name: Verify only staging health endpoints
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors --max-time 10 https://sharika-api-staging.soverixnet.workers.dev/health | grep -q staging
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors --max-time 10 https://sharika-admin-staging.soverixnet.workers.dev/health | grep -q sharika-admin-staging
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors --max-time 10 https://sharika-private-center-staging.soverixnet.workers.dev/health | grep -q private_center
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 12 https://sharika-private-center-staging.soverixnet.workers.dev/api/center/events/6/ranking)
          test "$STATUS" = 401
