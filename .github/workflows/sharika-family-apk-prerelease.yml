name: Sharika Family BD direct staging APK
on:
  push:
    branches:
      - feature/sharika-family-bd-crystal-ledger-20261103
    paths:
      - '.github/workflows/sharika-family-apk-prerelease.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-tested-apk:
    name: Publish pinned, tested staging APK as a direct download
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the signed APK and emulator run passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 41626742248 --repo soverixnet-design/Sharika --json conclusion --jq '.conclusion')" = success
          test "$(gh api repos/soverixnet-design/Sharika/actions/artifacts/13226202393 --jq '.workflow_run.head_sha')" = e5743cbe59b80884841aa0172a39d1ee6b0bc4ea
          echo 'PINNED_SHARIKA_STAGING_APK_AND_EMULATOR_RUN_VERIFIED'

      - name: Download only the previously checked signed APK
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41626742248
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: family-apk

      - name: Verify packaged Family icon and prepare an APK, not a ZIP
        run: |
          test -s family-apk/app-debug.apk
          unzip -tqq family-apk/app-debug.apk
          unzip -p family-apk/app-debug.apk assets/connection.js > "$RUNNER_TEMP/sharika-family-connection.js"
          node - <<'NODE'
          const fs=require('node:fs');
          const body=fs.readFileSync(process.env.RUNNER_TEMP+'/sharika-family-connection.js','utf8');
          for(const required of [
            "root.querySelector('.profile-royal-page .profile-account')",
            'family.onclick=openRoyalFamily',
            'window.sharikaOpenRoyalFamily=openRoyalFamily'
          ]) if(!body.includes(required))throw Error('Staging APK Family icon check failed');
          console.log('SHARIKA_STAGING_FAMILY_ICON_IN_SIGNED_APK_VERIFIED');
          NODE
          install -m 0644 family-apk/app-debug.apk family-apk/Sharika-Family-BD-Staging.apk
          sha256sum family-apk/Sharika-Family-BD-Staging.apk

      - name: Publish a clearly marked, non-production GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=sharika-family-bd-staging-e5743cbe
          if gh release view "$TAG" --repo soverixnet-design/Sharika >/dev/null 2>&1; then
            echo "::error::Existing staging release; refusing to overwrite an APK"
            exit 1
          fi
          gh release create "$TAG" family-apk/Sharika-Family-BD-Staging.apk \
            --repo soverixnet-design/Sharika \
            --target e5743cbe59b80884841aa0172a39d1ee6b0bc4ea \
            --title "Sharika Family/BD staging APK (TEST ONLY)" \
            --notes "Android staging-only test APK. Family icon on main profile, BD access permission-gated. Original voice and games preserved. Not a Play Store release. Google Sheets automatic sync awaits service account credentials." \
            --prerelease
