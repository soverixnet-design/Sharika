name: Sharika Golden Family direct staging APK
on:
  push:
    branches:
      - feature/sharika-family-bd-crystal-ledger-20261103
    paths:
      - '.github/workflows/sharika-family-apk-prerelease.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-tested-apk:
    name: Publish pinned, tested staging APK as a direct download
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the signed APK and emulator run passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 41669852276 --repo soverixnet-design/Sharika --json conclusion --jq '.conclusion')" = success
          test "$(gh api repos/soverixnet-design/Sharika/actions/artifacts/13247077925 --jq '.workflow_run.head_sha')" = 918b25a481fa73753785cedb838abf99818495fb
          test "$(gh run view 41670118688 --repo soverixnet-design/Sharika --json conclusion --jq '.conclusion')" = success
          echo 'PINNED_GOLDEN_FAMILY_STAGING_APK_BACKEND_AND_EMULATOR_RUN_VERIFIED'

      - name: Download only the previously checked signed APK
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41669852276
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: family-apk

      - name: Verify packaged Family icon and prepare an APK, not a ZIP
        run: |
          test -s family-apk/app-debug.apk
          unzip -tqq family-apk/app-debug.apk
          unzip -p family-apk/app-debug.apk assets/connection.js > "$RUNNER_TEMP/sharika-family-connection.js"
          node - <<'NODE'
          const fs=require('node:fs');
          const body=fs.readFileSync(process.env.RUNNER_TEMP+'/sharika-family-connection.js','utf8');
          for(const required of [
            "root.querySelector('.profile-royal-page .profile-account')",
            'family.onclick=openRoyalFamily',
            'window.sharikaOpenRoyalFamily=openRoyalFamily',
            'data-fam-transfer-owner',
            'data-fam-remove-member',
            'function renderFamilyDiscovery',
            'data-fam-discovery-apply',
            'sh-fam-create-request',
            'sh-royal-idline'
          ]) if(!body.includes(required))throw Error('Staging APK Family icon check failed');
          console.log('SHARIKA_STAGING_FAMILY_ICON_IN_SIGNED_APK_VERIFIED');
          NODE
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('family-apk/app-debug.apk') as apk:
              dexes = [apk.read(name) for name in apk.namelist()
                       if name.startswith('classes') and name.endswith('.dex')]
          assert dexes and any(b'/api/v1/family/me' in dex for dex in dexes), \
              'Native Family API route missing from compiled APK'
          assert any(b'/api/v1/family/ownership/transfer' in dex for dex in dexes), \
              'Native Family ownership transfer route missing from APK'
          assert any(b'/api/v1/family/discover' in dex for dex in dexes), \
              'Native Family discovery route missing from APK'
          assert any(b'/api/v1/family/creation/request' in dex for dex in dexes), \
              'Native Family application route missing from APK'
          print('SHARIKA_NATIVE_FAMILY_DISCOVERY_API_ROUTES_IN_DEX_VERIFIED')
          PY
          install -m 0644 family-apk/app-debug.apk family-apk/Sharika-Family-Golden-Staging.apk
          sha256sum family-apk/Sharika-Family-Golden-Staging.apk

      - name: Publish a clearly marked, non-production GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=sharika-family-golden-discovery-staging-918b25a4
          if gh release view "$TAG" --repo soverixnet-design/Sharika >/dev/null 2>&1; then
            echo "::error::Existing staging release; refusing to overwrite an APK"
            exit 1
          fi
          gh release create "$TAG" family-apk/Sharika-Family-Golden-Staging.apk \
            --repo soverixnet-design/Sharika \
            --target 918b25a481fa73753785cedb838abf99818495fb \
            --title "Sharika Golden Family Discovery and Royal Profile Tags (STAGING TEST ONLY)" \
            --notes "Sharika Family Gold Discovery with Recommend/New lists, Owner-approved Apply, Admin-approved Create Family and in-room verified ID/BD/Seller badges. Existing Family BD rules, Crystal ledger and voice/game logic preserved. APK source commit 918b25a4; Admin backend deployed at ff791103. DEBUG STAGING TEST ONLY; not a Play Store build." \
            --prerelease
