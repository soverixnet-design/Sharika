name: Sharika game bet bridge timeout regression (staging only)
on:
  push:
    branches:
      - fix/sharika-game-bridge-timeout-budget-20261118
  pull_request:
    branches:
      - feature/sharika-room-half-sheet-profile-games-20261118
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bridge syntax and build isolated hosted assets
        run: |
          node --check hosted-game-center/web/app.js
          node --check hosted-game-center/scripts/build.mjs
          node --check android-staging/app/src/main/assets/original-games/greedy-classic-live.js
          node hosted-game-center/scripts/build.mjs
      - name: Regression test request IDs and timeout order
        run: |
          node --test hosted-game-center/test/iframe-bridge-timeout-budget.test.mjs
          node --test hosted-game-center/test/site.test.mjs hosted-game-center/test/room-profile.test.mjs
