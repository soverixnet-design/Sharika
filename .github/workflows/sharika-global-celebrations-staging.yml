name: Sharika verified global celebrations staging API

on:
  push:
    branches:
      - feature/sharika-global-celebrations-api-staging-20261107
    paths:
      - '.github/workflows/sharika-global-celebrations-staging.yml'
      - 'cloudflare/src/global-celebrations.mjs'
      - 'cloudflare/src/index.mjs'
      - 'cloudflare/migrations/0073_global_celebrations.sql'
      - 'cloudflare/test/global-celebrations.test.mjs'
      - 'cloudflare/test/greedy-daily-wins.test.mjs'

permissions:
  contents: read

concurrency:
  group: sharika-isolated-staging-worker-publish
  cancel-in-progress: false

jobs:
  deploy-verified-celebrations-staging:
    name: Verify existing staging database then add settled announcements
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: sharika-staging
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact staging Worker, database and nonredeemable currency
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/sharika-global-celebrations-api-staging-20261107'
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          const db=c.d1_databases?.[0];
          if(c.name!=='sharika-api-staging'||
             c.account_id!=='d81cf7c48fb9b36d468cb0a08720cd74'||
             c.vars?.SHARIKA_ENV!=='staging'||
             c.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=='false'||
             c.vars?.SHARIKA_PLAY_BILLING_ENABLED!=='false'||
             c.keep_vars!==true||c.workers_dev!==true||
             c.d1_databases?.length!==1||db?.binding!=='DB'||
             db?.database_name!=='sharika-staging'||
             db?.database_id!=='b2c62252-12a5-4740-90c7-01a536d9a39a')
             throw Error('Refusing unexpected Worker, D1 database or configuration');
          console.log('ISOLATED_STAGING_CONFIGURATION_VERIFIED');
          NODE
      - name: Check all backend functions and global transaction assertions
        run: |
          npm run check
          node --check src/global-celebrations.mjs
          node --test test/global-celebrations.test.mjs
      - name: Prove latest Royal level migration and staging API exist
        run: |
          set -euo pipefail
          curl -fSs --max-time 20 https://sharika-api-staging.soverixnet.workers.dev/health >/dev/null
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc \
            --command "SELECT name FROM d1_migrations WHERE name='0072_royal_level_v2_baselines.sql'" \
            | grep -F '0072_royal_level_v2_baselines.sql' >/dev/null
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc \
            --command 'SELECT COUNT(*) AS preserved_wallet_entries FROM sharika_wallet_ledger'
      - name: Check Worker compilation without publishing
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Add only the verified announcement event table and triggers
        run: |
          set -euo pipefail
          # Never apply an unrelated migration family from a divergent branch.
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc \
            --file migrations/0073_global_celebrations.sql
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc \
            --command "INSERT INTO d1_migrations(name) SELECT '0073_global_celebrations.sql' WHERE NOT EXISTS (SELECT 1 FROM d1_migrations WHERE name='0073_global_celebrations.sql')"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc \
            --command 'SELECT COUNT(*) AS new_global_celebrations FROM sharika_global_celebrations'
      - name: Publish only staging Worker
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify healthy staging API after publish
        run: |
          set -euo pipefail
          curl -fSs --max-time 20 https://sharika-api-staging.soverixnet.workers.dev/health
          echo 'AUTHENTICATED_GLOBAL_CELEBRATIONS_STAGING_PUBLISHED'
