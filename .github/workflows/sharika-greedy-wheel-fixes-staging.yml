name: Sharika Greedy Wheel demo ranking and winner fixes staging
on:
  push:
    branches: [feature/sharika-royal-slots-audio-server-staging-20261119]
    paths: ['.github/workflows/sharika-greedy-wheel-fixes-staging.yml']
permissions:
  contents: read
jobs:
  validate-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: sharika-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate demo bets, daily leader, winners and static output
        run: |
          set -euo pipefail
          node --check hosted-game-center/web/practice.js
          node --check hosted-game-center/web/app.js
          node --check android-staging/app/src/main/assets/original-games/greedy-classic-live.js
          node --check cloudflare/src/greedy-classic.mjs
          node --test hosted-game-center/test/site.test.mjs hosted-game-center/test/hosted-route.test.mjs
          node hosted-game-center/scripts/build.mjs
          test -s hosted-game-center/dist/games/original-games/greedy-classic-live.js
      - name: Deploy authenticated API to staging only
        working-directory: cloudflare
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Deploy Game Center assets to staging only
        working-directory: hosted-game-center
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify live staging Food Wheel fix strings and health
        run: |
          set -euo pipefail
          host=https://sharika-games-web-staging.soverixnet.workers.dev
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "$host/games/original-games/greedy-classic-live.js" -o /tmp/food-live.js
          grep -Fq "greedy-verified-win-banner" /tmp/food-live.js
          grep -Fq "globalWinnersInitialized=true" /tmp/food-live.js
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "$host/practice.js" -o /tmp/food-practice.js
          grep -Fq "'grape','lettuce','pepper','watermelon'" /tmp/food-practice.js
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "$host/app.js" -o /tmp/food-app.js
          grep -Fq "'rankings','bet','winners'" /tmp/food-app.js
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors https://sharika-api-staging.soverixnet.workers.dev/health | grep -Fq '"ok":true'
