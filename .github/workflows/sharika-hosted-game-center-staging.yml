name: Sharika Hosted Game Center — isolated staging
on:
  push:
    branches: [feature/sharika-hosted-game-center-20261118]
    paths:
      - 'hosted-game-center/**'
      - 'android-staging/app/src/main/assets/original-games/**'
      - 'android-staging/app/src/main/assets/fruit-royale/**'
      - 'android-staging/app/src/main/assets/greedy-wheel/**'
      - '.github/workflows/sharika-hosted-game-center-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sharika-hosted-game-center-staging
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check local assets and secure browser bridge
        run: |
          node --check hosted-game-center/src/index.mjs
          node --check hosted-game-center/web/app.js
          node hosted-game-center/scripts/build.mjs
          node --test hosted-game-center/test/site.test.mjs
          test -s hosted-game-center/dist/games/original-games/royal-ace-deluxe.html
          test -s hosted-game-center/dist/games/original-games/cleopatra-slot.html
      - name: Validate Cloudflare worker bundle without changes
        working-directory: hosted-game-center
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/sharika-game-center-bundle
  publish-staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sharika-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Ensure deployment stays separate from Play and production
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const w=JSON.parse(readFileSync('hosted-game-center/wrangler.jsonc','utf8'));
          if(w.name!=='sharika-games-web-staging'||w.account_id!=='d81cf7c48fb9b36d468cb0a08720cd74'||
             w.d1_databases||w.r2_buckets||w.services)throw Error('Invalid isolated hosting target');
          NODE
      - name: Build hosted content
        run: node hosted-game-center/scripts/build.mjs
      - name: Publish isolated website only
        working-directory: hosted-game-center
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Confirm website health and public catalog
        run: |
          # A brand-new workers.dev hostname can briefly return 404 while
          # Cloudflare publishes the route. Retry *all* HTTP failures.
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --max-time 10 https://sharika-games-web-staging.soverixnet.workers.dev/health
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --max-time 10 https://sharika-games-web-staging.soverixnet.workers.dev/api/catalog | grep -q 'requires_sharika_app'
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --max-time 10 https://sharika-games-web-staging.soverixnet.workers.dev/ | grep -q 'SHARIKA'

  browser-qa:
    needs: publish-staging
    # Playwright 1.58 supports Ubuntu Noble; ubuntu-latest is now 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated Playwright QA dependencies
        run: npm install --prefix hosted-game-center --no-audit --no-fund
      - name: Install real headless Chromium
        run: ./hosted-game-center/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify public and two-account hosted game requests in real browser
        run: node --test hosted-game-center/test/browser.test.mjs
