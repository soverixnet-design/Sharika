name: Sharika login recovery direct test APK

on:
  push:
    branches:
      - feature/sharika-family-bd-crystal-ledger-20261103
    paths:
      - '.github/workflows/sharika-login-recovery-direct-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for exact fixed Android build and emulator smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 41733019972 --repo soverixnet-design/Sharika --exit-status
          actual="$(gh api repos/soverixnet-design/Sharika/actions/runs/41733019972 --jq '.head_sha')"
          test "$actual" = "44b4fdaff9283d507c8c480327890855297b99e0"

      - name: Download exact tested staging APK
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41733019972
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: verified-apk

      - name: Verify startup recovery and bundled logo inside installable APK
        run: |
          set -euo pipefail
          test -s verified-apk/app-debug.apk
          unzip -tqq verified-apk/app-debug.apk
          unzip -l verified-apk/app-debug.apk | grep -F 'assets/startup-safety.js'
          unzip -l verified-apk/app-debug.apk | grep -F 'assets/sharika_logo.jpg'
          unzip -p verified-apk/app-debug.apk assets/index.html | grep -F 'sharika-startup-safety'
          unzip -p verified-apk/app-debug.apk assets/startup-safety.js | grep -F 'MAX_STARTUP_MS = 12000'
          cp verified-apk/app-debug.apk Sharika-Login-Recovery-Staging.apk
          sha256sum Sharika-Login-Recovery-Staging.apk

      - name: Publish direct APK as clearly marked staging prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='sharika-login-recovery-staging-44b4fda'
          if gh release view "$tag" --repo soverixnet-design/Sharika >/dev/null 2>&1; then
            echo "::error::Release tag already exists. Refusing to overwrite an installed APK."
            exit 1
          fi
          gh release create "$tag" Sharika-Login-Recovery-Staging.apk \
            --repo soverixnet-design/Sharika \
            --target 44b4fdaff9283d507c8c480327890855297b99e0 \
            --title "Sharika Login Recovery (STAGING TEST APK)" \
            --notes "Android startup now has a bounded recovery path so a stalled splash cannot indefinitely hide Firebase login. The locally packaged Sharika logo replaces a broken inline WebP. Existing Cloudflare D1 data, login identity, coins, games and room logic remain unchanged. The exact signed staging APK passed the Android build and emulator startup smoke workflow. TEST BUILD ONLY; not approved for Play Store."
