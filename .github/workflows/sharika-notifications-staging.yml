name: Sharika notifications rollout (isolated staging only)
on:
  push:
    branches:
      - feature/sharika-notifications-20261101
    paths:
      - '.github/workflows/sharika-notifications-staging.yml'

permissions:
  contents: read

concurrency:
  group: sharika-isolated-staging-worker-publish
  cancel-in-progress: false

jobs:
  publish-notifications:
    name: Verify, migrate 0033 and publish staging API + admin
    runs-on: ubuntu-latest
    environment: sharika-staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse unexpected branch, Workers, project, secrets or D1
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const api=JSON.parse(readFileSync('cloudflare/wrangler.jsonc','utf8'));
          const admin=JSON.parse(readFileSync('cloudflare/wrangler.admin.jsonc','utf8'));
          if(process.env.GITHUB_REF!=='refs/heads/feature/sharika-notifications-20261101' ||
             !process.env.CLOUDFLARE_API_TOKEN ||
             api.name!=='sharika-api-staging' ||
             api.account_id!=='d81cf7c48fb9b36d468cb0a08720cd74' ||
             api.vars?.SHARIKA_ENV!=='staging' ||
             api.vars?.FIREBASE_PROJECT_ID!=='sharika-voice-chat-app' ||
             api.vars?.SHARIKA_LUCKY_GIFTS_ENABLED!=='false' ||
             api.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=='false' ||
             api.keep_vars!==true ||
             api.d1_databases?.length!==1 ||
             api.d1_databases[0].binding!=='DB' ||
             api.d1_databases[0].database_name!=='sharika-staging' ||
             api.d1_databases[0].database_id!=='b2c62252-12a5-4740-90c7-01a536d9a39a' ||
             api.durable_objects?.bindings?.[0]?.name!=='VOICE_ROOMS' ||
             api.durable_objects.bindings[0].class_name!=='SharikaVoiceRoom' ||
             !api.secrets?.required?.includes('REALTIME_SFU_APP_SECRET') ||
             admin.name!=='sharika-admin-staging' ||
             admin.account_id!==api.account_id ||
             admin.vars?.SHARIKA_ENV!=='staging' ||
             admin.services?.length!==1 ||
             admin.services[0].binding!=='SHARIKA_API' ||
             admin.services[0].service!=='sharika-api-staging')
            throw Error('Staging scope protection failed: not publishing');
          console.log('Exact isolated Sharika staging Workers and D1 verified');
          NODE
      - name: Syntax and unit tests
        run: npm --prefix cloudflare run check
      - name: Verify existing 32 migrations and notification tables absent
        run: |
          node --input-type=module - <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/b2c62252-12a5-4740-90c7-01a536d9a39a/query';
          const sql="SELECT (SELECT COUNT(*) FROM d1_migrations) AS count,"+
            "(SELECT COUNT(*) FROM d1_migrations WHERE name='0032_special_ids.sql') AS prior,"+
            "(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='sharika_special_ids') AS prior_table,"+
            "(SELECT COUNT(*) FROM d1_migrations WHERE name='0033_notifications.sql') AS new_migration,"+
            "(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='sharika_notifications') AS new_table";
          const response=await fetch(url,{method:'POST',headers:{
            Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type':'application/json'},body:JSON.stringify({sql})});
          const result=await response.json(),row=result.result?.[0]?.results?.[0];
          if(!response.ok||!result.success||row?.count!==32||row?.prior!==1||
             row?.prior_table!==1||row?.new_migration!==0||row?.new_table!==0)
            throw Error('Unexpected D1 schema; refusing notification migration');
          console.log('Existing staging schema confirmed; only 0033 pending');
          NODE
      - name: Verify D1 time-travel recovery bookmark is available
        run: |
          node --input-type=module - <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/b2c62252-12a5-4740-90c7-01a536d9a39a/time_travel/bookmark';
          const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          const data=await response.json();
          if(!response.ok||!data.success||!data.result?.bookmark)
            throw Error('No D1 recovery bookmark available; not changing schema');
          console.log('D1 rollback bookmark available (value not logged)');
          NODE
      - name: Apply only the reviewed additive 0033 notifications migration
        run: npx --yes wrangler@4 d1 migrations apply sharika-staging --remote --config cloudflare/wrangler.jsonc
      - name: Verify notification schema and journal before Worker deploy
        run: |
          node --input-type=module - <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/b2c62252-12a5-4740-90c7-01a536d9a39a/query';
          const sql="SELECT (SELECT COUNT(*) FROM d1_migrations) AS count,"+
            "(SELECT COUNT(*) FROM d1_migrations WHERE name='0033_notifications.sql') AS migration,"+
            "(SELECT COUNT(*) FROM sqlite_master WHERE name='sharika_notifications') AS notifications,"+
            "(SELECT COUNT(*) FROM sqlite_master WHERE name='sharika_push_devices') AS devices,"+
            "(SELECT COUNT(*) FROM sqlite_master WHERE name='sharika_message_reads') AS reads";
          const response=await fetch(url,{method:'POST',headers:{
            Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type':'application/json'},body:JSON.stringify({sql})});
          const data=await response.json(),row=data.result?.[0]?.results?.[0];
          if(!response.ok||!data.success||row?.count!==33||row?.migration!==1||
             row?.notifications!==1||row?.devices!==1||row?.reads!==1)
            throw Error('Notification schema unverified; refusing Worker deployments');
          console.log('Migration 0033 verified');
          NODE
      - name: Inspect API bundle without deployment
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir /tmp/sharika-notifications-api-bundle
      - name: Publish existing isolated staging API Worker
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.jsonc
      - name: Bundle real admin design and authenticated connector
        run: |
          cp admin/index.html cloudflare/src/admin-index.html
          cp admin/connection.js cloudflare/src/admin-connection.txt
          node --check admin/connection.js
          npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.admin.jsonc --outdir /tmp/sharika-notifications-admin-bundle
      - name: Publish existing isolated staging admin Worker
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.admin.jsonc
      - name: Smoke test both staging services, not production
        run: |
          curl --fail --silent --show-error --max-time 20 https://sharika-api-staging.soverixnet.workers.dev/health
          curl --fail --silent --show-error --max-time 20 https://sharika-admin-staging.soverixnet.workers.dev/health
          curl --fail --silent --show-error --max-time 20 https://sharika-admin-staging.soverixnet.workers.dev/admin/connection.js | grep -F 'Official Notifications' > /dev/null
          echo 'SHARIKA_NOTIFICATIONS_STAGING_ADMIN_AND_API_OK'
