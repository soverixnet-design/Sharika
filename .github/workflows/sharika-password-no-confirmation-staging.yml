name: Sharika password signup without confirmation staging API

on:
  push:
    branches:
      - feature/sharika-password-no-confirmation-api-staging-20261107
    paths:
      - '.github/workflows/sharika-password-no-confirmation-staging.yml'
      - 'cloudflare/src/auth.mjs'
      - 'cloudflare/test/worker.test.mjs'

permissions:
  contents: read

concurrency:
  group: sharika-isolated-staging-worker-publish
  cancel-in-progress: false

jobs:
  deploy-password-signup-staging:
    name: Verify signed Firebase JWT and publish staging-only auth adjustment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sharika-staging
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject production or unexpected database configuration
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/sharika-password-no-confirmation-api-staging-20261107'
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          const db=c.d1_databases?.[0];
          if(c.name!=='sharika-api-staging'||
             c.account_id!=='d81cf7c48fb9b36d468cb0a08720cd74'||
             c.vars?.SHARIKA_ENV!=='staging'||
             c.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=='false'||
             c.vars?.SHARIKA_PLAY_BILLING_ENABLED!=='false'||
             c.keep_vars!==true||c.workers_dev!==true||
             c.d1_databases?.length!==1||db?.binding!=='DB'||
             db?.database_name!=='sharika-staging'||
             db?.database_id!=='b2c62252-12a5-4740-90c7-01a536d9a39a')
            throw Error('Refusing unexpected API Worker, database or configuration');
          console.log('EXACT_STAGING_WORKER_AND_EXISTING_DATABASE_VERIFIED');
          NODE
      - name: Verify JWT signature, rejected forgery and password policy
        run: |
          npm run check
          node --test test/worker.test.mjs
      - name: Require healthy current staging before any publish
        run: curl -fSs --max-time 20 https://sharika-api-staging.soverixnet.workers.dev/health
      - name: Compile only the expected staging Worker
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Update only staging Worker without database migrations
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify staging API availability after deployment
        run: |
          set -euo pipefail
          curl -fSs --max-time 20 https://sharika-api-staging.soverixnet.workers.dev/health
          echo 'PASSWORD_SIGNUP_NO_EMAIL_VERIFICATION_STAGING_DEPLOYED'
