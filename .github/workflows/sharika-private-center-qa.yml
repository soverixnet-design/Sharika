name: Sharika Private Center - staging QA (no deployment)
on:
  push:
    branches:
      - feature/sharika-private-center-catalog-20261119
  pull_request:
    paths:
      - 'cloudflare/src/private-center.mjs'
      - 'cloudflare/migrations/0101_private_center_publishing.sql'
      - 'hosted-game-center/**'
      - 'android-staging/app/src/main/java/com/soverixnet/sharika/SharikaGameCenterActivity.java'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private source syntax
        run: |
          node --check cloudflare/src/private-center.mjs
          node --check cloudflare/src/index.mjs
          node --check cloudflare/src/events.mjs
          node --check hosted-game-center/src/private-index.mjs
          node --check hosted-game-center/web/center.js
          node --check hosted-game-center/web/app.js
      - name: Build protected admin and private website bundles without deploying
        run: |
          node --check admin/connection.js
          node hosted-game-center/scripts/build.mjs
          mkdir -p cloudflare/src
          cp admin/index.html cloudflare/src/admin-index.html
          cp admin/connection.js cloudflare/src/admin-connection.txt
          npx --yes wrangler@4 deploy --dry-run --config hosted-game-center/wrangler.private.jsonc --outdir /tmp/sharika-private-center-dryrun
          npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.admin.jsonc --outdir /tmp/sharika-admin-private-dryrun
      - name: Verify full Cloudflare staging business-logic regression suite
        run: npm --prefix cloudflare run check
      - name: Run isolated publication, private event media and WebView game CSP tests
        run: node --test cloudflare/test/private-center.test.mjs cloudflare/test/center-rankings.test.mjs hosted-game-center/test/private-event-access.test.mjs
      - name: Check only new migration in temporary SQLite
        run: |
          python3 - <<'PY'
          import sqlite3,pathlib
          sql=pathlib.Path('cloudflare/migrations/0101_private_center_publishing.sql').read_text()
          c=sqlite3.connect(':memory:')
          c.executescript(sql)
          count=c.execute('SELECT COUNT(*) FROM sharika_center_publishing').fetchone()[0]
          assert count >= 20
          assert c.execute('SELECT COUNT(*) FROM sharika_center_publishing WHERE published=1').fetchone()[0]==0
          for t in ('sharika_center_odds_drafts','sharika_center_launch_tickets','sharika_center_browser_sessions'):
            assert c.execute('SELECT name FROM sqlite_master WHERE name=?',(t,)).fetchone()
          print('PASS: new isolated schema, all content hidden by default, no old ledgers affected')
          PY
