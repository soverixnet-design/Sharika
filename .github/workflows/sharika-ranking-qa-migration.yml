name: Sharika isolated Ranking QA D1 migration

on:
  push:
    branches:
      - feature/sharika-ranked-agency-integration-20261106
    paths:
      - '.github/workflows/sharika-ranking-qa-migration.yml'

permissions:
  contents: read

jobs:
  isolated-schema-test:
    name: Test all migrations against an empty isolated QA D1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refuse any staging or production D1 target
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/sharika-ranked-agency-integration-20261106'
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.ranking-qa.jsonc','utf8'));
          const db=c.d1_databases?.[0];
          if(c.account_id!=='d81cf7c48fb9b36d468cb0a08720cd74'||
             c.name!=='sharika-ranking-qa-migrations-only'||
             c.d1_databases?.length!==1||db.binding!=='DB'||
             db.database_name!=='sharika-ranking-qa-20261106'||
             db.database_id!=='c72c44fc-5e29-4338-9be5-1763b94acd46'||
             db.migrations_dir!=='migrations')
            throw Error('Refusing any non-isolated database migration target');
          console.log('ISOLATED_QA_D1_ONLY_GUARD_OK');
          NODE

      - name: Verify schema and finance tests without remote writes
        run: |
          npm run check
          python3 test/verified-activity-sql.test.py

      - name: Inspect pending migrations in isolated QA D1 only
        run: npx --yes wrangler@4 d1 migrations list sharika-ranking-qa-20261106 --remote --config wrangler.ranking-qa.jsonc

      - name: Apply all migrations to isolated QA D1 only
        run: npx --yes wrangler@4 d1 migrations apply sharika-ranking-qa-20261106 --remote --config wrangler.ranking-qa.jsonc

      - name: Verify new ranking and existing Agency schemas, no payouts enabled
        run: |
          npx --yes wrangler@4 d1 execute sharika-ranking-qa-20261106 --remote --config wrangler.ranking-qa.jsonc \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('sharika_verified_activity_events','sharika_ranking_reward_policies','sharika_agency_salary_exchanges') ORDER BY name"
          npx --yes wrangler@4 d1 execute sharika-ranking-qa-20261106 --remote --config wrangler.ranking-qa.jsonc \
            --command "SELECT paused FROM sharika_ranking_reward_control WHERE id=1"
          npx --yes wrangler@4 d1 execute sharika-ranking-qa-20261106 --remote --config wrangler.ranking-qa.jsonc \
            --command "SELECT exchange_enabled FROM sharika_agency_salary_config WHERE key='standard'"
          echo 'QA_ONLY; no Worker deploy, no live staging D1 write, no payouts.'
