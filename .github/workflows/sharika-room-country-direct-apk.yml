name: Sharika verified room ID and country direct APK
on:
  push:
    branches:
      - feature/sharika-family-bd-crystal-ledger-20261103
    paths:
      - '.github/workflows/sharika-room-country-direct-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-direct-staging-apk:
    name: Publish verified debug APK for friend testing (no ZIP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify this exact Android and backend staging build passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 41682296840 --repo soverixnet-design/Sharika --json conclusion --jq '.conclusion')" = success
          test "$(gh run view 41682296996 --repo soverixnet-design/Sharika --json conclusion --jq '.conclusion')" = success
          test "$(gh api repos/soverixnet-design/Sharika/actions/artifacts/13254895125 --jq '.workflow_run.head_sha')" = b26775b3064e834b7c390ae1c39e28e92c65ff31
          echo 'VERIFIED_SOURCE_APK_AND_STAGING_BACKEND'

      - name: Download only the verified Android APK build
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41682296840
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: staging-apk

      - name: Verify Special ID and country display before public link
        run: |
          set -euo pipefail
          test -s staging-apk/app-debug.apk
          unzip -tqq staging-apk/app-debug.apk
          unzip -p staging-apk/app-debug.apk assets/connection.js > "$RUNNER_TEMP/sharika-connection.js"
          node - <<'NODE'
          const fs=require('node:fs');
          const body=fs.readFileSync(process.env.RUNNER_TEMP+'/sharika-connection.js','utf8');
          for(const required of [
            "className='sh-room-country-label'",
            'owner_display_id:r.owner_display_id||r.id',
            'roomHeaderId.textContent=visibleOwnerId',
            "button.textContent='📷 Change room card photo'",
            "location.textContent=title"
          ]) {
            if(!body.includes(required))throw Error('APK lacks room/country feature: '+required);
          }
          if(body.includes("textContent='📷 Edit photo'"))throw Error('Outside Edit photo still visible');
          console.log('VERIFIED_ROOM_SPECIAL_ID_COUNTRY_AND_PRIVATE_PHOTO_EDIT');
          NODE
          install -m 0644 staging-apk/app-debug.apk staging-apk/Sharika-Special-ID-Country-Staging.apk
          sha256sum staging-apk/Sharika-Special-ID-Country-Staging.apk

      - name: Publish a unique, clearly labeled staging GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=sharika-staging-special-id-country-b26775b3
          if gh release view "$TAG" --repo soverixnet-design/Sharika >/dev/null 2>&1; then
            echo "::error::Existing release; refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG" staging-apk/Sharika-Special-ID-Country-Staging.apk \
            --repo soverixnet-design/Sharika \
            --target b26775b3064e834b7c390ae1c39e28e92c65ff31 \
            --title "Sharika Special ID + Room Country (STAGING TEST APK)" \
            --notes "Direct APK for Android private testing. Room displays active Special ID; outside cards show profile country and no Edit photo button; cover edit remains inside Owner Settings. Built and Android emulator-tested from commit b26775b3 with staging backend validated. This is a DEBUG STAGING APK, NOT a Play Store production release." \
            --prerelease
