name: Sharika Royal Cover and CP - staging APK QA
on:
  push:
    branches:
      - feature/sharika-royal-profile-cover-cp-20261117
    paths:
      - 'app/sharika-cover-profile.css'
      - 'android-staging/app/build.gradle'
      - 'android-staging/staging-connection.js'
      - 'android-staging/profile-cover-layout.test.mjs'
      - '.github/workflows/sharika-royal-profile-cover-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify profile UI and Firebase-backed staging adapter
        run: |
          set -euo pipefail
          node --check android-staging/staging-connection.js
          node --test android-staging/profile-cover-layout.test.mjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build isolated unsigned/debug test APK
        working-directory: android-staging
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm packaged cover CSS and verified CP adapter
        run: |
          set -euo pipefail
          APK='android-staging/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -tqq "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/sharika-cover-profile.css'
          unzip -p "$APK" assets/index.html | grep -F 'sharika-cover-profile-v1' > /dev/null
          unzip -p "$APK" assets/connection.js | grep -F 'sh-public-cp-add' > /dev/null
      - name: Keep QA APK private as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sharika-Royal-Cover-CP-Staging-APK
          path: android-staging/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
