name: Sharika Royal Slots female welcome audio
on:
  push:
    branches: [feature/sharika-royal-slots-audio-server-staging-20261119]
    paths: ['.github/workflows/sharika-royal-slots-female-welcome.yml']
permissions:
  contents: write
concurrency:
  group: royal-slots-female-welcome-stage
  cancel-in-progress: false
jobs:
  female-welcome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: sharika-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WELCOME_AUDIO_URL: "https://eu-central.storage.cloudconvert.com/tasks/461c979d-da73-4997-b667-abc737c455e7/speech.mp3?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20261119%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20261119T005828Z&X-Amz-Expires=86400&X-Amz-Signature=1dba6ff679da09f7f08f7716393f5edb912a2a2ef64be83fe2624ffd84412e41&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22speech.mp3%22&response-content-type=audio%2Fmpeg&x-amz-checksum-mode=ENABLED&x-id=GetObject"
      BIG_WIN_AUDIO_URL: "https://eu-central.storage.cloudconvert.com/tasks/07c21aa4-7582-4c34-b93c-acc6a2b35e0b/speech.mp3?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20261119%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20261119T005853Z&X-Amz-Expires=86400&X-Amz-Signature=58574fcf80e5e9a1ede5bab6a11e2f0a725822bf0fcad6e9c0fd01f1db643afe&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22speech.mp3%22&response-content-type=audio%2Fmpeg&x-amz-checksum-mode=ENABLED&x-id=GetObject"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Download generated female voice files
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 2 "$WELCOME_AUDIO_URL" -o hosted-game-center/web/welcome-female.mp3
          curl -fLsS --retry 4 --retry-delay 2 "$BIG_WIN_AUDIO_URL" -o hosted-game-center/web/voice-big-female.mp3
          test "$(wc -c < hosted-game-center/web/welcome-female.mp3)" -gt 10000
          test "$(wc -c < hosted-game-center/web/voice-big-female.mp3)" -gt 5000
          file hosted-game-center/web/{welcome-female,voice-big-female}.mp3 | grep -q 'Audio'
      - name: Validate female greeting script, tests and asset bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check hosted-game-center/web/royal-slots-voice.js
          node --check hosted-game-center/scripts/build.mjs
          node --test hosted-game-center/test/royal-slots-integration.test.mjs
          node hosted-game-center/scripts/build.mjs
          grep -q 'royal-slots-voice.js' hosted-game-center/dist/games/royal-slots/index.html
          test -s hosted-game-center/dist/games/royal-slots/welcome-female.mp3
          test -s hosted-game-center/dist/games/royal-slots/voice-big-female.mp3
      - name: Commit permanent voice assets to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hosted-game-center/web/welcome-female.mp3 hosted-game-center/web/voice-big-female.mp3
          git commit -m "Store female Sharika welcome and Big Winner announcements"
          git push origin HEAD:feature/sharika-royal-slots-audio-server-staging-20261119
      - name: Deploy Game Center staging only
        working-directory: hosted-game-center
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Check hosted welcome and win audio
        shell: bash
        run: |
          set -euo pipefail
          host=https://sharika-games-web-staging.soverixnet.workers.dev/games/royal-slots
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$host/welcome-female.mp3" -o /tmp/welcome.mp3
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$host/voice-big-female.mp3" -o /tmp/big.mp3
          test "$(wc -c < /tmp/welcome.mp3)" -gt 10000
          test "$(wc -c < /tmp/big.mp3)" -gt 5000
