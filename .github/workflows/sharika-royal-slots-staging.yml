name: Sharika Royal Slots staging integration
on:
  push:
    branches: [feature/sharika-royal-slots-audio-server-staging-20261119]
    paths:
      - 'hosted-game-center/**'
      - 'cloudflare/src/index.mjs'
      - 'cloudflare/src/royal-slots.mjs'
      - 'cloudflare/src/game-catalog.mjs'
      - 'cloudflare/migrations/0100_royal_slots.sql'
      - 'cloudflare/test/royal-slots.test.mjs'
      - '.github/workflows/sharika-royal-slots-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sharika-royal-slots-staging
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate game, audio bridge and backend
        run: |
          set -euo pipefail
          node --check cloudflare/src/index.mjs
          node --check cloudflare/src/royal-slots.mjs
          node --check cloudflare/src/game-catalog.mjs
          node --check hosted-game-center/src/index.mjs
          node --check hosted-game-center/web/app.js
          node --check hosted-game-center/web/royal-slots-bridge.js
          node --test cloudflare/test/royal-slots.test.mjs
          node --test hosted-game-center/test/site.test.mjs hosted-game-center/test/room-profile.test.mjs hosted-game-center/test/hosted-route.test.mjs
          node hosted-game-center/scripts/build.mjs
          test -s hosted-game-center/dist/games/royal-slots/index.html
          test -s hosted-game-center/dist/games/royal-slots/bridge.js
          test -s hosted-game-center/dist/cards/royal-slots.svg
      - name: Verify staging-only targets and virtual-only policy
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('cloudflare/wrangler.jsonc','utf8'));
          const w=JSON.parse(readFileSync('hosted-game-center/wrangler.jsonc','utf8'));
          if(a.name!=='sharika-api-staging'||w.name!=='sharika-games-web-staging'||
             a.account_id!=='d81cf7c48fb9b36d468cb0a08720cd74'||
             w.account_id!==a.account_id||a.d1_databases?.[0]?.database_id!=='b2c62252-12a5-4740-90c7-01a536d9a39a'||
             a.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=='false'||w.d1_databases||w.r2_buckets)
             throw Error('staging_only_required');
          const sql=readFileSync('cloudflare/migrations/0100_royal_slots.sql','utf8');
          if(!sql.includes("VALUES('royal-slots',0)"))throw Error('royal_slots_disabled_required');
          NODE
      - name: Dry-run both staging Workers
        run: |
          cd cloudflare
          npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --outdir /tmp/slots-api
          cd ../hosted-game-center
          npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --outdir /tmp/slots-web
  deploy-staging:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: sharika-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm staging D1 and no game auto-enable
        working-directory: cloudflare
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE name IN ('sharika_royal_slots_rounds','royal_slots_validate','royal_slots_settle');"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT enabled FROM sharika_royal_slots_settings WHERE id=1;"
      - name: Deploy authenticated API to staging only
        working-directory: cloudflare
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Build and deploy hosted Game Center to staging only
        run: |
          node hosted-game-center/scripts/build.mjs
          cd hosted-game-center
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify Royal Slots asset and API health
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors https://sharika-api-staging.soverixnet.workers.dev/health
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors https://sharika-games-web-staging.soverixnet.workers.dev/api/catalog | grep -Fq royal-slots
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors https://sharika-games-web-staging.soverixnet.workers.dev/games/royal-slots/bridge.js | grep -Fq sharika-royal-slots
