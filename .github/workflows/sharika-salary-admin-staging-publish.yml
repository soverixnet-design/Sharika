name: Sharika Salary Seller Transfer Admin staging publish

# One-shot admin UI rollout. No D1 migration, no production Worker and no
# scheduled republishing when ordinary application code later changes.
on:
  push:
    branches:
      - feature/sharika-full-integrated-staging-20261107
    paths:
      - '.github/workflows/sharika-salary-admin-staging-publish.yml'

permissions:
  contents: read

concurrency:
  group: sharika-isolated-staging-admin-worker-publish
  cancel-in-progress: false

jobs:
  publish-admin:
    name: Verify and publish Salary controls to existing staging Admin interface
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: sharika-staging
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact staging source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard staging-only target, unchanged bindings and review UI
        run: |
          test "$GITHUB_REF" = 'refs/heads/feature/sharika-full-integrated-staging-20261107'
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.admin.jsonc','utf8'));
          const api=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          const script=readFileSync('../admin/connection.js','utf8');
          const backend=readFileSync('src/agency.mjs','utf8');
          if(config.name!=='sharika-admin-staging'||
             config.main!=='src/admin-frontend-worker.mjs'||
             config.account_id!=='d81cf7c48fb9b36d468cb0a08720cd74'||
             config.workers_dev!==true||config.vars?.SHARIKA_ENV!=='staging'||
             config.services?.length!==1||
             config.services[0].binding!=='SHARIKA_API'||
             config.services[0].service!=='sharika-api-staging'||
             config.services[0].environment!=='production'||
             api.name!=='sharika-api-staging'||
             api.d1_databases?.[0]?.database_name!=='sharika-staging'||
             !script.includes('Salary → Seller audited transfers')||
             !script.includes("id=\"ag2-salary-enabled\"")||
             !script.includes("t.credited_coins")||
             script.includes('ag2-salary-seller-enabled')||
             !backend.includes("'/api/v1/agency/salary/transfer'"))
            throw Error('Refusing unexpected deployment target, bindings, or Salary → Seller Admin UI');
          NODE
      - name: Verify Worker and shared Salary settlement regression suite
        run: npm run check
      - name: Verify staging Admin is healthy before replacement
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            https://sharika-admin-staging.soverixnet.workers.dev/health \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const x=JSON.parse(s);if(x.service!=="sharika-admin-staging"||
                   !x.api_service_configured)process.exit(1);});'
      - name: Package Admin shell with audited Salary payout UI, dry run
        run: |
          cp ../admin/index.html src/admin-index.html
          cp ../admin/connection.js src/admin-connection.txt
          npx --yes wrangler@4 deploy --dry-run --config wrangler.admin.jsonc \
            --outdir /tmp/sharika-salary-admin-dry-run
      - name: Deploy staging Admin Worker only
        run: npx --yes wrangler@4 deploy --config wrangler.admin.jsonc
      - name: Confirm published Salary Seller audit and staging health
        run: |
          curl --fail --silent --show-error --retry 4 --max-time 20 \
            https://sharika-admin-staging.soverixnet.workers.dev/health \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const x=JSON.parse(s);if(!x.ok||x.service!=="sharika-admin-staging"||
                   !x.api_service_configured)process.exit(1);});'
          curl --fail --silent --show-error --retry 4 --max-time 20 \
            https://sharika-admin-staging.soverixnet.workers.dev/admin/connection.js \
            | grep -F 'Salary → Seller audited transfers' >/dev/null
