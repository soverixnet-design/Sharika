name: Sharika server sync

# Stays disabled until a verified SSH deploy user and repository secrets exist.
# This syncs source files to an isolated release directory; it does not restart
# LiveKit, Ayra-Ava, Sovera, Caddy, or any database.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "admin/**"
      - "backend/**"
      - ".github/workflows/sharika-server-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharika-server-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.SHARIKA_AUTO_DEPLOY == 'enabled' }}
    runs-on: ubuntu-latest
    environment: sharika-deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify prepared source
        run: |
          test -s app/index.html
          test -s admin/index.html
          test -s backend/sharika-api/index.ts

      - name: Configure pinned SSH connection
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.SHARIKA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.SHARIKA_DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.SHARIKA_DEPLOY_PORT || '22' }}
          DEPLOY_KEY: ${{ secrets.SHARIKA_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SHARIKA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" "$DEPLOY_KEY" "$DEPLOY_KNOWN_HOSTS"; do
            if [ -z "$value" ]; then
              echo "::error::Sharika SSH deployment is not configured. See DEPLOYMENT_SETUP.md."
              exit 1
            fi
          done
          if [ "$DEPLOY_USER" = "root" ]; then
            echo "::error::Use a dedicated, non-root Sharika deploy account."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/sharika-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/sharika-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/sharika-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/sharika-ssh/id_ed25519" "$RUNNER_TEMP/sharika-ssh/known_hosts"
          {
            echo "SSH_HOST=$DEPLOY_HOST"
            echo "SSH_USER=$DEPLOY_USER"
            echo "SSH_PORT=$DEPLOY_PORT"
            echo "SSH_KEY=$RUNNER_TEMP/sharika-ssh/id_ed25519"
            echo "SSH_KNOWN_HOSTS=$RUNNER_TEMP/sharika-ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Copy a new immutable release
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
            "$SSH_USER@$SSH_HOST" "mkdir -p sharika/releases/$GITHUB_SHA"
          rsync -az -- \
            -e "ssh -i $SSH_KEY -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_KNOWN_HOSTS" \
            app admin backend \
            "$SSH_USER@$SSH_HOST:sharika/releases/$GITHUB_SHA/"

      - name: Verify release and switch the Sharika-only pointer
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
            "$SSH_USER@$SSH_HOST" \
            "test -s sharika/releases/$GITHUB_SHA/app/index.html && \
             test -s sharika/releases/$GITHUB_SHA/admin/index.html && \
             test -s sharika/releases/$GITHUB_SHA/backend/sharika-api/index.ts && \
             ln -sfnT releases/$GITHUB_SHA sharika/current"
          echo "Sharika source synchronized. Existing services and database were not changed."
