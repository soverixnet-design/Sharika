name: Sharika Special ID 1-10 guarded staging rollout

on:
  push:
    branches:
      - feature/sharika-winged-royal-unlimited-seller-20261102
    paths:
      - '.github/workflows/sharika-special-id-1-to-10-staging.yml'

permissions:
  contents: read

concurrency:
  group: sharika-isolated-staging-worker-publish
  cancel-in-progress: false

jobs:
  guarded-special-ids:
    name: Preserve D1, migrate 0042, publish staging API and Admin
    runs-on: ubuntu-latest
    environment: sharika-staging
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse any non-approved branch, Worker or D1 binding
        run: |
          test "$GITHUB_REF" = "refs/heads/feature/sharika-winged-royal-unlimited-seller-20261102"
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const api=JSON.parse(readFileSync('cloudflare/wrangler.jsonc','utf8'));
          const admin=JSON.parse(readFileSync('cloudflare/wrangler.admin.jsonc','utf8'));
          const d1=api.d1_databases?.[0];
          if(api.name!=='sharika-api-staging'||
             api.account_id!=='d81cf7c48fb9b36d468cb0a08720cd74'||
             api.vars?.SHARIKA_ENV!=='staging'||
             api.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=='false'||
             api.vars?.SHARIKA_LUCKY_GIFTS_ENABLED!=='false'||
             api.keep_vars!==true||api.d1_databases?.length!==1||
             d1?.binding!=='DB'||d1.database_name!=='sharika-staging'||
             d1.database_id!=='b2c62252-12a5-4740-90c7-01a536d9a39a'||
             admin.name!=='sharika-admin-staging'||
             admin.account_id!==api.account_id||
             admin.vars?.SHARIKA_ENV!=='staging'||
             admin.services?.length!==1||
             admin.services[0]?.service!=='sharika-api-staging')
            throw Error('Unapproved Cloudflare target');
          console.log('Verified isolated Sharika staging resources');
          NODE
      - name: Syntax, all unit tests and 1-10 digit Special ID migration checks
        run: |
          npm --prefix cloudflare run check
          python3 cloudflare/test/special-id-migration-check.py
      - name: Capture D1 recovery bookmark and immutable financial baseline
        run: |
          node --input-type=module - <<'NODE'
          import {writeFileSync} from 'node:fs';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/b2c62252-12a5-4740-90c7-01a536d9a39a';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type':'application/json'};
          async function call(path,body){
            const r=await fetch(root+path,{method:body?'POST':'GET',headers,
              ...(body?{body:JSON.stringify(body)}:{})});
            const j=await r.json();
            if(!r.ok||!j.success||!j.result)throw Error('D1 response unavailable');
            return j.result;
          }
          async function query(sql){
            const result=await call('/query',{sql});
            if(!result?.[0]?.success)throw Error('D1 query failed');
            return result[0].results;
          }
          const [latest]=await query('SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1');
          const [count]=await query('SELECT COUNT(*) AS n FROM d1_migrations');
          const [schema]=await query(
            "SELECT sql AS value FROM sqlite_master WHERE type='table' AND name='sharika_special_ids'");
          const [triggers]=await query(
            "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='trigger' AND tbl_name='sharika_special_ids'");
          const [collision]=await query(
            "SELECT COUNT(*) AS n FROM sharika_special_ids s JOIN sharika_users u "+
            "ON length(s.special_id)=8 AND u.public_no=CAST(s.special_id AS INTEGER)");
          if(count?.n!==41||latest?.name!=='0041_svip_shop_rewards_backpack.sql'||
             !schema?.value?.includes('BETWEEN 4 AND 7')||
             triggers?.n!==0||collision?.n!==0)
            throw Error('Unexpected D1 state or existing ID collision; refusing schema write');
          const aliases=await query('SELECT auth_uid,special_id,frame,expires_at,assigned_by,'+
            'created_at,updated_at FROM sharika_special_ids ORDER BY auth_uid');
          writeFileSync(process.env.RUNNER_TEMP+'/sharika-special-id-aliases-before.json',
            JSON.stringify(aliases),{mode:0o600});
          const [baseline]=await query('SELECT '+
            '(SELECT COUNT(*) FROM sharika_wallet_ledger) AS ledger,'+
            '(SELECT COUNT(*) FROM sharika_coin_seller_transfers) AS transfers,'+
            '(SELECT COUNT(*) FROM sharika_coin_seller_allocations) AS allocations,'+
            '(SELECT COUNT(*) FROM sharika_premium_memberships) AS memberships,'+
            '(SELECT COUNT(*) FROM sharika_premium_daily_claims) AS claims');
          if(Object.values(baseline||{}).some(n=>!Number.isSafeInteger(n)||n<0))
            throw Error('Invalid financial baseline');
          const bookmark=await call('/time_travel/bookmark');
          if(!bookmark.bookmark)throw Error('Missing recovery bookmark');
          writeFileSync(process.env.RUNNER_TEMP+'/sharika-special-ids-before.json',
            JSON.stringify({...baseline,bookmark:bookmark.bookmark}),{mode:0o600});
          console.log('Special ID recovery bookmark, preflight and baseline captured');
          NODE
      - name: Export staging D1 before schema change
        run: |
          npx --yes wrangler@4 d1 export sharika-staging --remote \
            --config cloudflare/wrangler.jsonc \
            --output "$RUNNER_TEMP/sharika-special-ids-before.sql"
          test -s "$RUNNER_TEMP/sharika-special-ids-before.sql"
      - name: Isolate only the approved Special ID 0042 migration
        run: |
          mkdir -p cloudflare/.sharika-special-ids-only
          cp cloudflare/migrations/0042_special_id_one_to_ten.sql cloudflare/.sharika-special-ids-only/
          test "$(find cloudflare/.sharika-special-ids-only -type f -name '*.sql' | wc -l)" -eq 1
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('cloudflare/wrangler.jsonc','utf8'));
          config.d1_databases[0].migrations_dir='.sharika-special-ids-only';
          writeFileSync('cloudflare/wrangler.special-id-guard.jsonc',JSON.stringify(config,null,2));
          NODE
      - name: Apply only Special ID 0042 to isolated remote D1
        run: |
          npx --yes wrangler@4 d1 migrations list sharika-staging --remote \
            --config cloudflare/wrangler.special-id-guard.jsonc
          npx --yes wrangler@4 d1 migrations apply sharika-staging --remote \
            --config cloudflare/wrangler.special-id-guard.jsonc
      - name: Verify migration and unchanged historical financial rows
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const before=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/sharika-special-ids-before.json','utf8'));
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/b2c62252-12a5-4740-90c7-01a536d9a39a/query';
          async function query(sql){
            const r=await fetch(root,{method:'POST',headers:{
              Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
              'Content-Type':'application/json'},body:JSON.stringify({sql})});
            const j=await r.json();
            if(!r.ok||!j.success||!j.result?.[0]?.success)
              throw Error('Post-migration D1 query failed');
            return j.result[0].results;
          }
          const [schema]=await query("SELECT "+
            "(SELECT COUNT(*) FROM d1_migrations) AS migrations,"+
            "(SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1) AS latest,"+
            "(SELECT sql FROM sqlite_master WHERE type='table' AND name='sharika_special_ids') AS table_sql,"+
            "(SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN "+
            "('sharika_special_no_public_insert','sharika_special_no_public_update',"+
            "'sharika_user_no_reserved_special')) AS guards");
          if(schema.migrations!==42||schema.latest!=='0042_special_id_one_to_ten.sql'||
             !schema.table_sql?.includes('BETWEEN 1 AND 10')||schema.guards!==3)
            throw Error('Special ID 1–10 schema or collision guards not applied');
          const aliases=await query('SELECT auth_uid,special_id,frame,expires_at,assigned_by,'+
            'created_at,updated_at FROM sharika_special_ids ORDER BY auth_uid');
          const prior=JSON.parse(readFileSync(
            process.env.RUNNER_TEMP+'/sharika-special-id-aliases-before.json','utf8'));
          if(JSON.stringify(aliases)!==JSON.stringify(prior))
            throw Error('Historical Special ID assignment changed');
          const [after]=await query('SELECT '+
            '(SELECT COUNT(*) FROM sharika_wallet_ledger) AS ledger,'+
            '(SELECT COUNT(*) FROM sharika_coin_seller_transfers) AS transfers,'+
            '(SELECT COUNT(*) FROM sharika_coin_seller_allocations) AS allocations,'+
            '(SELECT COUNT(*) FROM sharika_premium_memberships) AS memberships,'+
            '(SELECT COUNT(*) FROM sharika_premium_daily_claims) AS claims');
          for(const key of ['ledger','transfers','allocations','memberships','claims'])
            if(!Number.isSafeInteger(after?.[key])||after[key]<before[key])
              throw Error('Financial rows changed unexpectedly: '+key);
          console.log('Special ID 1–10 ready; old aliases and financial counts preserved');
          NODE
      - name: Dry run only API and Admin staging Workers
        run: |
          cp admin/index.html cloudflare/src/admin-index.html
          cp admin/connection.js cloudflare/src/admin-connection.txt
          npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.jsonc \
            --outdir "$RUNNER_TEMP/sharika-special-id-api-dryrun"
          npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.admin.jsonc \
            --outdir "$RUNNER_TEMP/sharika-special-id-admin-dryrun"
      - name: Publish isolated staging API and Admin Workers
        run: |
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.jsonc
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.admin.jsonc
      - name: Verify published API and Admin reachability
        run: |
          curl --fail --silent --show-error --retry 4 \
            https://sharika-api-staging.soverixnet.workers.dev/health
          curl --fail --silent --show-error --retry 4 \
            https://sharika-admin-staging.soverixnet.workers.dev/health
          curl --fail --silent --show-error --retry 4 \
            https://sharika-admin-staging.soverixnet.workers.dev/admin/connection.js |
            grep -F 'sid-red-gold' >/dev/null
          echo 'SHARIKA_SPECIAL_ID_1_TO_10_STAGING_OK'
