name: Sharika Startup Fixed + Fruit Royale direct staging APK

on:
  push:
    branches:
      - fix/sharika-startup-login-screen-20261104
    paths:
      - '.github/workflows/sharika-startup-fixed-prerelease.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-tested-fruit-royale:
    name: Publish verified login-recovery + Fruit Royale APK (not ZIP)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require successful integrated Android, emulator, and Cloudflare checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/sharika-startup-login-screen-20261104'
          test "$(gh run view 41743079832 --repo soverixnet-design/Sharika --json conclusion,headSha --jq '.conclusion+" "+.headSha')" = 'success c9a3524752290b66fbed56bafc93834711e99255'
          
          test "$(gh api repos/soverixnet-design/Sharika/actions/artifacts/13281528446 --jq '.workflow_run.head_sha')" = c9a3524752290b66fbed56bafc93834711e99255
          test "$(gh run view 41737879173 --repo soverixnet-design/Sharika --json conclusion --jq '.conclusion')" = success
          
          echo 'SHARIKA_INTEGRATED_LOGIN_FRUIT_APK_EMULATOR_AND_BACKEND_PASSED'

      - name: Download only approved, stable-signed Android staging APK
        uses: actions/download-artifact@v4
        with:
          name: Sharika-Android-Staging-Debug
          run-id: 41743079832
          repository: soverixnet-design/Sharika
          github-token: ${{ github.token }}
          path: integrated-apk

      - name: Verify login startup scripts and Fruit Royale inside Android APK
        run: |
          test -s integrated-apk/app-debug.apk
          unzip -tqq integrated-apk/app-debug.apk
          for asset in index.html game.js styles.css config.js adapter.live.js; do
            unzip -Z1 integrated-apk/app-debug.apk | grep -Fx "assets/fruit-royale/$asset"
          done
          if unzip -Z1 integrated-apk/app-debug.apk | grep -Fx 'assets/original-games/jackpot-fruit.html'; then
            echo "::error::Legacy Jackpot Fruit screen must not be in the replacement APK."
            exit 1
          fi
          unzip -Z1 integrated-apk/app-debug.apk | grep -Fx 'assets/startup-safety.js'
          unzip -Z1 integrated-apk/app-debug.apk | grep -Fx 'assets/sharika_logo.jpg'
          unzip -p integrated-apk/app-debug.apk assets/index.html > "$RUNNER_TEMP/verified-startup-index.html"
          grep -Fq 'id="sharika-startup-safety"' "$RUNNER_TEMP/verified-startup-index.html"
          test "$(grep -o 'http-equiv="Content-Security-Policy"' "$RUNNER_TEMP/verified-startup-index.html" | wc -l)" -eq 1
          unzip -p integrated-apk/app-debug.apk assets/connection.js > "$RUNNER_TEMP/fruit-royale-connection.js"
          node - <<'NODE'
          const fs=require('fs');
          const parent=fs.readFileSync(process.env.RUNNER_TEMP+'/fruit-royale-connection.js','utf8');
          if(!parent.includes("id:'fruit-royale'") ||
             parent.includes("id:'jackpot-fruit'") ||
             !parent.includes('sharika:original-request') ||
             !parent.includes('ensureRoomGamePortal') ||
             !parent.includes("game.id==='fruit-royale'&&enabled.has(game.id)"))
            throw Error('Fruit Royale UI or authenticated room bridge missing');
          console.log('INTEGRATED_LOGIN_RECOVERY_AND_FRUIT_ROYALE_VERIFIED');
          NODE
          cp integrated-apk/app-debug.apk integrated-apk/Sharika-Fruit-Royale-Login-Fixed-Staging.apk
          sha256sum integrated-apk/Sharika-Fruit-Royale-Login-Fixed-Staging.apk

      - name: Publish direct test APK as a clearly marked GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=sharika-fruit-royale-login-startup-fixed-c9a35247
          if gh release view "$TAG" --repo soverixnet-design/Sharika >/dev/null 2>&1; then
            echo "::error::A release with this tag already exists; never overwrite user downloads."
            exit 1
          fi
          gh release create "$TAG" integrated-apk/Sharika-Fruit-Royale-Login-Fixed-Staging.apk \
            --repo soverixnet-design/Sharika \
            --target c9a3524752290b66fbed56bafc93834711e99255 \
            --title "Sharika Fruit Royale + Login Startup Fix — Staging APK" \
            --notes "Critical login startup fix: Android packaging now inserts the startup script and CSP only into the real document head, leaving embedded JavaScript templates intact. Prevents the invalid-token error and 'Sharika could not finish opening' fallback seen in the preceding APK. Includes authenticated Fruit Royale and existing staging Wallet, rooms, voice and user history unchanged. Bundled JavaScript syntax test and Android emulator logcat critical error gate passed. Staging only; please verify real-phone Google sign-in and Fruit game before Production." \
            --prerelease
