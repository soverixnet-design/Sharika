name: Sharika unified public directory staging rollout
on:
  push:
    branches:
      - fix/sharika-unified-public-directory-20261121
    paths:
      - '.github/workflows/sharika-unified-public-directory-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sharika-unified-directory-staging
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check directory and existing game API before publish
        run: |
          set -euo pipefail
          node --check cloudflare/src/index.mjs
          node --check cloudflare/src/unified-public-profiles.mjs
          node --test cloudflare/test/unified-public-profiles.test.mjs cloudflare/test/global-public-ids.test.mjs
          npm --prefix cloudflare run check
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('cloudflare/wrangler.jsonc','utf8'));
          if(c.name!=='sharika-api-staging'||c.d1_databases?.find(x=>x.binding==='DB')?.database_id!=='b2c62252-12a5-4740-90c7-01a536d9a39a'||
             c.d1_databases?.find(x=>x.binding==='SHARIKA_ID_DB')?.database_id!=='b2c62252-12a5-4740-90c7-01a536d9a39a'||
             c.vars?.SHARIKA_ENV!=='staging'||c.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=='false'||
             !c.durable_objects?.bindings?.some(b=>b.name==='VOICE_ROOMS')||
             !c.r2_buckets?.some(b=>b.binding==='MEDIA_BUCKET')||c.keep_vars!==true)
            throw Error('Existing staging environment safety mismatch');
          console.log('EXACT_STAGING_TARGET_VERIFIED');
          NODE
      - name: Dry-run staging Worker bundle
        run: |
          cp admin/index.html cloudflare/src/admin-index.html
          cp admin/connection.js cloudflare/src/admin-connection.txt
          npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir /tmp/unified-directory
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: sharika-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm shared 29-user public directory exists (no writes)
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/b2c62252-12a5-4740-90c7-01a536d9a39a/query';
          const r=await fetch(base,{method:'POST',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql:'SELECT count(*) AS n,count(DISTINCT auth_uid) AS u FROM sharika_global_public_profiles'})});
          const d=await r.json();
          if(!r.ok||!d.success||d.result?.[0]?.results?.[0]?.n<29||
             d.result?.[0]?.results?.[0]?.n!==d.result?.[0]?.results?.[0]?.u)throw Error('Directory backfill/identity safety preflight failed');
          console.log('SHARED_DIRECTORY_VERIFIED_NO_WALLET_WRITES');
          NODE
      - name: Preserve active Admin templates before bundling
        run: |
          cp admin/index.html cloudflare/src/admin-index.html
          cp admin/connection.js cloudflare/src/admin-connection.txt
      - name: Deploy ONLY existing staging API with shared public directory
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.jsonc --keep-vars
      - name: Read-only public API and authorization checks
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://sharika-api-staging.soverixnet.workers.dev/health | grep -q staging
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://sharika-api-staging.soverixnet.workers.dev/api/v1/users/10000001)" = 401
          echo STAGING_DIRECTORY_API_PUBLISHED_SAFE
