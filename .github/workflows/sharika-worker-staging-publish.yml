name: Sharika isolated Worker and Admin staging publish

on:
  push:
    branches:
      - feature/sharika-lucky-gifts-20261030
      - fix/sharika-original-games-20261031
      - fix/sharika-seller-self-recharge-wallet-ui-20261031
      - fix/sharika-profile-save-recovery-20261031
      - fix/sharika-shared-room-themes-20261031
      - feature/sharika-cp-friendship-20261031
      - feature/sharika-weekly-opening-single-user-20261101
      - fix/sharika-live-voice-reliability-20261102
      - fix/sharika-voice-games-owner-prepublish-20261103
      - feature/sharika-family-bd-crystal-ledger-20261103
    paths:
      - '.github/workflows/sharika-worker-staging-publish.yml'
      - 'cloudflare/src/sellers.mjs'
      - 'cloudflare/src/index.mjs'
      - 'cloudflare/src/sfu.mjs'
      - 'cloudflare/src/voice-room.mjs'
      - 'cloudflare/test/worker.test.mjs'
      - 'cloudflare/test/sfu.test.mjs'
      - 'cloudflare/test/voice-ui.test.mjs'
      - 'cloudflare/test/voice-seat-upgrade.test.mjs'
      - 'cloudflare/test/opening.test.mjs'
      - 'cloudflare/test/profile-cosmetics.test.mjs'
      - 'cloudflare/test/sellers.test.mjs'
      - 'android-staging/staging-connection.js'

permissions:
  contents: read

concurrency:
  group: sharika-isolated-staging-worker-publish
  cancel-in-progress: false

jobs:
  deploy-staging-only:
    name: Validate, then update isolated staging Worker
    runs-on: ubuntu-latest
    environment: sharika-staging
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse any non-staging destination
        env:
          EXPECTED_REF: refs/heads/feature/sharika-lucky-gifts-20261030
        run: |
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ] && [ "$GITHUB_REF" != "refs/heads/fix/sharika-original-games-20261031" ] && [ "$GITHUB_REF" != "refs/heads/fix/sharika-seller-self-recharge-wallet-ui-20261031" ] && [ "$GITHUB_REF" != "refs/heads/fix/sharika-profile-save-recovery-20261031" ] && [ "$GITHUB_REF" != "refs/heads/fix/sharika-shared-room-themes-20261031" ] && [ "$GITHUB_REF" != "refs/heads/feature/sharika-cp-friendship-20261031" ] && [ "$GITHUB_REF" != "refs/heads/feature/sharika-weekly-opening-single-user-20261101" ] && [ "$GITHUB_REF" != "refs/heads/fix/sharika-live-voice-reliability-20261102" ] && [ "$GITHUB_REF" != "refs/heads/fix/sharika-voice-games-owner-prepublish-20261103" ] && [ "$GITHUB_REF" != "refs/heads/feature/sharika-family-bd-crystal-ledger-20261103" ]; then
            echo "::error::Refusing unexpected ref $GITHUB_REF"
            exit 1
          fi
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const c=JSON.parse(readFileSync("wrangler.jsonc","utf8"));
            const db=c.d1_databases;
            const b=c.durable_objects?.bindings;
            const required=c.secrets?.required||[];
            if(c.name!=="sharika-api-staging" ||
               c.account_id!=="d81cf7c48fb9b36d468cb0a08720cd74" ||
               c.vars?.SHARIKA_ENV!=="staging" ||
               c.vars?.SHARIKA_LUCKY_GIFTS_ENABLED!=="false" ||
               c.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=="false" ||
               c.keep_vars!==true ||
               db?.length!==1 || db[0].binding!=="DB" ||
               db[0].database_name!=="sharika-staging" ||
               db[0].database_id!=="b2c62252-12a5-4740-90c7-01a536d9a39a" ||
               b?.length!==1 || b[0].name!=="VOICE_ROOMS" ||
               b[0].class_name!=="SharikaVoiceRoom" ||
               !required.includes("REALTIME_SFU_APP_ID") ||
               !required.includes("REALTIME_SFU_APP_SECRET"))
              throw new Error("Unsafe Worker environment or missing voice-secret protections");
            console.log("Verified isolated staging Worker and existing bindings");
          '
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Staging deploy requires an existing CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
      - name: Run backend tests
        run: npm run check
      - name: Verify staging D1 has exchange settings before publish
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT diamonds_per_unit,coins_per_unit,revision FROM sharika_exchange_rate WHERE id=1"
      - name: Verify only the approved cosmetic shop schema exists
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS seeded_items FROM sharika_cosmetics_catalog"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS owned_items FROM sharika_cosmetic_inventory"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS equipped_items FROM sharika_cosmetic_equipped"
      - name: Verify isolated staging daily-task schema before publish
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT follow_coins,gift_coins FROM sharika_daily_task_config WHERE key='standard'"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS task_claims FROM sharika_daily_task_claims"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS task_config_audit FROM sharika_daily_task_config_audit"
      - name: Verify isolated staging event rewards schema before publish
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS events FROM sharika_events"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS awards FROM sharika_event_awards"
      - name: Verify isolated staging opening screen schema
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT enabled,mode,duration_seconds FROM sharika_opening_settings WHERE id=1"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS cursors FROM sharika_opening_cursors"
      # Only the approved additive game-catalog table is allowed on this
      # integration ref. No user, wallet, game history, or existing table is reset.
      - name: Apply only approved game catalog table to staging D1
        if: github.ref == 'refs/heads/fix/sharika-voice-games-owner-prepublish-20261103'
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --file migrations/0046_admin_game_catalog.sql
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT id,enabled FROM sharika_game_catalog ORDER BY id"
      # Versioned placements, distinct from user-owned cosmetics. Additive only.
      - name: Apply safe profile layout table to staging D1
        if: github.ref == 'refs/heads/fix/sharika-voice-games-owner-prepublish-20261103'
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --file migrations/0047_admin_profile_layouts.sql
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS templates FROM sharika_profile_layouts"
      # No migration is executed in this workflow: 0048 was applied and
      # verified independently, with a D1 Time Travel recovery bookmark.
      - name: Verify Family schema and preserve existing voice/game source
        if: github.ref == 'refs/heads/feature/sharika-family-bd-crystal-ledger-20261103'
        run: |
          test "$(git hash-object src/voice-worker.mjs)" = 78ee1e9c17416945f8b3bca9863e7078f3615a5f
          test "$(git hash-object src/sfu.mjs)" = 7aeb1b9339bdc97f6cdd91fcf08d975020309378
          test "$(git hash-object src/voice-room.mjs)" = 3fb63373933be75d323152b998fe42bd8ceed6ac
          test "$(git hash-object src/games.mjs)" = 0902ceded318e7ddd7575295557a0af83b884e43
          test "$(git hash-object src/profile-layout.mjs)" = 55cb1785d2dfe2604c5ae1e88997728d0cde509c
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT key,active,owner_bps,bd_bps,conversion_enabled FROM sharika_family_policy WHERE key='standard'"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS ledger_rows FROM sharika_family_crystal_ledger"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS grants FROM sharika_family_grants"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS transfers FROM sharika_family_crystal_transfers"
          echo 'SHARIKA_FAMILY_SCHEMA_AND_EXISTING_VOICE_GAME_SOURCE_VERIFIED'
      - name: Bundle and inspect without publishing
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --outdir /tmp/sharika-staging-worker-bundle
      - name: Deploy only the existing staging Worker
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify separate staging admin Worker destination
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const c=JSON.parse(readFileSync("wrangler.admin.jsonc","utf8"));
            if(c.name!=="sharika-admin-staging" ||
               c.account_id!=="d81cf7c48fb9b36d468cb0a08720cd74" ||
               c.vars?.SHARIKA_ENV!=="staging" ||
               c.services?.length!==1 ||
               c.services[0].binding!=="SHARIKA_API" ||
               c.services[0].service!=="sharika-api-staging") {
              throw new Error("Unexpected admin Worker destination");
            }
          '
      - name: Bundle original admin design and authenticated connector
        run: |
          cp ../admin/index.html src/admin-index.html
          cp ../admin/connection.js src/admin-connection.txt
          node --check ../admin/connection.js
          npx --yes wrangler@4 deploy --dry-run --config wrangler.admin.jsonc --outdir /tmp/sharika-staging-admin-bundle
      - name: Publish separate staging admin Worker
        if: github.ref != 'refs/heads/fix/sharika-live-voice-reliability-20261102'
        run: npx --yes wrangler@4 deploy --config wrangler.admin.jsonc
