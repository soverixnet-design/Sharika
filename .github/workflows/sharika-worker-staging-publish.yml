name: Sharika staged Worker publish (no database migrations)

on:
  push:
    branches:
      - feature/sharika-lucky-gifts-20261030
      - fix/sharika-original-games-20261031
    paths:
      - '.github/workflows/sharika-worker-staging-publish.yml'

permissions:
  contents: read

concurrency:
  group: sharika-isolated-staging-worker-publish
  cancel-in-progress: false

jobs:
  deploy-staging-only:
    name: Validate, then update isolated staging Worker
    runs-on: ubuntu-latest
    environment: sharika-staging
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: d81cf7c48fb9b36d468cb0a08720cd74
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse any non-staging destination
        env:
          EXPECTED_REF: refs/heads/feature/sharika-lucky-gifts-20261030
        run: |
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ] && [ "$GITHUB_REF" != "refs/heads/fix/sharika-original-games-20261031" ]; then
            echo "::error::Refusing unexpected ref $GITHUB_REF"
            exit 1
          fi
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const c=JSON.parse(readFileSync("wrangler.jsonc","utf8"));
            const db=c.d1_databases;
            const b=c.durable_objects?.bindings;
            const required=c.secrets?.required||[];
            if(c.name!=="sharika-api-staging" ||
               c.account_id!=="d81cf7c48fb9b36d468cb0a08720cd74" ||
               c.vars?.SHARIKA_ENV!=="staging" ||
               c.vars?.SHARIKA_LUCKY_GIFTS_ENABLED!=="false" ||
               c.vars?.SHARIKA_COINS_CASH_REDEEMABLE!=="false" ||
               c.keep_vars!==true ||
               db?.length!==1 || db[0].binding!=="DB" ||
               db[0].database_name!=="sharika-staging" ||
               db[0].database_id!=="b2c62252-12a5-4740-90c7-01a536d9a39a" ||
               b?.length!==1 || b[0].name!=="VOICE_ROOMS" ||
               b[0].class_name!=="SharikaVoiceRoom" ||
               !required.includes("REALTIME_SFU_APP_ID") ||
               !required.includes("REALTIME_SFU_APP_SECRET"))
              throw new Error("Unsafe Worker environment or missing voice-secret protections");
            console.log("Verified isolated staging Worker and existing bindings");
          '
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Staging deploy requires an existing CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
      - name: Run backend tests
        run: npm run check
      - name: Verify staging D1 has exchange settings before publish
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT diamonds_per_unit,coins_per_unit,revision FROM sharika_exchange_rate WHERE id=1"
      - name: Verify only the approved cosmetic shop schema exists
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS seeded_items FROM sharika_cosmetics_catalog"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS owned_items FROM sharika_cosmetic_inventory"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS equipped_items FROM sharika_cosmetic_equipped"
      - name: Verify isolated staging daily-task schema before publish
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT follow_coins,gift_coins FROM sharika_daily_task_config WHERE key='standard'"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS task_claims FROM sharika_daily_task_claims"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS task_config_audit FROM sharika_daily_task_config_audit"
      - name: Verify isolated staging event rewards schema before publish
        run: |
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS events FROM sharika_events"
          npx --yes wrangler@4 d1 execute sharika-staging --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS awards FROM sharika_event_awards"
      - name: Bundle and inspect without publishing
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --outdir /tmp/sharika-staging-worker-bundle
      - name: Deploy only the existing staging Worker (never run migrations)
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify separate staging admin Worker destination
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const c=JSON.parse(readFileSync("wrangler.admin.jsonc","utf8"));
            if(c.name!=="sharika-admin-staging" ||
               c.account_id!=="d81cf7c48fb9b36d468cb0a08720cd74" ||
               c.vars?.SHARIKA_ENV!=="staging" ||
               c.services?.length!==1 ||
               c.services[0].binding!=="SHARIKA_API" ||
               c.services[0].service!=="sharika-api-staging") {
              throw new Error("Unexpected admin Worker destination");
            }
          '
      - name: Bundle original admin design and authenticated connector
        run: |
          cp ../admin/index.html src/admin-index.html
          cp ../admin/connection.js src/admin-connection.txt
          node --check ../admin/connection.js
          npx --yes wrangler@4 deploy --dry-run --config wrangler.admin.jsonc --outdir /tmp/sharika-staging-admin-bundle
      - name: Publish separate staging admin Worker
        run: npx --yes wrangler@4 deploy --config wrangler.admin.jsonc
