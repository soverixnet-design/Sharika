name: SuperAce Owner Spec v1 — isolated staging verification
on:
  push:
    branches: [feature/sharika-superace-spec-v1-20261118]
    paths:
      - 'cloudflare/src/royal-ace.mjs'
      - 'cloudflare/src/superace-spec-v1.mjs'
      - 'cloudflare/src/index.mjs'
      - 'cloudflare/migrations/0100_superace_owner_spec_v1.sql'
      - 'cloudflare/test/royal-ace.test.mjs'
      - 'cloudflare/test/superace-spec-v1.test.mjs'
      - 'android-staging/app/src/main/assets/original-games/royal-ace-deluxe.html'
      - 'hosted-game-center/web/app.js'
      - 'hosted-game-center/web/practice.js'
      - '.github/workflows/superace-owner-spec-v1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: superace-owner-v1-code-only
  cancel-in-progress: true
jobs:
  spec-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax-check all modified Worker/browser sources
        run: |
          node --check cloudflare/src/superace-spec-v1.mjs
          node --check cloudflare/src/royal-ace.mjs
          node --check cloudflare/src/index.mjs
          node --check hosted-game-center/web/app.js
          node --check hosted-game-center/web/practice.js
      - name: Owner spec and legacy wallet ledger regression
        run: node --test cloudflare/test/superace-spec-v1.test.mjs cloudflare/test/royal-ace.test.mjs
      - name: Validate original game HTML inline scripts
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('android-staging/app/src/main/assets/original-games/royal-ace-deluxe.html').read_text()
          code='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.I|re.S))
          pathlib.Path('/tmp/superace-spec-inline.js').write_text(code)
          assert len(s)>400000
          PY
          node --check /tmp/superace-spec-inline.js
      - name: Build an isolated dry-run of the staging Worker, no deployment
        run: cd cloudflare && npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --outdir /tmp/superace-v1-worker
      - name: Verify no rollout is enabled automatically
        run: |
          test -f cloudflare/migrations/0100_superace_owner_spec_v1.sql
          grep -q 'SET enabled=0' cloudflare/migrations/0100_superace_owner_spec_v1.sql
          ! grep -qE 'wrangler.*(migrations apply|d1 execute.*remote|deploy --config)' .github/workflows/superace-owner-spec-v1-qa.yml
