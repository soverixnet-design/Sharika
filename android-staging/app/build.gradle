plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// GitHub Actions supplies these only from repository secrets.
// Never commit a keystore or password to this public repository.
def stagingKeystorePath = System.getenv('SHARIKA_STAGING_KEYSTORE_PATH')
def stagingKeystorePassword = System.getenv('SHARIKA_STAGING_KEYSTORE_PASSWORD')
def stableStagingSigner = stagingKeystorePath && stagingKeystorePassword

// Production upload signing can be supplied entirely through CI secrets.
// Never store the Play upload key, alias or passwords in this repository.
def playUploadPath = System.getenv('SHARIKA_PLAY_UPLOAD_KEYSTORE_PATH')
def playUploadStorePassword = System.getenv('SHARIKA_PLAY_UPLOAD_STORE_PASSWORD')
def playUploadAlias = System.getenv('SHARIKA_PLAY_UPLOAD_KEY_ALIAS')
def playUploadKeyPassword = System.getenv('SHARIKA_PLAY_UPLOAD_KEY_PASSWORD')
def stablePlayUploadSigner = playUploadPath && playUploadStorePassword &&
    playUploadAlias && playUploadKeyPassword
// Play distribution must point at a separately configured production Worker.
// A staging-backed build is allowed only when CI explicitly requests a test candidate.
def productionApiOrigin = System.getenv('SHARIKA_PLAY_API_ORIGIN')?.trim()
def allowStagingCandidate = System.getenv('SHARIKA_PLAY_STAGING_CANDIDATE') == 'true'
if (productionApiOrigin && !(productionApiOrigin ==~ /^https:\/\/[a-zA-Z0-9.-]+$/)) {
    throw new GradleException('SHARIKA_PLAY_API_ORIGIN must be an HTTPS origin without a path')
}
def chosenPlayOrigin = productionApiOrigin ?: 'https://sharika-api-staging.soverixnet.workers.dev'
// Only the separately deployed, non-redeemable Play backend receives the
// closed-loop presentation. Never alter staging or its financial test screens.
def playVirtualPresentation = productionApiOrigin ==
    'https://sharika-api-play-virtual.soverixnet.workers.dev'
def chosenPlayHost = new java.net.URI(chosenPlayOrigin).getHost()
if (!chosenPlayHost || !(chosenPlayHost ==~ /^[a-zA-Z0-9.-]+$/)) {
    throw new GradleException('SHARIKA_PLAY_API_ORIGIN must contain a valid HTTPS hostname')
}

android {
    namespace 'com.soverixnet.sharika'
    compileSdk 36
    buildFeatures { buildConfig true }

    signingConfigs {
        if (stablePlayUploadSigner) {
            sharikaPlayUpload {
                storeFile file(playUploadPath)
                storePassword playUploadStorePassword
                keyAlias playUploadAlias
                keyPassword playUploadKeyPassword
            }
        }
        if (stableStagingSigner) {
            sharikaStaging {
                storeFile file(stagingKeystorePath)
                storePassword stagingKeystorePassword
                keyAlias 'sharika-staging'
                keyPassword stagingKeystorePassword
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [sharikaInviteHost: 'sharika-api-staging.soverixnet.workers.dev']
            buildConfigField 'boolean', 'SHARIKA_PLAY_BUILD', 'false'
            buildConfigField 'String', 'SHARIKA_API_ORIGIN', '"https://sharika-api-staging.soverixnet.workers.dev"'
            if (stableStagingSigner) {
                signingConfig signingConfigs.sharikaStaging
            }
        }
        // Release-format Android App Bundle; prefer the dedicated Play
        // upload certificate when present. The fallback lets CI produce a
        // verifiable signed candidate without exposing a new private key.
        release {
            manifestPlaceholders = [sharikaInviteHost: chosenPlayHost]
            buildConfigField 'boolean', 'SHARIKA_PLAY_BUILD', 'true'
            buildConfigField 'String', 'SHARIKA_API_ORIGIN', '"' + chosenPlayOrigin + '"'
            minifyEnabled false
            shrinkResources false
            if (stablePlayUploadSigner) {
                signingConfig signingConfigs.sharikaPlayUpload
            } else if (stableStagingSigner) {
                signingConfig signingConfigs.sharikaStaging
            }
        }
    }

    defaultConfig {
        applicationId 'com.soverixnet.sharika'
        minSdk 26
        targetSdk 36
        versionCode 115
        versionName = productionApiOrigin ? '1.0.15' : '1.0.15-staging'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google Play one-time consumable coins; receipts are verified on our Worker.
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    // Google sign-in via Android Credential Manager (official Firebase flow).
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    // Carry a verified Play Store invite across installation into first signup.
    implementation 'com.android.installreferrer:installreferrer:2.2'
}

// Building an upload bundle against staging is an explicit non-publishable
// candidate. Never accidentally ship it as the Play Store production build.
tasks.configureEach { task ->
    if (task.name == 'bundleRelease' || task.name == 'assembleRelease') {
        task.doFirst {
            if (chosenPlayOrigin == 'https://sharika-api-staging.soverixnet.workers.dev' && !allowStagingCandidate)
                throw new GradleException('Production API missing: set SHARIKA_PLAY_API_ORIGIN before Play release')
        }
    }
}

 
// Package Sharika's homepage assets for Android. The staging-specific connection
// adapter replaces only connection.js in the packaged copy.
def sharikaUiAssets = layout.buildDirectory.dir('generated/sharika-ui-assets')
// Package the verified profile CSS inline too, so an upgraded Android WebView
// cannot display a cached older icon atlas, two-tab navbar or large level cards.
// The external stylesheet still ships unchanged for other app surfaces.
def sharikaInlineProfileCss = rootProject.file('../app/reference-profile.css').getText('UTF-8')
tasks.register('prepareSharikaUiAssets', Copy) {
    from(rootProject.file('../app/index.html')) {
        // Package the final Royal CSS before WebView's first paint. Injecting
        // it only from onPageFinished briefly revealed the retired base UI.
        // This filter affects the APK copy, never the owner's web template.
        // Bundle the theme controller before the original connection script.
        filter { String line ->
            line.replaceFirst('^<head>$', '''<head>
<script id="sharika-startup-safety" src="./startup-safety.js"></script>
<meta http-equiv="Content-Security-Policy" content="frame-src 'self' about:; object-src 'none'; base-uri 'none';">''' +
                    (playVirtualPresentation ? '\n<script id="sharika-play-virtual-ui" src="./play-virtual-ui.js"></script>' : ''))
                .replace('<html lang="en">',
                    '<html lang="en" class="royal-premium royal-root">')
                .replace('<link rel="stylesheet" href="./royal-profile.css">',
                    '<link rel="stylesheet" href="./royal-profile.css">\n' +
                    '<link id="sharika-royal-premium-style" rel="stylesheet" href="./royal-premium.css">\n' +
                    '<link id="sharika-agency-style" rel="stylesheet" href="./agency-center.css">\n' +
                    '<link id="sharika-winged-theme-style" rel="stylesheet" href="./royal-winged-theme.css">\n' +
                    '<style id="sharika-royal-splash">' +
                    '#sp{background:linear-gradient(180deg,#230c48bb,#070315ef),url(./royal-winged-bg.jpg) center/cover!important;color:#ffebad!important}' +
                    '#sp>img.l3i{width:160px;height:160px;border:5px solid #eabb70;border-radius:38px;animation:none;box-shadow:0 8px 40px #000b,0 0 32px #e6a34488}' +
                    '#sp>b{font-size:26px!important;text-shadow:0 3px 12px #10031e}' +
                    '</style>')
                .replace('<script src="./connection.js"></script>',
                    // If the verified native adapter fails to load, the old
                    // localStorage/SHA demo login must not become usable.
                    '<script id="sharika-staging-auth-guard">' +
                    'window.API.login=async function(){return {ok:false,msg:"Secure login unavailable. Restart Sharika."};};' +
                    'window.API.signup=window.API.login;' +
                    '</script>' +
                    '<script id="sharika-royal-ui" src="./royal-premium.js"></script>' +
                    '<script src="./connection.js"></script>' +
                    '<script id="sharika-agency-script" src="./agency-center.js"></script>')
                .replaceFirst('^</head>$',
                    '<style id="sharika-main-profile-inline-v101">\n' +
                    sharikaInlineProfileCss + '\n</style>\n</head>')
        }
    }
    // Owner-provided royal profile art; keep the original JPEG and PNG intact.
    from(rootProject.file('../app/main-profile-bg.jpg'))
    from(rootProject.file('../app/main-profile-icons.webp'))
    from(rootProject.file('../app/invite-royal-chest.webp'))
    from(rootProject.file('../app/champagne-home-background.webp'))
    from(rootProject.file('../app/champagne-home-icons.webp'))
    from(rootProject.file('../app/golden-home.css'))
    from(rootProject.file('../app/room-discovery.js'))
    from(rootProject.file('../app/royal-room-ui.js'))
    from(rootProject.file('../app/royal-room-ui.css'))
    from(rootProject.file('../app/reference-room.css'))
    from(rootProject.file('../app/royal-room-background.jpg'))
    from(rootProject.file('../app/royal-room-icons.png'))
    from(rootProject.file('../app/room-chat-message.svg'))
    from(rootProject.file('../app/royal-profile.css'))
    from(rootProject.file('../app/reference-profile.css'))
    from(rootProject.file('../app/royal-profile-background.jpg'))
    from(rootProject.file('../app/profile-collection-atlas.webp'))
    from(rootProject.file('../app/profile-menu-atlas.webp'))
    from(rootProject.file('../app/profile-crown.webp'))
    from(rootProject.file('../app/royal-ranking-v2.css'))
    from(rootProject.file('../app/royal-ranking-podium.webp'))
    from(rootProject.file('startup-safety.js'))
    from(rootProject.file('app/src/main/res/mipmap-nodpi/sharika_logo.jpg'))
    from(rootProject.file('back-navigation.js'))
    from(rootProject.file('royal-premium.js'))
    from(rootProject.file('royal-premium.css'))
    from(rootProject.file('royal-winged-theme.css'))
    from(rootProject.file('royal-winged-bg.jpg'))
    from(rootProject.file('royal-icon-atlas.png'))
    from(rootProject.file('royal-palace.png'))
    // Pre-rendered premium static backgrounds keep WebView scrolling smooth.
    from(rootProject.file('royal-shop-bg.png'))
    from(rootProject.file('royal-backpack-bg.png'))
    from(rootProject.file('royal-market.css'))
    from(rootProject.file('agency-center.css'))
    from(rootProject.file('agency-center.js'))
    if (playVirtualPresentation) from(rootProject.file('play-virtual-ui.js'))
    from(rootProject.file('staging-connection.js')) {
        rename { 'connection.js' }
    }
    into(sharikaUiAssets)
}
android.sourceSets.main.assets.srcDir(sharikaUiAssets)
tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareSharikaUiAssets'))
}

// The source adapter and debug APK deliberately remain staging-specific.
// Only a release built with an explicitly configured production API receives
// an overlaid connection.js whose URL and strict media-host validators match
// that production origin. Do not weaken validators to accept both hosts.
if (productionApiOrigin) {
    def playConnectionAssets = layout.buildDirectory.dir('generated/sharika-play-connection-assets')
    tasks.register('prepareSharikaPlayConnection', Copy) {
        inputs.property('playApiOrigin', chosenPlayOrigin)
        from(rootProject.file('staging-connection.js')) {
            rename { 'connection.js' }
            filter { String line ->
                line.replace('https://sharika-api-staging.soverixnet.workers.dev', chosenPlayOrigin)
                    .replace('sharika-api-staging\\.soverixnet\\.workers\\.dev',
                        chosenPlayHost.replace('.', '\\.'))
            }
        }
        into(playConnectionAssets)
    }
    android.sourceSets.release.assets.srcDir(playConnectionAssets)
    tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
        dependsOn(tasks.named('prepareSharikaPlayConnection'))
    }
}
