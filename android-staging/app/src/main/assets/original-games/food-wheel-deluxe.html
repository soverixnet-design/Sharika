<style>
:root{--bg:#1c58d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#0b2a6b;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:2352px;transform-origin:0 0;overflow:hidden;background:linear-gradient(#1d56cf 0,#3b8ae6 28%,#9fd0f7 52%,#e4f2ff 62%)}
#stage img{position:absolute;display:block}
.a{position:absolute}.btn{cursor:pointer}
.ground{left:0;top:1340px;width:1080px;height:1012px;background:linear-gradient(#f08545,#f7ad69 40%,#f9b878);border-top:8px solid #f6a15f}
.slot{background:#d9672f;border-radius:26px;box-shadow:inset 0 4px 10px #0004}
.slot.sel{background:#8b2e12;box-shadow:0 0 0 7px #ffe45c,0 0 22px 8px #6cf}
.panel{left:40px;top:1615px;width:1000px;height:250px;border-radius:34px;background:linear-gradient(#f98c45,#f2753b);box-shadow:inset 0 0 0 5px #ffb26b}
.t{position:absolute;text-align:center;color:#fff;font-weight:900;text-shadow:-3px -3px 0 var(--s,#b13a00),3px -3px 0 var(--s,#b13a00),-3px 3px 0 var(--s,#b13a00),3px 3px 0 var(--s,#b13a00),0 5px 0 var(--s,#b13a00);white-space:nowrap}
.food{transition:filter .15s,transform .15s}
.food.dim{filter:brightness(.42) saturate(.7)}
.food.hl{filter:brightness(1.12) drop-shadow(0 0 22px #ffe45c);transform:scale(1.06)}
.food.win{filter:drop-shadow(0 0 34px #fff27a);transform:scale(1.12);animation:p .5s infinite alternate}
@keyframes p{to{transform:scale(1.18)}}
.inner{position:absolute;inset:7%;border-radius:50%;overflow:hidden}
.lab{position:absolute;left:0;right:0;top:49%;bottom:0;background:linear-gradient(#ffd51f,#ffb421 14%,#ff7b2f 42%,#ff5a30);border-radius:50% 50% 0 0/14px 14px 0 0}
.modal{position:absolute;inset:0;background:#000a;display:none;z-index:9}
.box{position:absolute;left:90px;width:900px;border-radius:44px;padding:40px;color:#fff}
.hp{background:linear-gradient(#ffa63a,#f68a1f);top:700px;box-shadow:inset 0 0 0 8px #ffd070;font-size:46px;line-height:1.35;font-weight:800}
.x{position:absolute;right:-6px;top:-6px;width:96px;height:96px;border-radius:50%;background:#ec6a1b;border:8px solid #ffd070;font-size:60px;text-align:center;line-height:78px;cursor:pointer}
.res{background:linear-gradient(#6f7ea8,#4c5679);top:760px;height:880px;text-align:center;box-shadow:0 0 0 6px #9fb0e0}
.ban{position:absolute;left:150px;top:-70px;width:600px;height:130px;background:#7f98d6;border-radius:30px 30px 60px 60px;font-size:82px;line-height:120px;font-weight:900;color:#fff}
#toast{position:absolute;left:0;right:0;top:1000px;text-align:center;font-size:54px;color:#fff;font-weight:800;z-index:12;text-shadow:0 3px 8px #000;pointer-events:none}

function im(n,cx,cy,w,extra=''){const a=A[n],h=w*a[2]/a[1];const e=document.createElement('img');e.src=a[0];e.style.cssText=`left:${cx-w/2}px;top:${cy-h/2}px;width:${w}px;${extra}`;L.appendChild(e);return e}

 // bottom
 const r=im('repeat',925,1950,225);btn(r,repeat);T.rep=tx('0',925,1985,50,'#fff',150);T.rep.style.setProperty('--s','#6a1b8a');T.rep.style.pointerEvents='none';

 // Only verified player avatars in the compact ranking preview.
 const preview=document.createElement('div');
 preview.className='a btn';

 preview.style.cssText='left:72px;top:1886px;width:704px;height:152px;display:flex;'+

 T.rankAvatars=[];
 for(let i=0;i<3;i++){

  cell.append(avatar,placeholder);preview.appendChild(cell);
  T.rankAvatars.push({avatar,placeholder});
 }
 preview.addEventListener('click',rank);
 preview.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();rank()}});
 L.appendChild(preview);

 // top bar
 const bk=im('back',68,188,86),hp=im('help',184,188,86),rk=im('rank',299,188,86),mu=im('music',411,188,86);
 btn(bk,()=>FoodWheel.onBack());btn(hp,help);btn(rk,rank);btn(mu,()=>{sound=!sound;mu.style.opacity=sound?1:.45});
 im('coin',799,190,420);T.coins=tx('',800,194,50,'#ffe600',300);T.coins.style.setProperty('--s','#b01800');
 const co=document.createElement('div');
 im('rid',105,299,210);T.rid=tx('',105,324,42,'#ffe600',160);T.rid.style.setProperty('--s','#3a1a8c');
 im('ping',88,372,165);T.ping=tx('',112,372,30,'#36e04a',100);T.ping.style.setProperty('--s','transparent');T.ping.style.textShadow='none';
 const rc=im('rec',985,302,190);btn(rc,record);const pl=im('players',1018,404,86);btn(pl,players);
}
const snd=(f,d=.08)=>{if(!sound)return;try{const a=window.AC||(window.AC=new(window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}};
function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1400)}
// Only the native authenticated parent can submit a wager; no optimistic wallet debit.
const GAME='food-deluxe',pending=new Map();let seq=0,ready=false,
  currentState=null,serverDelta=0,animating=false,animatedRound=-1,refreshing=false;
const escapeHtml=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.addEventListener('message',e=>{
 if(e.source!==parent)return;
 const d=e.data;
 if(!d||d.type!=='sharika:original-response'||!Number.isInteger(d.id))return;
 const entry=pending.get(d.id);if(!entry)return;
 clearTimeout(entry.timer);pending.delete(d.id);
 if(d.ok)entry.resolve(d.value);else entry.reject(Error(String(d.error||'Server unavailable')));
});
function call(action,method='GET',body=null,query=null){
 const id=++seq;
 return new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>{pending.delete(id);reject(Error('Server timeout'))},12000);
  pending.set(id,{resolve,reject,timer});
  parent.postMessage({type:'sharika:original-request',id,game:GAME,action,method,body,query},'*');
 });
}
let queuedFoodTaps=0;
window.installStakePicker({balance:()=>coins, selected:()=>CH[chip], select:amount=>{CH[5]=amount;chip=5;chips.forEach(c=>c.classList.remove("sel"));}});
const enqueueFood=createRoundTapQueue({
 send:body=>call('bet','POST',body),
 openRound:n=>currentState&&n===round&&Date.now()+serverDelta<currentState.round.bet_closes_ms,
 onStatus:n=>{queuedFoodTaps=n;draw();}
});
async function queueFood(stakes){
 if(!ready||phase!=='bet')return toast('Betting is closed');
 const amount=stakes.reduce((total,n)=>total+n,0);
 if(amount<=0)return;
 const tappedRound=round;
 try{
  const receipt=await enqueueFood(round,stakes.slice(),amount,coins);
  coins=receipt.coins;
  if(tappedRound===round)await refresh();
  snd(700);draw();
 }catch(error){toast(error.message);}
}
function bet(i){
 const keys=Array.isArray(i)?i:[i],values=Array(8).fill(0);
 keys.forEach(k=>{values[k]=CH[chip]});
 return queueFood(values);
}
function repeat(){
 if(!last.some(n=>n))return toast('No previous round bet');
 return queueFood(last.slice());
}
function draw(){
 T.coins.textContent=coins.toLocaleString('en');T.rid.textContent=round;T.rep.textContent=fmt(last.reduce((a,b)=>a+b,0));
 amts.forEach((a,i)=>a.textContent=bets[i]?fmt(bets[i]):'');
 T.ph.textContent=phase==='bet'?'Select Time':phase==='spin'?'Drawing...':phase==='result'?'Result Time':'Connecting';
 T.sec.textContent=phase==='spin'?'':left+'s';
 T.ping.textContent=queuedFoodTaps?queuedFoodTaps+' PENDING':ready?'LIVE':'OFFLINE';
 renderFoodWinner();
 T.hist.forEach((e,k)=>{const h=hist[k];if(h===undefined){e.style.display='none';return}const a=A['i'+h],w=k?92:100;e.src=a[0];e.style.display='block';e.style.width=w+'px';e.style.left=(138+k*134-w/2)+'px';e.style.top=(1782-w*a[2]/a[1]/2)+'px'});
 T.new.style.display=hist.length?'block':'none';
 if(!animating)foods.forEach((f,i)=>{f.className='food btn'+(phase==='bet'?'':(win>=0?(i===win?' win':' dim'):''))});
}
function modal(h){const m=$('m');m.innerHTML=h;m.style.display='block';m.onclick=e=>{if(e.target===m||e.target.classList.contains('x'))m.style.display='none'}}
const icons=a=>a.map(i=>`<img src="${A['i'+i][0]}" style="position:static;display:inline;width:90px;margin:6px">`).join('');
function help(){modal(`<div class="box hp"><div class="x">×</div><div class="ban" style="top:-70px;background:#ffc04a;color:#fff">HOW TO PLAY</div><br><br>1. Select a coin chip: ${CH.map(fmt).join(' · ')}<br>2. Tap any food to place your bet<br>3. The wheel spins when the ${CFG.betSeconds}-second betting window closes<br>4. Each food has its own payout multiplier<br>5. If your selected food wins, coins are credited using that multiplier<br><div style="text-align:center">${icons([6,5,4,0,1,2,3,7])}</div></div>`)}
async function record(){
 try{
  const result=await call('history');
  const outcomes=(result.rounds||[]).slice(0,12);
  modal('<div class="box hp" style="text-align:center"><div class="x">×</div>'+
   '<div class="ban">Record</div><br><br>'+
   (outcomes.length?outcomes.map(i=>'<span style="display:inline-flex;flex-direction:column;align-items:center">'+
    icons([i])+'<span style="font-size:28px">'+NAMES[i]+'</span></span>').join(''):'No verified result yet')+
   '</div>');
 }catch(e){toast(e.message)}
}
async function rank(){
 try{
  const result=await call('rankings','GET',null,{period:'daily',metric:'totalWin'});
  const ranks=(result.rankings||[]).slice(0,10);
  const rows=ranks.map(w=>{
   const pic=safeWinnerPhoto(w.pic||w.avatar);
   const avatar=pic?'<img alt="" src="'+escapeHtml(pic)+'" style="width:76px;height:76px;object-fit:cover;border-radius:50%;border:4px solid #ffda74"/>':
    '<span style="width:76px;height:76px;border-radius:50%;border:4px solid #ffda74;display:grid;place-items:center">👤</span>';
   return '<div style="display:flex;align-items:center;gap:18px;margin:15px 2px;padding:11px;border-bottom:2px solid #e5a75e">'+
    avatar+'<div style="min-width:0;text-align:left"><b style="font-size:35px">'+escapeHtml(w.name||'Player')+'</b>'+
    '<div style="font-size:26px">ID '+escapeHtml(w.public_id||'—')+'</div>'+
    '<div style="font-size:31px;color:#ffe67d">'+Number(w.total_win||0).toLocaleString('en-US')+' coins</div></div></div>';
  }).join('');
  modal('<div class="box res" style="height:1050px;overflow:auto">'+
   '<div class="x">×</div><div class="ban">Daily Ranking</div><br><br>'+
   (rows||'<p style="font-size:40px">No verified winners yet</p>')+'</div>');
 }catch(e){toast(e.message)}
}
function safeWinnerPhoto(value){
 const pic=String(value||'');
 if(!/^https:\/\/(?:sharika-api-staging\.soverixnet\.workers\.dev|lh3\.googleusercontent\.com|firebasestorage\.googleapis\.com|storage\.googleapis\.com)\//.test(pic))return '';
 return pic;
}
function renderFoodWinner(){
 if(!T.rankAvatars)return;
 const latest=currentState?.result||currentState?.previous_result;
 const winners=Array.isArray(latest?.top_winners)?latest.top_winners:[];
 T.rankAvatars.forEach((slot,i)=>{
  const winner=winners[i],pic=safeWinnerPhoto(winner?.pic||winner?.avatar);
  if(pic){
   if(slot.avatar.getAttribute('src')!==pic)slot.avatar.src=pic;
   slot.avatar.style.display='block';slot.placeholder.style.display='none';
  }else{
   slot.avatar.removeAttribute('src');slot.avatar.style.display='none';
   slot.placeholder.style.display='grid';
  }
 });
}
function players(){
 const winners=currentState?.previous_result?.top_winners||[];
 modal('<div class="box res" style="height:690px"><div class="x">×</div>'+
  '<div class="ban">Top Winners</div><br><br>'+
  (winners.length?winners.map((w,i)=>{
    const pic=safeWinnerPhoto(w.pic||w.avatar);
    return '<p style="font-size:35px;display:flex;align-items:center;gap:12px">'+
      (pic?'<img alt="" src="'+escapeHtml(pic)+'" style="width:55px;height:55px;object-fit:cover;border-radius:50%"/>':'')+
      (i+1)+'. '+escapeHtml(w.name||'Player')+' · '+fmt(Number(w.total_win)||0)+'</p>';
   }).join(''):
   '<p style="font-size:40px">No confirmed winners this round</p>')+'</div>');
}
function phaseAt(r,now){return now<r.bet_closes_ms?'bet':now<r.result_ms?'spin':
 now<r.closes_ms?'result':'loading'}
function leftAt(r,now,ph){const target=ph==='bet'?r.bet_closes_ms:
 ph==='spin'?r.result_ms:r.closes_ms;return Math.max(0,Math.ceil((target-now)/1000))}
async function refresh(){
 if(refreshing)return;
 refreshing=true;
 try{
  const state=await call('state');
  if(!state||!state.round||state.virtual_coins_only!==true)throw Error('Invalid server state');
  if(currentState&&round!==state.round.round_no){
   animating=false;animatedRound=-1;win=-1;
  }
  currentState=state;serverDelta=state.server_time-Date.now();
  round=state.round.round_no;
  coins=Number(state.balance);
  bets=state.my_stakes||Array(8).fill(0);
  last=state.last_stakes||Array(8).fill(0);
  hist=state.history||[];daily=Number(state.today_wagered)||0;
  ready=Number.isSafeInteger(coins)&&coins>=0;
  if(!ready)throw Error('Invalid verified wallet');
  const now=Date.now()+serverDelta,nextPhase=phaseAt(state.round,now);
  left=leftAt(state.round,now,nextPhase);
  if(nextPhase!=='result'||!state.result){
   phase=nextPhase;win=-1;draw();
  }else if(animatedRound!==round&&!animating){
   animatedRound=round;
   phase='spin';win=-1;draw();
   spin(state.result.index,Number(state.result.my_payout)||0);
  }else if(!animating){
   phase='result';win=state.result.index;draw();
  }
 }catch(e){
  ready=false;
  // Keep the last verified wheel visible during poor connectivity; never fake a bet.
  if(!currentState){phase='loading';draw();}
  else T.ping.textContent='RECONNECTING';
  toast('Connection slow. Waiting for verified data.');
 }finally{refreshing=false}
}
// Wheel highlight always follows the server-confirmed index; only animation
// pacing is local. A displayed win cannot credit or change a wallet.
function spin(resultIndex,serverPayout){
 if(!Number.isInteger(resultIndex)||resultIndex<0||resultIndex>7)return;
 animating=true;
 const spinRound=round,goal=RING.indexOf(resultIndex),start=round%8,
  steps=16+((goal-start+8)%8);
 let k=0;
 const walk=()=>{
  if(!currentState||round!==spinRound||currentState.round.round_no!==spinRound){animating=false;return}
  foods.forEach(f=>f.className='food btn dim');
  const idx=RING[(start+k)%8];
  foods[idx].className='food btn hl';
  snd(400+k*8,.04);
  if(k>=steps){setTimeout(()=>finish(resultIndex,serverPayout,spinRound),350);return}
  k++;setTimeout(walk,40+Math.pow(k/steps,3)*155)
 };
 walk();
}
function finish(index,payout,spinRound){
 if(round!==spinRound||currentState?.round.round_no!==spinRound){animating=false;return}
 animating=false;phase='result';win=index;
 // Never cover the wheel with another large result/winner popup.
 // The hosted Game Center will display the single top ticker instead.
 draw();snd(payout?1000:300,.25);

}
function tick(){
 const r=currentState?.round;if(!r)return;
 const now=Date.now()+serverDelta,ph=phaseAt(r,now);
 left=leftAt(r,now,ph);
 if(!animating&&ph!=='result'&&phase!==ph){phase=ph;win=-1;}
 draw();
}
function fit(){const s=Math.min(innerWidth/1080,innerHeight/2352),st=$('stage');st.style.transform=`scale(${s})`;st.style.left=(innerWidth-1080*s)/2+'px';st.style.top=(innerHeight-2352*s)/2+'px'}
addEventListener('resize',fit);fit();build();draw();refresh();setInterval(tick,1000);
let lastSmartRefresh=0;
setInterval(()=>{
 if(document.visibilityState==='hidden')return;
 const weak=/2g|slow/i.test(navigator.connection?.effectiveType||'');
 const minGap=weak?6000:2500;
 if(Date.now()-lastSmartRefresh<minGap)return;
 lastSmartRefresh=Date.now();refresh();
},2500);
