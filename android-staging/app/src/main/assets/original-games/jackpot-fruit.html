<script>
/* Same-origin native parent owns ALL identity and wallet operations.
 * The iframe is never given tokens, credentials, database handles, or
 * permission to credit local coins. Its only mutation is an authenticated bet. */
const GameBridge=(()=>{
  const game=document.documentElement.getAttribute('data-original-game');
  const pending=new Map();let seq=0;
  window.addEventListener('message',e=>{
    if(e.source!==window.parent||!e.data||e.data.type!=='sharika:original-response')return;
    const p=pending.get(e.data.id);if(!p)return;
    clearTimeout(p.timeout);pending.delete(e.data.id);
    if(e.data.ok)p.resolve(e.data.value||{});
    else p.reject(Error(e.data.error||'server_unavailable'));
  });
  function call(action,method='GET',body=null){
    return new Promise((resolve,reject)=>{
      if(window.parent===window){reject(Error('Open this game from Sharika app'));return;}
      const id=++seq;
      const timeout=setTimeout(()=>{pending.delete(id);reject(Error('server_timeout'));},18000);
      pending.set(id,{resolve,reject,timeout});
      window.parent.postMessage({type:'sharika:original-request',id,game,action,method,body},'*');
    });
  }
  let state=null,prev=-1,busy=false;
  let refreshHandler=()=>{},errorHandler=()=>{};
  const clock=()=>state?Date.now()+(state.server_time-Date.nowAtReceive)-0:Date.now();
  // Timestamp offset remains stable across local time ticks.
  let receivedAt=Date.now();
  function now(){return state?Date.now()+(state.server_time-receivedAt):Date.now();}
  async function refresh(){
    if(busy)return;
    busy=true;
    try{
      const data=await call('state');
      const previousRound=state?.previous_result?.round_no;
      state=data;receivedAt=Date.now();
      refreshHandler(data,now(),previousRound!==data.previous_result?.round_no);
    }catch(e){errorHandler(e.message||'Unable to reach server');}
    finally{busy=false;}
  }
  function onRefresh(fn){refreshHandler=fn;}
  function onError(fn){errorHandler=fn;}
  async function bet(pick,amount){
    if(!state||now()>=state.round.bet_closes_ms)throw Error('Betting closed');
    const request_id='og:'+game+':'+Date.now().toString(36)+':'+Math.random().toString(36).slice(2,13);
    const result=await call('bet','POST',{round_no:state.round.round_no,pick,amount,request_id});
    await refresh();return result;
  }
  function start(){refresh();setInterval(refresh,1550);}
  function get(){return state;}
  return {call,refresh,bet,onRefresh,onError,now,start,get};
})();


const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('en-US');
const F=[['🍋',5],['🍇',5],['🥝',5],['🍒',40],0,['🍑',5],['🍉',20],['🍌',10],['🍓',10]];
const RING=[0,1,2,5,8,7,6,3],CH=[1000,10000,100000,1000000,10000000];
const chipLabel=c=>c>=1000000?(c/1000000)+'M':c>=1000?(c/1000)+'K':String(c);
let chip=CH[0],bets=Array(9).fill(0),busy=false,muted=false,latestSeen=null;
const tiles=F.map((f,i)=>{
 const d=document.createElement('button');d.className='t'+(i===3||i===6||i===7||i===8?' p':'');
 if(f){d.innerHTML='<b>'+f[0]+'</b><i>'+f[1]+' times</i><u></u>';d.onclick=()=>place(i)}
 else {d.id='tm';d.className='';d.disabled=true}
 $('#g').appendChild(d);return d;
});
$('#ch').innerHTML=CH.map((c,i)=>'<div class="cw"><button class="'+(i?'':'on')+'" data-c="'+c+'">'+['🔵','🟡','🟠','🟣','🔴'][i]+' '+chipLabel(c)+'</button><i class="am"></i></div>').join('');
document.querySelectorAll('#ch button').forEach(b=>b.onclick=()=>{chip=Number(b.dataset.c);document.querySelectorAll('#ch button').forEach(v=>v.classList.toggle('on',b===v))});
function msg(t){$('#msg').textContent=t;clearTimeout(msg.id);msg.id=setTimeout(()=>$('#msg').textContent='',3000)}
async function place(tileIndex){
 if(busy)return;
 const d=GameBridge.get();if(!d||GameBridge.now()>=d.round.bet_closes_ms){msg('Betting closed');return;}
 busy=true;
 try{await GameBridge.bet(RING.indexOf(tileIndex),chip)}
 catch(e){msg(e.message||'Bet failed')}
 finally{busy=false}
}
function redraw(d){
 bets.fill(0);for(const b of d.my_bets||[])if(b.round_no===d.round.round_no)bets[RING[b.pick_index]]+=b.amount;
 $('#rd').textContent=d.round.round_no;$('#bal').textContent=fmt(d.coins);$('#jp').textContent=fmt(d.jackpot_pool||0);
 $('#pg').textContent='🔒 Secure server';
 $('#tm').textContent=Math.max(0,Math.ceil((d.round.bet_closes_ms-GameBridge.now())/1000))||'--';
 tiles.forEach((v,i)=>{v.classList.remove('hl');const u=v.querySelector('u');if(u)u.textContent=bets[i]?fmt(bets[i]):''});
 const prev=d.previous_result;
 if(prev){
 const pos=prev.positions||[prev.index];pos.forEach(i=>tiles[RING[i]]?.classList.add('hl'));
 $('#rs').innerHTML='<b>Result</b>'+pos.map(i=>'<span>'+F[RING[i]][0]+'</span>').join('');
 document.querySelectorAll('#rl div').forEach(x=>x.classList.remove('h'));
 if(prev.bonus){
 const r=[...document.querySelectorAll('#rl div')];
 if(prev.bonus==='+1')r[0]?.classList.add('h');
 else if(prev.bonus==='+2')r[1]?.classList.add('h');
 else {r[2].textContent=prev.bonus==='JP'?'JP':prev.bonus;r[2]?.classList.add('h')}
 }
 }
}
function showRound(d){
 const prev=d.previous_result;if(!prev)return;
 const prior=(d.my_bets||[]).filter(b=>b.round_no===prev.round_no);
 const spent=prior.reduce((x,b)=>x+Number(b.amount||0),0);
 const win=prior.reduce((x,b)=>x+Number(b.payout||0),0);
 if(!spent)return;
 const emojis=(prev.positions||[prev.index]).map(i=>F[RING[i]][0]).join(' ');
 $('#pb').replaceChildren();
 const header=document.createElement('h3');header.textContent='Round '+prev.round_no+' · Verified result';
 const sym=document.createElement('div');sym.style.fontSize='40px';sym.textContent=emojis;
 const bonus=document.createElement('p');bonus.textContent=prev.bonus?'Bonus: '+prev.bonus:'No bonus';
 const spentNode=document.createElement('p');spentNode.textContent='Bet: '+fmt(spent)+' virtual coins';
 const winNode=document.createElement('h3');winNode.textContent='Your winnings: '+fmt(win)+' virtual coins';
 const close=document.createElement('button');close.textContent='Close';close.onclick=()=>$('#pop').style.display='none';
 const rankTitle=document.createElement('h3');rankTitle.textContent='🏆 Top 3 verified winners';
 const ranks=document.createElement('div');
 const winners=(prev.top_winners||[]).slice(0,3);
 ranks.textContent=winners.length?winners.map((w,i)=>
 ['🥇','🥈','🥉'][i]+' '+w.name+' (#'+w.public_id+'): '+fmt(w.total_win)).join(' · '):
 'No recorded winners in this round';
 $('#pb').append(header,sym,bonus,spentNode,winNode,rankTitle,ranks,close);
 $('#pop').style.display='flex';setTimeout(()=>$('#pop').style.display='none',4500);
}

$('#ss').textContent='TOP';
$('.tr').style.cursor='pointer';
$('.tr').onclick=async()=>{
 $('#pb').replaceChildren();
 const close=document.createElement('button');close.textContent='Close';
 close.onclick=()=>$('#pop').style.display='none';
 const result=document.createElement('div');result.textContent='Loading verified rankings…';
 $('#pb').append(result,close);$('#pop').style.display='flex';
