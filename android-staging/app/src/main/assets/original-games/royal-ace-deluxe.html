const $=id=>document.getElementById(id);
const R=['A','K','Q','J'],F=['♠','👑','👸','🎩'],SU=['♠','♥','♦','♣'];
const P=[[2.5,1.5,.5],[2,1.2,.4],[1.5,.9,.3],[1,.6,.2],[.5,.3,.1],[.5,.3,.1],[.25,.15,.05],[.25,.15,.05]];
const WT=[6,7,8,9,10,10,11,11],ML=[[1,2,3,5,10],[2,4,6,10,20]],BETS=[1000,10000,100000,1000000,10000000];
let bal=0,bi=0,bet=1000,busy=false,auto=false,turbo=false,G=[],fresh=new Set();
// Authoritative game balance is supplied by the Sharika server; never use browser storage.
const sleep=ms=>new Promise(r=>setTimeout(r,turbo?ms/3:ms));
const fmt=n=>Math.round(n).toLocaleString('en-US');
function upd(){$('bl').textContent=fmt(bal);$('bt').textContent=fmt(bet);/* Read-only display: wallet settlement happens in Cloudflare D1. */}
function gen(c){let s;if(Math.random()<.045)s=8;else{let t=Math.random()*WT.reduce((a,b)=>a+b),i=0;while((t-=WT[i])>0)i++;s=i}
return{s,g:s<8&&c>=1&&c<=3&&Math.random()<.1}}
function html(x){const s=x.s;return '<img draggable="false" src="'+(s<8?IM[(x.g?'g':'n')+s]:s==8?IM.s8:IM['w'+s])+'">'}
function render(marks,pop){const g=$('grid');g.innerHTML='';g.classList.toggle('hw',!!marks&&!pop);const f=turbo?.35:1;
for(let r=0;r<4;r++)for(let c=0;c<5;c++){const x=G[c][r],k=c*4+r,d=document.createElement('div');
let cl='c';if(x.d){cl+=' fall';d.style.setProperty('--d',x.d);d.style.setProperty('--dur',(.5*f)+'s');d.style.setProperty('--dl',((c*70+(3-r)*55)*f/1000)+'s');setTimeout(()=>SFX.land(c),((c*70+(3-r)*55)+470)*f)}
if(x.f){cl+=' flip';if(!window._fl){window._fl=1;SFX.flip();setTimeout(()=>window._fl=0,400)}}if(marks&&marks.has(k))cl+=(pop&&!x.g)?' pop':' win';x.d=0;x.fl=x.f;x.f=0;d.className=cl;d.innerHTML=x.fl?'<span class="fc">'+html(x)+'</span><img class="bk" src="'+IM.back+'">':html(x);g.appendChild(d)}}
function toast(a,b){const w=$('wp');w.innerHTML='<b>'+a+'</b><small>'+b+'</small>';w.className='';void w.offsetWidth;w.className='go'}
let fsDone=0,fsTotal=0,fsBase=0;
function showFS(){$('fsb').innerHTML='FREE SPINS <b>'+fsDone+' / '+fsTotal+'</b><span>'+(fsTotal-fsDone)+' left</span>'}
function evalG(){let win=0,mark=new Set();
for(let s=0;s<8;s++){let cnt=[];for(let c=0;c<5;c++){let n=0;for(let r=0;r<4;r++){const x=G[c][r].s;if(x==s||x>=9)n++}if(!n)break;cnt.push(n)}
const L=cnt.length;if(L>=3){win+=P[s][5-L]*cnt.reduce((a,b)=>a*b,1)*bet;for(let c=0;c<L;c++)for(let r=0;r<4;r++){const x=G[c][r].s;if(x==s||x>=9)mark.add(c*4+r)}}}
return{win,mark}}
function setCombo(i){$('cbar').src=free?IM.fbar:IM.mbar;const hl=$('hl');hl.style.left=(i*19.6+1)+'%'}
let free=false;
async function play(fr){free=fr;G=[];for(let c=0;c<5;c++){G.push([]);for(let r=0;r<4;r++){const x=gen(c);x.d=4;G[c].push(x)}}
render();setCombo(0);$('wn').textContent=fmt(fsBase);$('st').textContent=fr?'FREE GAME':MSG[0];await sleep(1000);
let combo=0,total=0;
while(true){const{win,mark}=evalG();if(!mark.size)break;
const m=ML[fr?1:0][Math.min(combo,4)];total+=win*m;if(total>=bet*10000)total=bet*10000;
setCombo(Math.min(combo,4));SFX.win(combo);$('wn').textContent=fmt(fsBase+total);
toast('+'+fmt(win*m),'Match '+(combo+1)+' · Combo x'+m);
render(mark);await sleep(1000);
if(total>=bet*10000)break;
render(mark,true);SFX.pop();await sleep(380);
let bigs=0;mark.forEach(k=>{const c=k>>2,r=k&3,x=G[c][r];if(x.g){const big=Math.random()<.5;if(big)bigs++;G[c][r]={s:big?9:10,g:false,f:1}}else G[c][r]=null});
for(let c=0;c<5;c++){const o=G[c];let rb=0;for(let r=3;r>=0;r--){if(o[r]==null)rb++;else o[r].d=rb}
const col=o.filter(x=>x),n=4-col.length,nw=[];for(let i=0;i<n;i++){const x=gen(c);x.d=n;nw.push(x)}G[c]=[...nw,...col]}
while(bigs-->0){const k=1+Math.floor(Math.random()*4);for(let i=0;i<k;i++){const c=1+Math.floor(Math.random()*4),r=Math.floor(Math.random()*4),x=G[c][r];if(x.s<8){G[c][r]={s:9,g:false,f:1}}}}
combo++;
if(combo>=1&&(combo>=4||Math.random()<.45)){let n=0;for(let t=0;t<12&&n<3;t++){const c=1+Math.floor(Math.random()*3),r=Math.floor(Math.random()*4),x=G[c][r];if(x.s<8&&!x.g){x.g=true;x.f=1;n++}}
if(n){$('st').textContent='⭐ Star Card! More Golden Symbols!';SFX.star();const p=$('pop');p.style.display='block';setTimeout(()=>p.style.display='none',900)}}
render();await sleep(1000)}
let sc=0;const sm=new Set();G.forEach((c,ci)=>c.forEach((x,ri)=>{if(x.s==8){sc++;sm.add(ci*4+ri)}}));
if(sc>=3){render(sm);SFX.scatter();toast('SCATTER x'+sc,fr?'+5 Free Spins!':'Free Game!');await sleep(1200)}
return{win:total,sc}}

function msg(t,btn){$('bx').innerHTML=t+`<br><button id="okb">${btn||'OK'}</button>`;$('ov').style.display='flex';return new Promise(r=>{$('okb').onclick=()=>{$('ov').style.display='none';r()}})}
async function freeGame(){SFX.fanfare();await msg('<div class="big-w">FREE GAME</div>3+ Scatter!<br>10 Free Spins · Multipliers x2 x4 x6 x10 x20','START');
fsTotal=10;fsDone=0;let tot=0;$('fsb').style.display='flex';
while(fsDone<fsTotal){fsDone++;showFS();fsBase=tot;const r=await play(true);tot+=r.win;bal+=r.win;upd();$('wn').textContent=fmt(tot);if(r.sc>=3){fsTotal+=5}showFS();await sleep(700)}
fsBase=0;$('fsb').style.display='none';free=false;setCombo(0);await bigWin(tot);await msg('<div class="big-w">'+fmt(tot)+'</div>Total Free Game Win','COLLECT')}

async function spin(buy){if(busy)return;const cost=buy?bet*10:bet;if(bal<cost){auto=false;$('au').classList.remove('on');msg('Not enough balance','OK');return}
busy=true;SFX.spin();$('sp').disabled=true;bal-=cost;upd();
if(buy)await freeGame();else{const r=await play(false);bal+=r.win;H.unshift([bet,r.win]);H.length=Math.min(H.length,30);upd();$('wn').textContent=fmt(r.win);await bigWin(r.win);if(r.sc>=3)await freeGame()}
busy=false;$('sp').disabled=false;if(auto)setTimeout(()=>spin(),600)}
$('sp').onclick=()=>spin();
$('bb').onclick=()=>{if(!busy&&confirm('Buy Bonus for '+fmt(bet*10)+' coins (10x bet)?'))spin(true)};

/* Sharika verified bridge. Never settle bets, choose outcomes, or persist coins here. */
(function(){
  const SOURCE='sharika-royal-ace',SERVER='sharika-royal-ace-server',pending=new Map();
  let ready=false,waiting=false,freeRemaining=0,activeBets=[1000,10000,100000,1000000,10000000];
  const loading=$('royal-loading'),spinner=$('sp'),errorBox=$('royal-network-error');
  const retryButton=$('royal-try-again');
  const room=new URLSearchParams(location.search).get('mode')==='room';
  if(room)document.body.classList.add('sharika-room');
  $('royal-loading-logo').src=IM.logo;
  try{$('royal-skip-intro').checked=localStorage.getItem('sharika_royal_intro_off')==='1'}catch(_){}
  $('royal-skip-intro').onchange=e=>{try{localStorage.setItem('sharika_royal_intro_off',e.target.checked?'1':'0')}catch(_){}};
  const showError=s=>{loading.style.display='flex';errorBox.style.display='block';errorBox.textContent=s;retryButton.style.display='block';};
  const clearError=()=>{errorBox.style.display='none';errorBox.textContent='';retryButton.style.display='none';};
window.installStakePicker({balance:()=>bal, selected:()=>bet, select:amount=>{if(!activeBets.includes(amount))activeBets.push(amount);bi=activeBets.indexOf(amount);bet=amount;upd();}, locked:()=>!ready||busy||freeRemaining>0});
  retryButton.onclick=()=>{ready=false;connectRetries=0;clearError();requestConnection();};
  const hideIntro=()=>{loading.style.display='none';};
  spinner.disabled=true;$('bb').disabled=true;
  const previewBalance=v=>{if(Number.isSafeInteger(v)&&v>=0){bal=v;upd();}};
  const replyToHost=data=>parent.postMessage({...data,source:SOURCE},'*');
  // An iframe may send its first ready event before the host listener/session is
  // available. Re-send only the read-only state handshake; never auto-submit bets.
  let connectTimer=null,connectRetries=0;
  const requestConnection=()=>{
    if(ready)return;
    clearTimeout(connectTimer);
    $('royal-loading-caption').textContent='Connecting to Sharika…';
    replyToHost({type:'ready'});
    connectTimer=setTimeout(()=>{
      if(ready)return;
      if(connectRetries<2){connectRetries++;requestConnection();}
      else showError('Connection not confirmed. Tap Retry connection. No bet was submitted.');
    },3500);
  };
  const id=()=>{const a=new Uint8Array(16);crypto.getRandomValues(a);return 'ra_'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');};
  const awaitRound=(key,ms=25000)=>new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>{pending.delete(key);reject(Error('Server response timed out. Check connection.'))},ms);
    pending.set(key,{resolve:v=>{clearTimeout(timeout);resolve(v)},reject:e=>{clearTimeout(timeout);reject(e)}});
  });
  window.addEventListener('message',event=>{
    if(event.source!==parent||!event.data||event.data.source!==SERVER)return;
    const d=event.data;
    if(d.type==='init'){
      clearTimeout(connectTimer);connectRetries=0;
      if(!Array.isArray(d.bets)||!d.bets.every(x=>Number.isSafeInteger(x)&&x>0))return showError('Game configuration is unavailable.');
      clearError();activeBets=d.bets;freeRemaining=Number(d.freeSpins)||0;
      bet=freeRemaining>0?Number(d.lockedBet):activeBets[0];
      if(!activeBets.includes(bet))activeBets.push(bet);
      bi=activeBets.indexOf(bet);ready=true;
      previewBalance(d.balance);spinner.disabled=false;$('bb').disabled=false;
      $('royal-progress-fill').style.width='100%';$('royal-loading-caption').textContent='Ready';
      setTimeout(hideIntro,$('royal-skip-intro').checked?0:650);
      if(freeRemaining){$('st').textContent='Free Spins: '+freeRemaining+' remaining';}
    }else if(d.type==='gameError'){
      clearTimeout(connectTimer);
      ready=false;spinner.disabled=true;$('bb').disabled=true;
      showError('Server unavailable: '+String(d.error||'Please try again'));
    }else if(d.type==='spinResult'&&typeof d.id==='string'){
      const cb=pending.get(d.id);if(!cb)return;pending.delete(d.id);
      if(d.error)cb.reject(Error(String(d.error)));else cb.resolve(d);
    }
  });
  const confirmedRound=async(requestId,amount,buy)=>{
    for(let attempt=0;attempt<3;attempt++){
      try{
        const receipt=awaitRound(requestId,11000);
        replyToHost({type:'spin',id:requestId,bet:amount,buy:!!buy});
        return await receipt;
      }catch(error){
        const transient=/timeout|network|unavailable|failed|busy|temporar|connection/i.test(String(error?.message||error));
        if(!transient||attempt===2)throw error;
        $('st').textContent='Reconnecting safely · same bet ID';
        await sleep(650*(attempt+1));
      }
    }
  };
  const spinTaps=[];
  function manualSpin(){
    if(!ready)return;
    if(!busy&&!waiting)return spin(false);
    spinTaps.push({amount:activeBets[bi],free:freeRemaining>0});
    $('st').textContent=spinTaps.length+' spins pending';
  }
  spin=async function(buy=false,amount=activeBets[bi]){
    if(busy||waiting)return;
    if(!ready){showError('Connect to Sharika server before playing.');return;}

    const cost=buy?amount*10:freeRemaining?0:amount;
    if(bal<cost){spinTaps.length=0;auto=false;$('au').classList.remove('on');await msg('Not enough balance','OK');return;}
    busy=true;waiting=true;
    const requestId=id();
    let completed=false;
    $('st').textContent='Verifying bet with Sharika server…';
    try{
      const r=await confirmedRound(requestId,amount,buy);
      if(!Number.isSafeInteger(r.win)||r.win<0||!Number.isSafeInteger(r.balance)||r.balance<0||
         !Array.isArray(r.steps))throw Error('Invalid server response.');
      clearError();waiting=false;SFX.spin();
      freeRemaining=Number(r.freeSpins)||0;
      free=r.mode==='free';
      const steps=r.steps.slice(0,12);
      for(const step of steps){
        if(!Array.isArray(step.grid)||step.grid.length!==5)continue;
        G=step.grid.map(col=>col.map(x=>({s:x.s,g:!!x.g,d:0,f:0})));
        render(new Set(Array.isArray(step.marks)?step.marks:[]));
        if(step.multiplier)setCombo(Math.min(4,Number(step.combo)||0));
        await sleep(270);
      }
      previewBalance(r.balance);
      $('wn').textContent=fmt(r.win);
      H.unshift([amount,r.win]);if(H.length>30)H.pop();
      if(r.win>0){SFX.win(0);toast('+'+fmt(r.win),'Verified win');}
      if(r.bonusSpins>0){SFX.scatter();toast('FREE SPINS','+'+r.bonusSpins);}
      $('st').textContent=freeRemaining?'Free Spins: '+freeRemaining+' remaining':MSG[0];
      if(r.win>0)await bigWin(r.win);
      completed=true;
    }catch(err){
      spinTaps.length=0;auto=false;$('au').classList.remove('on');
      const code=String(err?.message||'Connection error');
      const declined=/^(?:spin_rate_limited|not_enough_balance|free_spins_active|free_spin_bet_locked|invalid_bet|request_id_conflict)$/.test(code);
      if(declined){
        // D1 rejected this bet. Do not cover the game with a reconnect overlay
        // and do not automatically resubmit it with a fresh request ID.
        const description=code.replace(/_/g,' ');
        $('st').textContent='Bet not accepted: '+description;
        toast('BET NOT ACCEPTED',description);
        if(code!=='spin_rate_limited')replyToHost({type:'ready'});
      }else{
        // Unknown network results can be settled on D1. Never refund locally
        // or automatically start another bet; require a verified state refresh.
        ready=false;
        showError('Spin not confirmed. Reconnect and check your balance: '+code);
      }
    }finally{busy=false;waiting=false;spinner.disabled=!ready;}
    while(completed&&ready&&spinTaps.length){
      const next=spinTaps.shift();
      if(next.free&&!freeRemaining)continue;
      return spin(false,freeRemaining?activeBets[bi]:next.amount);
    }
    if(completed&&ready&&(auto||freeRemaining>0))setTimeout(()=>spin(false),750);
  };
  $('sp').onclick=manualSpin;
  $('bb').onclick=()=>{if(!ready||busy)return;
    if(confirm('Buy 10 Free Spins for '+fmt(bet*10)+' virtual coins?'))spin(true);};
  $('pl').onclick=()=>{if(busy||!ready||freeRemaining>0)return;bi=(bi+1)%activeBets.length;bet=activeBets[bi];upd();};
  $('mn').onclick=()=>{if(busy||!ready||freeRemaining>0)return;bi=Math.max(0,bi-1);bet=activeBets[bi];upd();};
  $('gr').onclick=()=>{if(busy)return;
    $('bx').innerHTML='<h2>Game Menu</h2><button class="mb" data-menu="rules">Game Rules</button><button class="mb" data-menu="history">Records</button><button class="mb" data-menu="sound">Sound '+(mute?'OFF':'ON')+'</button><button class="mb" data-menu="close">Close</button>';
    $('ov').style.display='flex';
    $('bx').querySelectorAll('[data-menu]').forEach(x=>x.onclick=()=>{
      $('ov').style.display='none';if(x.dataset.menu==='rules')$('inf').click();
      else if(x.dataset.menu==='history')$('rc').click();
      else if(x.dataset.menu==='sound')mute=!mute;
    });
  };
  $('hm').onclick=()=>replyToHost({type:'close'});
  const originalRules=$('inf').onclick;
  $('inf').onclick=event=>{
    if(typeof originalRules==='function')originalRules.call($('inf'),event);
    const panel=$('bx');
    if(panel&&panel.querySelector('h2')){
      const note=document.createElement('p');
      note.style.cssText='font:700 13px system-ui;color:#ffe4a2;padding:8px;border:1px solid #c68d48;border-radius:8px';
      note.textContent='Sharika Staging payouts: 7.5% of the original gross wins; maximum 10× stake per spin. All results and balances are settled by the server.';
      panel.appendChild(note);
    }
  };
  requestConnection();
})();

</script></body></html>
