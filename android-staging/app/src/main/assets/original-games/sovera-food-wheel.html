<style>
:root{--bg:#06141f;--teal:#00bdb0;--red:#d8282a;--cream:#fdf1d9;--gold:#f3c640;--br:#a8452c;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}
body{background:var(--bg);font-family:system-ui,"Noto Sans Bengali",sans-serif;overflow:hidden;color:#222}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:auto;position:relative;background:var(--teal);overflow:hidden}
.room{display:none;height:34%;background:linear-gradient(#f08a4b,#8a4a7a 45%,#27456b);position:relative;color:#fff;padding:10px}
.in .room{display:block}.room small{opacity:.8}
.mics{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:space-around}
.mics i{width:50px;height:50px;border-radius:50%;border:2px solid #fff6;display:grid;place-items:center;font-style:normal;font-size:11px}
.sheet{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--teal);position:relative}
.hd{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff;font-size:14px}
.hd b{flex:1;font-weight:500}.rb{width:36px;height:36px;border-radius:50%;border:0;background:#0a8f86;color:#fff;font-size:17px}
.mid{flex:1;min-height:0;display:flex;align-items:stretch}
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
.wheel{position:relative;container-type:inline-size;flex:none}
.wheel svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;width:18cqw;height:17cqw;transform:translate(-50%,-50%);background:var(--cream);border-radius:50% 50% 2cqw 2cqw/38% 38% 2cqw 2cqw;border:0;font:inherit;cursor:pointer;text-align:right;transition:filter .2s}
.slot .ic{position:absolute;left:-4cqw;top:-3.5cqw;font-size:10.5cqw;line-height:1}
.slot .mx{position:absolute;right:2.5cqw;top:2cqw;font-size:3.6cqw;color:#5b2fb5;font-style:italic}
.slot .am{position:absolute;left:0;right:0;top:6.5cqw;text-align:center;font-size:3.3cqw;color:#555}
.slot .bn{position:absolute;left:-1cqw;right:-1cqw;bottom:-1cqw;height:5.5cqw;background:#ffe86e;border:.8cqw solid var(--br);border-radius:2cqw}
.closed .slot{filter:sepia(.45) brightness(.8)}.closed .slot .bn{background:#8b6a2c}
.slot.hl{filter:none!important;box-shadow:0 0 0 1cqw #ff3b3b,0 0 4cqw 2cqw #fff7}
.slot.win{animation:bl .5s 6}@keyframes bl{50%{transform:translate(-50%,-50%) scale(1.12)}}
.g{color:#f0a800}

.cat{position:absolute;transform:translate(-50%,-50%);border:0;background:none;font-size:9cqw;text-align:center;cursor:pointer}

.res{display:flex;gap:6px;align-items:center;padding:6px 10px;background:#9b1d1f;color:#fff;font-size:12px}

.res i.nw:after{content:"NEW";position:absolute;top:-8px;left:-4px;background:#ffe000;color:#e00;font-size:9px;font-weight:700;border-radius:4px;padding:0 3px}
.chips{display:flex;justify-content:space-around;padding:8px}

.auto{border:2px solid var(--br);background:#ffd94a;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;margin-left:auto}.auto.on{background:#7ee06a}
.in .mid{padding:0}.in .res{flex-direction:column;width:52px;order:-1;background:#0a8f86;padding:18px 6px;justify-content:flex-start}

.in .me{background:var(--red)}

.rp{position:absolute;left:3%;right:3%;bottom:14%;background:#a8452c;padding:8px;transform:translateY(140%);opacity:0;pointer-events:none;transition:transform .4s,opacity .3s;z-index:5;border-radius:22px}

.wb{position:absolute;top:6px;left:50%;transform:translate(-50%,-250%);transition:transform .6s;z-index:6;width:92%;background:linear-gradient(#2a6f8f,#0f8f92);border:2px solid #e0a63a;color:#fff;font-weight:800;padding:8px 14px;border-radius:30px;font-size:16px;display:flex;align-items:center;gap:10px;box-shadow:0 0 0 3px #f3c64066}
.wb.show{transform:translate(-50%,0)}
.ld{position:absolute;inset:0;z-index:20;background:radial-gradient(#10375a,#041018);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#cfeaff;transition:opacity .5s}

.tg{position:absolute;right:6px;top:6px;z-index:30;font-size:11px;background:#000a;color:#fff;border:0;border-radius:14px;padding:4px 9px}

/* Same-origin native parent owns ALL identity and wallet operations.
 * The iframe is never given tokens, credentials, database handles, or
 * permission to credit local coins. Its only mutation is an authenticated bet. */
const GameBridge=(()=>{
  const game=document.documentElement.getAttribute('data-original-game');
  const pending=new Map();let seq=0;
  window.addEventListener('message',e=>{
    if(e.source!==window.parent||!e.data||e.data.type!=='sharika:original-response')return;
    const p=pending.get(e.data.id);if(!p)return;
    clearTimeout(p.timeout);pending.delete(e.data.id);
    if(e.data.ok)p.resolve(e.data.value||{});
    else p.reject(Error(e.data.error||'server_unavailable'));
  });
  function call(action,method='GET',body=null){
    return new Promise((resolve,reject)=>{
      if(window.parent===window){reject(Error('Open this game from Sharika app'));return;}
      const id=++seq;
      const timeout=setTimeout(()=>{pending.delete(id);reject(Error('server_timeout'));},18000);
      pending.set(id,{resolve,reject,timeout});
      window.parent.postMessage({type:'sharika:original-request',id,game,action,method,body},'*');
    });
  }
  let state=null,prev=-1,busy=false;
  let refreshHandler=()=>{},errorHandler=()=>{};
  const clock=()=>state?Date.now()+(state.server_time-Date.nowAtReceive)-0:Date.now();
  // Timestamp offset remains stable across local time ticks.
  let receivedAt=Date.now();
  function now(){return state?Date.now()+(state.server_time-receivedAt):Date.now();}
  async function refresh(){
    if(busy)return;
    busy=true;
    try{
      const data=await call('state');
      const previousRound=state?.previous_result?.round_no;
      state=data;receivedAt=Date.now();
      refreshHandler(data,now(),previousRound!==data.previous_result?.round_no);
    }catch(e){errorHandler(e.message||'Unable to reach server');}
    finally{busy=false;}
  }
  function onRefresh(fn){refreshHandler=fn;}
  function onError(fn){errorHandler=fn;}
  async function bet(pick,amount){
    if(!state||now()>=state.round.bet_closes_ms)throw Error('Betting closed');
    const request_id='og:'+game+':'+Date.now().toString(36)+':'+Math.random().toString(36).slice(2,13);
    const result=await call('bet','POST',{round_no:state.round.round_no,pick,amount,request_id});
    await refresh();return result;
  }
  function start(){refresh();setInterval(refresh,1550);}
  function get(){return state;}
  return {call,refresh,bet,onRefresh,onError,now,start,get};
})();

function makeChips(){
  $('chips').innerHTML=CH.map(c=>'<button class="chip'+(c===chip?' on':'')+'" data-c="'+c+'">🪙<br>'+fmt(c)+'</button>').join('');
}
function render(d){
  const current=d.round.round_no;
  bets={};for(const b of d.my_bets||[])if(b.round_no===current)bets[b.pick_index]=(bets[b.pick_index]||0)+b.amount;
  $('rn').textContent=current;$('bal').textContent=fmt(d.coins);$('rev').textContent=fmt(d.today_won||0);
  $('pot').textContent='Server';W.classList.toggle('closed',d.round.phase!=='bet');
  S.forEach((s,i)=>{$('s_'+s.id).querySelector('.am span:last-child').textContent=fmt(bets[i]||0);$('s_'+s.id).classList.remove('hl')});
  const prev=d.previous_result;
  if(prev){
    S[prev.index]&&$('s_'+S[prev.index].id).classList.add('hl');
    const shown=S[prev.index]||S[0];
    $('res').innerHTML='<div class="rbx"><span>Last result:</span><i class="nw">'+ic(shown)+'</i><small> Round '+prev.round_no+'</small></div>';
    lastResult=prev.round_no;
  }else $('res').textContent='Live synchronized round';
  makeChips();
  const left=Math.max(0,Math.ceil((d.round.bet_closes_ms-GameBridge.now())/1000));
  $('hb').textContent=d.round.phase==='bet'?'Select Time':'SPINNING';
  $('ht').textContent=String(left);
}

  if(waiting)return;
  const d=GameBridge.get();
  if(!d||d.round.phase!=='bet'){modal('Betting is closed for this round');return;}
  waiting=true;
  try{await GameBridge.bet(i,amount)}catch(e){modal(e.message||'Bet failed')}
  finally{waiting=false;}
}
S.forEach((s,i)=>{$('s_'+s.id).onclick=()=>place(i,chip)});
for(const g of ['v','m'])$('c_'+g).onclick=async()=>{
  // The original SALAD and PIZZA select four *separate* spots.
  if(waiting)return;waiting=true;
  try{for(const s of S.filter(s=>s.g===g)){const i=S.indexOf(s);
    await GameBridge.bet(i,chip);
  }}catch(e){modal('Some selections were not placed: '+e.message)}
  finally{waiting=false;GameBridge.refresh()}
};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){chip=Number(b.dataset.c);makeChips()}};
$('hp').onclick=()=>modal('Original Food Wheel: select a chip and food to place a real virtual-coin bet. The result is shared by all players. Winning food pays the displayed multiplier. SALAD/PIZZA each place four separate bets. No fake coins or bots.');
$('au').onclick=()=>modal('Auto-betting is disabled to protect your wallet. Select each bet manually.');
$('ad').style.display='none';
$('bk').onclick=()=>parent.postMessage({type:'sharika:original-exit'},'*');
$('tg').onclick=()=>{app.classList.toggle('in');setTimeout(fit,100)};
$('mu').onclick=()=>modal('Sound effects are not enabled in this secure game build.');
$('mh').onclick=async()=>{
 try{
 const [h,r]=await Promise.all([GameBridge.call('history'),GameBridge.call('rankings')]);
 const history=(h.rounds||[]).slice(0,10).map(x=>'Round '+x.round_no+': '+(S[x.index]?.e||'?')).join('\n')||'No rounds yet';
 const top=(r.rankings||[]).slice(0,3).map((x,i)=>(i+1)+'. '+x.name+' · '+fmt(x.total_win)).join('\n')||'No real winners yet';
 $('mc').style.whiteSpace='pre-line';
 modal('Last rounds:\n'+history+'\n\n🏆 Daily ranking:\n'+top);
 }catch(e){modal(e.message)}
};
GameBridge.onRefresh((d,now,changed)=>{render(d);if(changed&&d.previous_result){
  const winners=d.previous_result.top_winners||[];
  if(winners.length){
    const parent=$('rp').firstElementChild;parent.replaceChildren();
    const title=document.createElement('h4');
    title.textContent='🏆 Round '+d.previous_result.round_no+' — Top 3 verified winners';
    parent.appendChild(title);
    for(const [i,w] of winners.entries()){
      const row=document.createElement('p');
      row.textContent=['🥇','🥈','🥉'][i]+' '+w.name+' (#'+w.public_id+') · '+fmt(w.total_win)+' coins';
      parent.appendChild(row);
    }
    $('rp').classList.add('show');
    setTimeout(()=>$('rp').classList.remove('show'),5000);
  }
  const previousBets=(d.my_bets||[]).filter(b=>b.round_no===d.previous_result.round_no);
  const total=previousBets.reduce((a,b)=>a+(b.payout||0),0);
  if(total>0){$('win').textContent='🎉 WIN '+fmt(total)+' virtual coins';$('win').classList.add('show');setTimeout(()=>$('win').classList.remove('show'),4000)}
}});
GameBridge.onError(e=>{$('res').textContent='Server unavailable: '+e});
setInterval(()=>{const d=GameBridge.get();if(d){const sec=Math.max(0,Math.ceil((d.round.bet_closes_ms-GameBridge.now())/1000));$('ht').textContent=sec}},200);
addEventListener('resize',fit);setTimeout(()=>{$('ld').style.display='none';fit();GameBridge.start()},900);
</script></body></html>
