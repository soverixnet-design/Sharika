<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sovera Gaddy Game • Sharika</title>
<style>
:root{--teal:#00bcb0;--red:#d62828;--wood:#a8472b;--gold:#ffe66d;--cream:#fff1d6;--ink:#4a2410;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#1a1020;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:var(--ink);overflow:hidden}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#room{flex:0 0 0;overflow:hidden;background:linear-gradient(#7a3b2e,#e0894a 60%,#3a4a7a);color:#fff;position:relative;transition:flex-basis .3s}
.inside #room{flex-basis:36%}
#room .mics{display:flex;gap:18px;justify-content:center;padding-top:80px}
#room .mics i{width:56px;height:56px;border-radius:50%;border:2px solid #fff6;display:block}
#room b{position:absolute;left:12px;top:10px;background:#0006;padding:6px 12px;border-radius:20px;font-size:13px}
#game{flex:1;background:var(--teal);display:flex;flex-direction:column;position:relative;min-height:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:#fff;font-weight:700;font-size:14px}
.top button{width:34px;height:34px;border-radius:50%;border:0;background:#0a8f86;color:#fff;font-size:16px;margin-left:6px}
#stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
#wheel{position:relative;width:min(100%,62vh);aspect-ratio:1;max-height:100%}
.inside #wheel{width:min(92%,38vh)}
.slot{position:absolute;width:27%;aspect-ratio:1/1.05;transform:translate(-50%,-50%);background:var(--cream);border-radius:50% 50% 14px 14px/38% 38% 14px 14px;border:3px solid #e8b27a;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .12s;padding-top:2%}
.slot .e{font-size:clamp(24px,8vw,40px);line-height:1}
.slot .m{position:absolute;right:6%;top:6%;font-weight:900;color:#5b2bb5;font-size:clamp(11px,3.4vw,16px)}
.slot .b{position:absolute;left:0;right:0;bottom:0;height:34%;background:var(--gold);border-radius:4px 4px 10px 10px;font-weight:800;font-size:clamp(11px,3.4vw,15px);display:flex;align-items:center;justify-content:center;border-top:3px dashed #f0c23d}
.slot.on{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 0 4px #fff,0 0 22px 6px #fff8;z-index:3}
.slot.win{animation:pop .5s 3}
@keyframes pop{50%{transform:translate(-50%,-50%) scale(1.25)}}
#hub{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#b9f06a,#e9a85a 70%);border:5px solid var(--wood);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9%;font-weight:800;font-size:clamp(10px,3vw,13px);z-index:2;color:var(--ink);text-align:center;line-height:1.15}
#hub big{font-size:clamp(20px,7vw,32px);color:#fff;text-shadow:0 2px 0 var(--wood)}
#hub .big{font-size:clamp(26px,9vw,44px);position:absolute;top:18%}
.spoke{position:absolute;left:50%;top:50%;width:2.5%;height:38%;background:var(--wood);transform-origin:50% 0;border-radius:4px}
.mid{display:flex;gap:8px;padding:6px 10px}
.panel{flex:1;background:#e8964f;border:3px solid #a8472b;border-radius:12px;padding:8px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--ink);min-width:0}
.panel .av{width:38px;height:38px;border-radius:8px;background:#fff5;display:grid;place-items:center;font-size:22px;flex:none}
#hist{background:var(--cream);justify-content:center;font-size:15px;border:3px solid #a8472b}
.bottom{background:var(--red);padding:8px 10px 10px;color:#fff;flex:none}
#res{display:flex;align-items:center;gap:5px;background:#9a1c1c;border-radius:30px;padding:5px 10px;overflow:hidden}
#res span.l{font-weight:700;font-size:13px;margin-right:4px}
#res i{font-style:normal;width:34px;height:34px;flex:none;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:20px;position:relative}
#res i.new:after{content:"NEW";position:absolute;top:-9px;left:-4px;background:var(--gold);color:var(--ink);font-size:9px;font-weight:800;padding:0 4px;border-radius:3px}
#chips{display:flex;justify-content:space-around;margin:10px 0 6px}
.chip{width:21%;padding:12px 0 8px;background:linear-gradient(#fff8d8,#f6dc8a);border:3px solid #fff;border-radius:50% 50% 12px 12px/32% 32% 12px 12px;color:var(--ink);font-weight:800;font-size:14px;text-align:center;cursor:pointer}
.chip.sel{background:linear-gradient(#ff8a7a,#ff5a4a);color:#fff;transform:translateY(-6px);box-shadow:0 6px 0 #0004}
.foot{display:flex;align-items:center;gap:8px}
.foot .av{width:40px;height:40px;border-radius:8px;background:#fff3;display:grid;place-items:center;font-size:22px}
.pill{background:var(--cream);color:var(--ink);border-radius:20px;padding:5px 10px;font-weight:800;flex:1;min-width:0}
.pill small{display:block;font-size:10px;font-weight:600;opacity:.7}
#auto{background:var(--gold);border:3px solid #fff;border-radius:10px;font-weight:800;color:var(--ink);padding:6px 10px;font-size:13px}
#auto.on{background:#6df07a}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);background:#000b;color:#fff;padding:14px 22px;border-radius:16px;font-weight:800;font-size:20px;opacity:0;pointer-events:none;transition:.25s;z-index:9;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#sheet{position:absolute;inset:0;background:#000a;display:none;z-index:10;align-items:flex-end}
#sheet.show{display:flex}
#sheet div.in{background:var(--cream);width:100%;max-height:65%;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
#sheet table{width:100%;font-size:13px;border-collapse:collapse}
#sheet td,#sheet th{padding:6px 4px;border-bottom:1px solid #0001;text-align:left}
.g{color:#0a8a2a;font-weight:800}.r{color:#c11}
#game{background:radial-gradient(circle at 50% 30%,#2fe0d3,#00a89c 60%,#007c78)}
#stage{perspective:1000px}
#wheel{transform:rotateX(16deg);transform-style:preserve-3d;filter:drop-shadow(0 26px 14px #0005)}
.slot{background:linear-gradient(160deg,#fffaf0,#ffdca8 70%,#f0b46a);border:3px solid #fff3dc;box-shadow:0 6px 0 #c9803f,0 14px 14px #0004,inset 0 3px 6px #fff;transform:translate(-50%,-50%) translateZ(24px)}
.slot.on{transform:translate(-50%,-50%) translateZ(46px) scale(1.12);box-shadow:0 0 0 4px #fff,0 0 26px 8px #fff9,0 14px 16px #0005}
.slot .e{filter:drop-shadow(0 4px 3px #0006)}
.slot.win{animation:pop2 .5s 4}
@keyframes pop2{50%{transform:translate(-50%,-50%) translateZ(70px) scale(1.25)}}
#hub{background:radial-gradient(circle at 35% 30%,#e8ff9a,#7fcf3a 45%,#e9a85a 75%);box-shadow:0 8px 0 #7a3419,0 16px 18px #0006,inset 0 4px 8px #fff8;transform:translate(-50%,-50%) translateZ(34px)}
.spoke{background:linear-gradient(90deg,#c0603a,#7a3419);box-shadow:2px 0 4px #0004}
.chip{box-shadow:0 6px 0 #c9a24a,0 10px 10px #0004,inset 0 2px 4px #fff}
.chip.sel{box-shadow:0 8px 0 #a3261c,0 14px 14px #0005,inset 0 2px 4px #fff7}
.panel{box-shadow:0 4px 0 #7a3419,inset 0 2px 3px #fff6}
#auto{box-shadow:0 4px 0 #c9a24a}
.bottom{box-shadow:0 -6px 14px #0004}
#hub{justify-content:center;padding-bottom:0}
#hub .big{top:42%;left:50%;transform:translate(-50%,-50%);transition:opacity .2s;z-index:0}
#hub.faded .big{top:50%;opacity:.2;font-size:clamp(34px,11vw,54px)}
#hub #ht{position:relative;z-index:2}
#hub:not(.faded) #ht{position:absolute;bottom:9%}
#hub #tm{position:relative;z-index:3;font-size:clamp(26px,9vw,40px);line-height:1;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--wood),0 0 8px #0009}
#winners{position:absolute;left:8%;right:8%;top:46px;background:linear-gradient(#5b2bb5ee,#3a1a80ee);border:3px solid var(--gold);border-radius:16px;padding:8px 12px;color:#fff;z-index:8;display:none;box-shadow:0 8px 0 #1d0a4a,0 16px 24px #0006}
#winners.show{display:block;animation:wi .35s}
@keyframes wi{from{transform:translateY(-20px) scale(.9);opacity:0}}
#winners h4{margin:0 0 6px;text-align:center;color:var(--gold);font-size:14px}
#winners .row{display:flex;align-items:center;gap:8px;padding:4px 0;font-weight:700;font-size:14px}
#winners .av{width:30px;height:30px;border-radius:50%;background:#fff3;display:grid;place-items:center}
#winners .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#winners .a{color:#8dff9a}
#winners .me{margin-top:6px;padding-top:6px;border-top:1px solid #fff4;text-align:center;font-weight:800;font-size:13px}
#winners{left:0;right:0;top:auto;bottom:0;height:48%;border:4px solid #a8472b;border-bottom:0;border-radius:24px 24px 0 0;background:var(--cream);color:var(--ink);padding:10px 14px;box-shadow:0 -8px 20px #0006;overflow:auto}
#winners.show{display:block;animation:up .4s}
@keyframes up{from{transform:translateY(100%)}}
.rtop{display:flex;align-items:center;gap:10px;position:relative;padding-top:6px}
.big3{font-size:clamp(56px,18vw,84px);line-height:1;filter:drop-shadow(0 6px 4px #0005)}
.rinfo{flex:1;font-weight:700;font-size:14px;line-height:1.9;text-align:center}
.cd{position:absolute;right:0;top:-4px;color:#e02020;font-weight:800;font-size:22px}
.rkh{display:flex;align-items:center;gap:8px;margin:8px 0 6px;color:#e08a00;font-weight:900;font-size:clamp(15px,4.6vw,20px);text-shadow:0 2px 0 #fff}
.rkh i{flex:1;border-top:4px dashed #e8a21a}
.rk{display:flex;align-items:center;gap:8px;padding:5px 4px;font-weight:800;font-size:15px;border-bottom:1px solid #0001}
.rk .av{width:30px;height:30px;border-radius:50%;background:#0001;display:grid;place-items:center}
.rk .rkn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .a{color:#0a8a2a}
.dim .slot:not(.win){filter:grayscale(.6) brightness(.6)}
#banner{position:absolute;left:0;top:70px;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px 0 14px;background:linear-gradient(#ffe27a,#e8a21a 55%,#c27a0c);border:3px solid #fff0b8;border-left:0;border-radius:0 30px 30px 0;color:#fff;font-weight:900;font-size:18px;text-shadow:0 2px 0 #8a4f00;z-index:7;transform:translateX(-160%);transition:transform .5s;box-shadow:0 6px 0 #8a4f00,0 12px 16px #0005}
#banner.show{transform:none}
#banner b{background:#fff3b0;color:#c27a0c;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;text-shadow:none;font-size:13px;border:2px solid #fff}
#banner{padding:0 76px 0 16px;height:56px;background:linear-gradient(#fff0a0,#f5b81c 45%,#b86e06);border:3px solid #fff6c8;border-left:0;font-size:19px}
#banner:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(100deg,transparent 35%,#fffb 50%,transparent 65%);background-size:250% 100%;animation:shine 1.6s linear infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
#banner .wing{position:absolute;right:-40px;top:-16px;width:76px;height:86px;pointer-events:none;filter:drop-shadow(0 4px 3px #0005)}
#banner .crown{position:absolute;left:30px;top:-24px;font-style:normal;font-size:28px;filter:drop-shadow(0 3px 2px #0006)}
#winners{border-color:#c9802a;box-shadow:0 -8px 20px #0006,inset 0 0 0 3px #ffe9a8,inset 0 0 18px #ffd34d}
#hub:after{content:"";position:absolute;inset:-9%;border-radius:50%;border:5px dotted #fff7b0;animation:spin 6s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cf{position:absolute;top:-14px;width:8px;height:12px;z-index:11;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
#loader{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at 50% 35%,#1b4fd8,#0b1f6b 55%,#050b2e);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:24px;transition:opacity .5s}
#loader.off{opacity:0;pointer-events:none}
#loader img{width:min(62%,260px);filter:drop-shadow(0 10px 24px #4cf8);animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
#loader h1{margin:0;font-size:22px;letter-spacing:.5px}
#loader p{margin:0;opacity:.85;font-size:14px}
#lnum{font-size:32px;font-weight:900;color:#ffd34d}
.lb{width:70%;height:10px;border-radius:8px;background:#fff2;overflow:hidden}
.lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cf,#ffd34d);border-radius:8px}
.bonus{position:absolute;bottom:-2%;width:20%;text-align:center;font-size:clamp(30px,10vw,52px);line-height:1;transform:translateZ(20px);filter:drop-shadow(0 6px 4px #0005);transition:.3s;pointer-events:none}
.bonus span{display:block;font-size:clamp(9px,2.8vw,12px);font-weight:800;background:#fff3d6;color:var(--ink);border-radius:6px;margin-top:2px;padding:1px 0}
#bn-salad{left:0}#bn-pizza{right:0}
.bonus.hit{transform:translateZ(60px) scale(1.35);filter:drop-shadow(0 0 16px #fff) drop-shadow(0 0 28px #ffd34d)}
#plist{width:100%;max-height:96px;overflow-y:auto;background:var(--cream);border:3px solid #a8472b;border-radius:12px;box-shadow:0 4px 0 #7a3419,inset 0 2px 3px #fff6;color:var(--ink)}
.ph{position:sticky;top:0;background:#f3d9a8;font-size:11px;font-weight:800;padding:3px 10px;display:flex;justify-content:space-between}
.pr{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid #0001}
.pr .av{width:30px;height:30px;border-radius:50%;background:#0001;display:grid;place-items:center;flex:none}
.pn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.pn b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{font-size:10px;opacity:.7}
.pw{font-weight:800;font-size:13px}
.g2{color:#0a8a2a}
.pk{width:26px;text-align:center;font-weight:800;font-size:13px;flex:none}
.pr.me{background:#ffe9a8}
.stick{position:sticky;bottom:0;border-top:2px solid #a8472b}
.ph{font-size:10.5px;white-space:nowrap;gap:6px}
#plist{max-height:112px}
#stage{container-type:size;min-height:190px}
#wheel,.inside #wheel{width:min(94cqw,94cqh);height:min(94cqw,94cqh);aspect-ratio:auto;max-height:none}
.inside #room{flex-basis:24%}
#plist{max-height:84px}
#chips{margin:6px 0 4px}
.chip{padding:8px 0 6px}
.top{padding:6px 12px}
.mid{padding:4px 10px}
.slot{width:24%}
.inside #room{flex-basis:20%}
#plist{max-height:104px}
.pr{padding:3px 8px}
.pr .av{width:26px;height:26px}
.pn small{font-size:9px}
#rsheet{position:absolute;inset:0;background:#000a;display:none;z-index:12;align-items:flex-end}
#rsheet.show{display:flex}
#rsheet .in{background:var(--cream);width:100%;border-radius:18px 18px 0 0;padding:12px;border-top:4px solid #a8472b}
#rsheet .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:16px}
#rsheet .rh button{width:32px;height:32px;border-radius:50%;border:0;background:#a8472b;color:#fff;font-size:15px}
#rsheet #plist{max-height:min(62vh,460px);border:0;box-shadow:none;border-radius:10px;background:#fff7e6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
  #room{display:none!important}#game{min-height:100%;background:linear-gradient(145deg,#09a6a4,#035d66)}
  #mode,#auto{display:none!important}
  /* Keep all food graphics vivid, including when the betting window closes. */
  #wheel .slot:disabled{opacity:1;filter:none}
  #wheel .slot:enabled{cursor:pointer;touch-action:manipulation}
  #wheel .slot.pending{outline:3px solid #ffde64;outline-offset:3px;box-shadow:0 0 0 4px #ffc84680,0 10px 24px #ffc846aa}
  #toast{z-index:99}
  #gaddy-bet-ranking{position:absolute;top:5px;left:7px;right:7px;z-index:5;
    background:linear-gradient(145deg,#4f2b14ef,#24120def);color:#ffebc3;
    border:1.5px solid #ffcd67;border-radius:12px;padding:6px 10px;
    font-size:11px;box-shadow:0 4px 12px #0005;pointer-events:auto}
  .gaddy-rank-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .gaddy-rank-head strong{font-size:10px;letter-spacing:.4px}
  .gaddy-rank-head button{border:1px solid #fbd174;background:#ffcf70;color:#402108;
    border-radius:8px;font-size:10px;font-weight:800;padding:2px 8px;cursor:pointer}
  #gaddy-rank-top{display:flex;gap:5px;list-style:none;margin:4px 0 2px;padding:0}
  #gaddy-rank-top li{min-width:0;flex:1;display:flex;justify-content:space-between;gap:4px;
    background:#fff1d61c;border-radius:6px;padding:3px 5px}
  #gaddy-rank-top li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #gaddy-rank-top li b{white-space:nowrap;color:#ffe16d}
  #gaddy-rank-my{display:block;color:#ffe4a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  html.sharika-room-mini #app{max-width:none}
  html.sharika-room-mini #wheel{width:min(88%,41vh)}
  html.sharika-room-mini #gaddy-bet-ranking{padding:4px 7px}

    #gaddy-bet-ranking{padding:3px 7px}#gaddy-rank-top{margin:2px 0}}
