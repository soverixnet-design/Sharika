<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>জ্যাকপট ফ্রুট</title><style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}
body{background:radial-gradient(circle at 50% 20%,#4b1a7a,#12061f 75%);color:#fff;font-family:system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);display:flex;flex-direction:column;align-items:center;user-select:none;overflow-x:hidden}
#m{width:min(94vw,440px);padding:8px 0 16px}

#jt{text-align:center;font-size:clamp(40px,14vw,60px);font-weight:900;letter-spacing:2px;background:linear-gradient(#fff3a0,#f5b50a 55%,#b86a00);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b2f00) drop-shadow(0 0 14px #f90);margin-top:-6px}

#rl{display:flex;justify-content:center;gap:4px;margin:10px auto;width:62%;background:#c9c9d8;padding:6px;border-radius:12px;box-shadow:0 6px 0 #6a6a8a,0 12px 14px #000a}
#rl div{flex:1;height:54px;border-radius:8px;background:linear-gradient(#fff,#b8b8d0);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#4b1a9a}
#rl .h{background:linear-gradient(#ffe45a,#ff9a00);color:#6b1a00;box-shadow:0 0 16px #ffb300;animation:bl .4s infinite}@keyframes bl{50%{transform:scale(1.08)}}
#bd{background:linear-gradient(#9b7cf0,#5a3ab8);border-radius:22px;padding:10px;box-shadow:0 10px 0 #31207a,0 20px 26px #000a,inset 0 4px 8px #fff6}
#g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t{position:relative;aspect-ratio:1.05;border:0;border-radius:14px;background:linear-gradient(#1f6a62,#0e3a40);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #082a2e,inset 0 3px 6px #fff3;transition:.12s}
.t.p{background:linear-gradient(#5a2fb0,#2e1470);box-shadow:0 6px 0 #1c0a4a,inset 0 3px 6px #fff3}
.t:active{transform:translateY(4px)}.t b{font-size:clamp(34px,11vw,48px);font-weight:400;filter:drop-shadow(0 5px 3px #0009)}.t i{font-style:normal;font-weight:900;font-size:17px}
.t u{position:absolute;top:-6px;right:-4px;background:#e33;color:#fff;font-size:11px;padding:1px 6px;border-radius:9px;text-decoration:none}.t u:empty{display:none}
.t.hl{background:linear-gradient(#3a7bff,#1a3a9a);box-shadow:0 0 22px #6aa7ff,0 6px 0 #0a1a5a;border:3px solid #fff;transform:scale(1.07);z-index:2}
#tm{display:flex;align-items:center;justify-content:center;font-size:clamp(38px,13vw,56px);font-weight:900;font-family:monospace;color:#ffd23f;background:linear-gradient(#5a0a1a,#2a0510);border-radius:14px;border:3px dotted #ff4a6a;box-shadow:inset 0 0 14px #000}
#rs{display:flex;align-items:center;gap:6px;margin-top:10px;background:#3a1f8a;padding:6px 8px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:inset 0 2px 6px #0008}
#rs span{font-size:22px;background:#fff2;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center}#rs span:first-of-type{outline:2px solid gold}
#ch{display:flex;gap:8px;margin:14px 0 6px}#ch button{flex:1;height:44px;border-radius:22px;border:3px solid #5a7aff;background:linear-gradient(#2a3a8a,#12184a);color:#fff;font-weight:900;font-size:16px;box-shadow:0 6px 0 #0a0d2e}
#ch .on{border-color:#ff5a5a;background:linear-gradient(#ff6a6a,#b01a2a);transform:translateY(3px);box-shadow:0 3px 0 #5a0a14,0 0 14px #f55}
#bt{display:flex;gap:8px}#bt div,#bt button{flex:1;border-radius:24px;border:3px solid #a58aff;background:linear-gradient(#8a6ae0,#4a2aa0);padding:8px;text-align:center;font-weight:800;font-size:14px;color:#fff;box-shadow:0 6px 0 #2a1470}
#bt b{display:block;font-size:19px;color:#ffe06a}#bt button{font-size:22px}#bt button.on{background:linear-gradient(#ff6a6a,#b01a2a)}#bt button:active{transform:translateY(4px)}
#pop{position:fixed;inset:0;z-index:8;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}
#pb{width:100%;max-width:400px;background:linear-gradient(#4a3a9a,#2a1f6a);border:3px solid #b8a8ff;border-radius:22px;padding:18px;text-align:center;box-shadow:0 0 40px #8a6aff;max-height:85vh;overflow:auto}
#pb h3{color:#ffd84a;margin:8px 0}#pb p{margin:8px 0;line-height:1.5;text-align:left;font-size:14px}.rw{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-weight:800}
.av{width:64px;height:64px;border-radius:50%;background:#fff3;border:3px solid gold;margin:6px auto;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
#msg{height:22px;text-align:center;font-weight:800;color:gold;margin-top:8px}

#load h1{font-size:30px;color:gold;text-shadow:0 0 18px #f90}#load .e{font-size:64px;animation:sp 2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#lb{width:70%;max-width:320px;height:12px;background:#fff3;border-radius:8px;overflow:hidden}#lbar{height:100%;width:0;background:linear-gradient(90deg,gold,#f60);transition:width 1s linear}
#m{width:min(96vw,450px);background:linear-gradient(#6a4ac8,#3a2490 60%,#241468);border-radius:0 0 26px 26px;padding:8px 12px 16px;box-shadow:inset 0 4px 10px #fff5,0 0 40px #7a4aff66}
.hd{align-items:flex-start}.lc,.rc{display:flex;flex-direction:column;gap:6px;align-items:center}.rn{font-size:16px;color:#e8e0ff;margin-top:4px}#pg{color:#ffd84a;font-size:11px}
.tr{text-align:center;font-size:34px;line-height:1;filter:drop-shadow(0 3px 3px #000)}.tr small{display:block;font-size:12px;background:#b01a1a;border-radius:4px;padding:0 5px;color:#fff;margin-top:-4px}
#jt{-webkit-text-stroke:2px #7a3a00;font-size:clamp(44px,15vw,64px);margin-top:-30px;animation:sh 2.5s infinite}@keyframes sh{50%{filter:drop-shadow(0 4px 0 #6b2f00) drop-shadow(0 0 26px #ffcc33)}}
#jw{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:-4px}
#jw::before{content:"";position:absolute;left:2%;right:2%;top:18%;bottom:-10%;background:linear-gradient(90deg,#a81e12,#e8402a,#a81e12);clip-path:polygon(0 15%,100% 15%,95% 60%,100% 100%,0 100%,5% 60%);box-shadow:0 6px 10px #000}
#jw .cn{font-size:34px;z-index:1;filter:drop-shadow(0 3px 2px #000)}#jp{width:62%;margin:0;z-index:1}
#rw{position:relative;width:64%;margin:14px auto 10px}#rl{width:100%;margin:0}#rl div{position:relative;isolation:isolate;color:#fff;font-size:20px;background:linear-gradient(#e6e6f2,#9a9ab8);text-shadow:0 2px 2px #000}
.dm2::before{content:"";position:absolute;inset:2px;background:linear-gradient(#ffe066,#c98a00);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);z-index:-1}
.dm2::after{content:"";position:absolute;inset:10px;background:#2a1a8a;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);z-index:-1}
.bd2::before{content:"";position:absolute;inset:2px;border-radius:50%;background:linear-gradient(#ffe066,#c98a00);z-index:-1}.bd2::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#4a1ab0;z-index:-1}
#lv{position:absolute;right:-24px;top:2px;width:8px;height:46px;background:linear-gradient(90deg,#888,#fff,#888);border-radius:4px}#lv::before{content:"";position:absolute;top:-14px;left:-7px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a9a,#c00)}
#bd{position:relative}#bd::before,#bd::after{content:"";position:absolute;top:34px;bottom:34px;left:-9px;width:8px;background:radial-gradient(circle,#fff 40%,#ffd0ff 48%,transparent 52%) 0 0/8px 22px repeat-y;filter:drop-shadow(0 0 4px #f8f);animation:tw 1s infinite alternate}#bd::after{left:auto;right:-9px;animation-delay:.5s}@keyframes tw{to{opacity:.35}}
#g{padding:8px;background:#2a1a6a;border-radius:16px;box-shadow:inset 0 4px 10px #000a}
.t:not(.p) b{filter:drop-shadow(0 0 10px #8fffc0aa) drop-shadow(0 5px 3px #0009)}.t i{text-shadow:0 2px 2px #000}
#rs span{position:relative}#rs em{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:#ff4a8a;color:#fff;font-size:8px;font-style:normal;border-radius:6px;padding:0 4px}
.cw{flex:1;display:flex;flex-direction:column;align-items:center}#ch button{flex:none;width:100%;height:38px;font-size:14px}.am{width:64%;height:16px;margin-top:8px;border-radius:50% 50% 30% 30%;background:linear-gradient(#6ab0ff,#1a4ab0);box-shadow:0 5px 0 #0a1a5a,0 8px 8px #0008}.on+.am{background:linear-gradient(#ff7a7a,#c01a2a);box-shadow:0 2px 0 #5a0a14;transform:translateY(3px)}
#bt b::before{content:"🪙 "}#bt div{box-shadow:0 6px 0 #2a1470,inset 0 3px 6px #fff5}
.cr{position:fixed;top:-40px;z-index:10;font-size:28px;animation:fall 2s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#jt{margin-top:-6px!important;font-size:clamp(38px,13vw,54px)!important}.hd{position:relative;z-index:2}#rw{margin:8px auto}.t{aspect-ratio:1.25!important}.t b{font-size:clamp(30px,9vw,40px)!important}#bt b{font-size:16px;white-space:nowrap}#bt div,#bt button{padding:6px 4px}#ch{margin:10px 0 4px}#msg{margin-top:4px}.am{height:12px;margin-top:6px}</style></head><body>
<div id="load" style="--bg:radial-gradient(circle at 50% 35%,#5a1a8a,#0d0418 80%)"><i class="ld-sp" style="left:10%;top:60%;animation-delay:0s">✨</i><i class="ld-sp" style="left:85%;top:50%;animation-delay:1s">⭐</i><i class="ld-sp" style="left:20%;top:30%;animation-delay:2s">✨</i><i class="ld-sp" style="left:75%;top:25%;animation-delay:0.5s">✨</i><i class="ld-sp" style="left:50%;top:70%;animation-delay:1.5s">⭐</i><i class="ld-sp" style="left:92%;top:75%;animation-delay:2.5s">✨</i><i class="ld-sp" style="left:6%;top:80%;animation-delay:3s">⭐</i><div class="ld-top">🎮 SHAKIL M GAMES</div><div class="ld-hero"><div class="ld-stage"><div class="sm"><div class="jt">JACKPOT</div><div class="wn"><div class="reel"><div style="--t:0.9s"><span>🍒</span><span>🍋</span><span>🍉</span><span>🍌</span><span>🍓</span><span>7️⃣</span><span>🍒</span><span>🍋</span><span>🍉</span><span>🍌</span><span>🍓</span><span>7️⃣</span></div></div><div class="reel"><div style="--t:1.2s"><span>🍒</span><span>🍋</span><span>🍉</span><span>🍌</span><span>🍓</span><span>7️⃣</span><span>🍒</span><span>🍋</span><span>🍉</span><span>🍌</span><span>🍓</span><span>7️⃣</span></div></div><div class="reel"><div style="--t:1.5s"><span>🍒</span><span>🍋</span><span>🍉</span><span>🍌</span><span>🍓</span><span>7️⃣</span><span>🍒</span><span>🍋</span><span>🍉</span><span>🍌</span><span>🍓</span><span>7️⃣</span></div></div></div><div class="lv"></div><div class="bl"></div></div></div></div><div class="ld-bot"><div class="ld-rb">SHAKIL M GADDY GAME</div><div class="ld-tt">জ্যাকপট ফ্রুট</div><div class="ld-pb"><div id="ldf"><i>⭐</i></div><span id="ldp">0%</span></div><div class="ld-tp" id="ldt" data-t="[&quot;জ্যাকপট জিতলে পুলের একাংশ আপনার 🎰&quot;, &quot;🍒 ফলে ৪০ গুণ পর্যন্ত জয় 🍒&quot;, &quot;বোনাস x2, x3 এর অপেক্ষায় থাকুন ✨&quot;]">জ্যাকপট জিতলে পুলের একাংশ আপনার 🎰</div></div><div id="lb" style="display:none"><div id="lbar"></div></div><div id="lsub" style="display:none"></div></div>
<div id="m">
<div class="hd"><div class="lc"><button class="ib" id="pw">⏻</button><button class="ib" id="sn">🔊</button><small id="pg">📶 120ms</small></div><span class="rn">Round:<span id="rd"></span></span><div class="rc"><button class="ib" id="ru">💡</button><div class="tr">🏆<small id="ss">10:17</small></div></div></div>
<div id="jt">JACKPOT</div><div id="jw"><span class="cn">🪙</span><div id="jp"></div><span class="cn">🪙</span></div>
<div id="rw"><div id="rl"><div class="dm2">+1</div><div class="dm2">+2</div><div class="bd2">x2</div></div><i id="lv"></i></div>
<div id="bd"><div id="g"></div><div id="rs"></div></div>
<div id="msg"></div><div id="ch"></div>
<div id="bt"><div>আমার<b id="bal"></b></div><div>আজকের জয়<b id="td"></b></div><button id="au">Auto</button></div>
</div>
<div id="pop"><div id="pb"></div></div>
<script>
let lp=0;setTimeout(()=>lbar.style.width='10%',50);const lh=setInterval(()=>{lp++;lbar.style.width=(lp+1)*10+'%';if(lp>=10){clearInterval(lh);load.remove();phase='bet';t=20;ui()}},1000);
const $=s=>document.querySelector(s),fmt=n=>n>=1e6?+(n/1e6).toFixed(2)+'M':n>=1e3?+(n/1e3).toFixed(0)+'K':n;
const F=[['🍋',5],['🍇',5],['🥝',5],['🍒',40],0,['🍑',5],['🍉',20],['🍌',10],['🍓',10]],RING=[0,1,2,5,8,7,6,3],CH=[10000,100000,500000,1000000];
let bal=1000000;try{bal=+localStorage.getItem('jf_b')||1000000}catch(e){}
let ss0=617,chip=CH[0],bets=Array(9).fill(0),last=null,hist=[],t=20,phase='load',rd=1500,td=0,jp=21817399,auto=0,on=1,av='',nm='আপনি',ac;
function snd(f,d){if(!on)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const tiles=F.map((f,i)=>{const d=document.createElement('button');d.className='t'+(i>2&&i!=5&&i<6||i>5?' p':'');if(f){d.innerHTML=`<b>${f[0]}</b><i>${f[1]} times</i><u></u>`;d.onclick=()=>bet(i)}else{d.id='tm';d.className='';d.disabled=true}$('#g').appendChild(d);return d});
tiles.forEach((d,i)=>{if(i==3||i==6||i==7||i==8)d.classList.add('p')});
$('#ch').innerHTML=CH.map((c,i)=>`<div class="cw"><button class="${i?'':'on'}" data-c="${c}">${['🔵','🟡','🟠','🟣'][i]} ${fmt(c)}</button><i class="am"></i></div>`).join('');
document.querySelectorAll('#ch button').forEach(b=>b.onclick=()=>{chip=+b.dataset.c;document.querySelectorAll('#ch button').forEach(x=>x.classList.toggle('on',x==b))});
function ui(){$('#rd').textContent=rd;$('#bal').textContent=bal.toLocaleString();$('#td').textContent=td.toLocaleString();$('#jp').textContent=Math.floor(jp).toLocaleString();
$('#tm').textContent=phase=='bet'?String(t).padStart(2,'0'):'--';tiles.forEach((d,i)=>{const u=d.querySelector&&d.querySelector('u');if(u)u.textContent=bets[i]?fmt(bets[i]):''});
$('#rs').innerHTML='<b>Result</b>'+hist.map((i,k)=>`<span>${F[i][0]}${k?'':'<em>NEW</em>'}</span>`).join('');try{localStorage.setItem('jf_b',bal);parent.postMessage({type:'wallet',balance:bal},'*')}catch(e){}}
function msg(s){$('#msg').textContent=s;clearTimeout(msg.h);msg.h=setTimeout(()=>$('#msg').textContent='',2200)}
function bet(i){if(phase!='bet')return msg('বেট বন্ধ');if(bal<chip)return msg('কয়েন যথেষ্ট নয়');bal-=chip;bets[i]+=chip;jp+=chip*.05;snd(520,.06);ui()}
function pick(){const c=RING.map(i=>1/F[i][1]),s=c.reduce((a,b)=>a+b);let r=Math.random()*s;for(let k=0;k<8;k++){if((r-=c[k])<0)return RING[k]}return 0}
function bonus(){const r=Math.random();return r<.90?'':r<.94?'+1':r<.96?'+2':r<.985?'x2':r<.995?'x3':'JP'}
function spin(){phase='spin';ui();const cost=bets.reduce((a,b)=>a+b,0),res=pick(),b=bonus();last=bets.slice();
let p=Math.floor(Math.random()*8),n=24+((RING.indexOf(res)-p+8)%8);const h=setInterval(()=>{tiles.forEach(d=>d.classList.remove('hl'));tiles[RING[p%8]].classList.add('hl');snd(300,.03);p++;if(n--<=0){clearInterval(h);bn(res,b,cost)}},90)}
function bn(res,b,cost){const rl=[...document.querySelectorAll('#rl div')];let k=0,x=0;const h=setInterval(()=>{rl.forEach((d,i)=>d.classList.toggle('h',i==k%3));k++;if(++x>9){clearInterval(h);rl.forEach(d=>d.classList.remove('h'));
if(b=='+1'||b=='+2')rl[b=='+1'?0:1].classList.add('h');if(b=='x2'||b=='x3'){rl[2].textContent=b;rl[2].classList.add('h')}if(b=='JP')rl.forEach(d=>d.classList.add('h'));fin(res,b,cost)}},120)}
function fin(res,b,cost){const rs=[res];if(b=='+1')rs.push(pick());if(b=='+2'){rs.push(pick(),pick())}
const mu=b=='x2'?2:b=='x3'?3:1;let g=Math.floor(rs.reduce((s,r)=>s+bets[r]*F[r][1],0)*mu),jb=0;
if(b=='JP'&&cost>=1000){const pc=cost>=1e6?.7:cost>=1e5?.5:cost>=1e4?.3:.1;jb=Math.floor(jp*pc);jp-=jb;g+=jb}
bal+=g;td+=g;rd++;rs.forEach(r=>hist.unshift(RING.indexOf(r)>=0?r:0));hist=hist.slice(0,8);if(g>0){snd(880,.4);rain()}
$('#pb').innerHTML=`<h3>Round ${rd-1}'s Result</h3><div style="font-size:42px">${rs.map(r=>F[r][0]).join(' ')}</div>${b?`<p style="text-align:center;color:#ffd84a">🎁 বোনাস: ${b=='JP'?'JACKPOT':b}</p>`:''}<div class="rw"><span>This Round Earnings:</span><span>🪙 ${g.toLocaleString()}</span></div><div class="rw"><span>This Round Cost:</span><span>🪙 ${cost.toLocaleString()}</span></div><h3>This Round Ranking</h3><div class="av">${av?`<img src="${av}">`:'👤'}</div><div>${nm}</div><div class="rw" style="justify-content:center">🪙 ${g.toLocaleString()}</div><small id="cd">(4s)</small>`;$('#pop').style.display='flex';
let c=4;const ch=setInterval(()=>{c--;$('#cd')&&($('#cd').textContent=`(${c}s)`);if(c<=0){clearInterval(ch);$('#pop').style.display='none';bets=Array(9).fill(0);tiles.forEach(d=>d.classList.remove('hl'));$('#rl div:nth-child(3)').textContent='x2';document.querySelectorAll('#rl div').forEach(d=>d.classList.remove('h'));phase='bet';t=20;if(auto)rebet();ui()}},1000);ui()}
function rain(){for(let i=0;i<24;i++){const c=document.createElement('i');c.className='cr';c.textContent='🪙';c.style.left=Math.random()*95+'vw';c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3000)}}
function rebet(){if(!last)return;last.forEach((v,i)=>{if(v&&bal>=v){bal-=v;bets[i]=v}})}
setInterval(()=>{ss0=ss0>0?ss0-1:617;$('#ss').textContent=Math.floor(ss0/60)+':'+String(ss0%60).padStart(2,'0');jp+=Math.random()*30;if(phase=='bet'){t--;if(t<=5&&t>0)snd(660,.08);if(t<=0)spin()}ui()},1000);
