<script>
const C={"key": "g_night", "round": 7, "chips": [10000, 100000, 500000, 1000000], "items": [["🌭", 10], ["🍢", 15], ["🍗", 25], ["🥩", 45], ["🥕", 5], ["🌽", 5], ["🥬", 5], ["🍅", 5]]};const $=s=>document.querySelector(s);
