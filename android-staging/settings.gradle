pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'SharikaAndroidStaging'
include ':app'
// The UI emulator fixture is never included in the installable Sharika APK.
// CI opts into this isolated module with -PincludeRoomQa=1.
if (providers.gradleProperty('includeRoomQa').isPresent()) include ':room-qa'
