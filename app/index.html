<style>
:root{--bg1:#1a0b45;--bg2:#07031a;--a:#9b4dff;--b:#ff3dc8;--gold:#f6c453;--c:#26d0ff;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--mu:#b0a7d6;--grn:#34d399;--red:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#05030f;color:#fff;font-family:system-ui,"Noto Sans Bengali","Hind Siliguri",sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
.app{width:100%;max-width:440px;height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg1),var(--bg2) 65%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;animation:dr 14s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:#8b3dff;top:-60px;left:-70px;opacity:.45}.b2{width:240px;height:240px;background:#1ec8ff;top:360px;right:-90px;opacity:.3;animation-delay:-5s}
@keyframes dr{to{transform:translate(30px,40px) scale(1.15)}}
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;padding:10px 14px 120px;display:none;scrollbar-width:none;z-index:2}
.view.on{display:block;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:20px;box-shadow:0 6px 16px rgba(155,77,255,.5)}
.hd h1{font-size:17px;flex:1;line-height:1.1}.hd h1 small{display:block;font-size:10.5px;color:var(--mu);font-weight:400}
.pill{padding:6px 12px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);font-size:12.5px;font-weight:600;white-space:nowrap}
.srch{display:flex;align-items:center;gap:8px;height:42px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.08);padding:0 14px;margin-bottom:12px}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font:inherit;font-size:15px}.srch input::placeholder{color:var(--mu)}
.ban{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.slide{flex:none;width:100%;height:128px;border-radius:22px;scroll-snap-align:center;position:relative;overflow:hidden;padding:18px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.slide::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 0,rgba(255,255,255,.3),transparent 55%)}
.slide b{font-size:19px;max-width:62%;line-height:1.25;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.35)}.slide small{font-size:12px;max-width:62%;opacity:.9;margin-top:5px;position:relative;z-index:1}
.slide i{position:absolute;right:16px;top:50%;font-size:74px;font-style:normal;transform:translateY(-50%);animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));z-index:1}
@keyframes fl{50%{transform:translateY(-58%) rotate(6deg)}}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 12px}.dots u{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.3);transition:.3s}.dots u.on{width:18px;background:var(--gold)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.qa button{border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:11px 2px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:5px}.qa span{font-size:24px}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;padding:7px 16px;border-radius:18px;border:1px solid var(--line);background:var(--glass);font-size:13px;color:var(--mu)}.tabs button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.card{perspective:800px;cursor:pointer;height:178px;touch-action:pan-y;animation:fi .4s both}
.sway{height:100%;animation:sw 5s ease-in-out infinite}
@keyframes sw{50%{transform:translateY(-5px)}}
.tilt{position:relative;height:100%;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}
.edge{position:absolute;inset:3px -2px -6px;border-radius:24px;background:rgba(0,0,0,.55);transform:translateZ(-14px);filter:blur(5px)}
.bg{position:absolute;inset:0;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -14px 24px rgba(0,0,0,.28)}
.pat{position:absolute;inset:-20px;font-size:30px;letter-spacing:14px;line-height:46px;opacity:.1;transform:rotate(-14deg);word-break:break-all}
.shine{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,30%) var(--my,15%),rgba(255,255,255,.42),transparent 58%);mix-blend-mode:soft-light}
.emo{position:absolute;right:8px;top:6px;font-size:58px;transform:translateZ(70px);filter:drop-shadow(0 12px 10px rgba(0,0,0,.45))}
.live{position:absolute;left:10px;top:10px;transform:translateZ(40px);display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;background:rgba(0,0,0,.4);font-size:10px;font-weight:700}
.live u{width:3px;background:var(--grn);border-radius:2px;animation:eq 1s ease-in-out infinite}.live u:nth-child(1){height:8px}.live u:nth-child(2){height:12px;animation-delay:-.3s}.live u:nth-child(3){height:6px;animation-delay:-.6s}

ns and items."],["Disclaimer","The app is provided as is and may sometimes be unavailable. To the extent allowed by law, we are not liable for indirect losses."],["Changes and contact","We may update these Terms; continuing to use the app means you accept the new version. Contact Customer Service from the Messages tab.\n\nLast updated: October 2026"]]]};
